<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Recibo — WhiteLink</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;family=Space+Mono:wght@700&amp;display=swap">
<style>
.rc{background:#F6F5F0;color:#16161A;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:16px}
.rc .k{font-size:12px;color:#5C5C66}.rc .v{font-size:15px;font-weight:600}
.rc .g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media print{.appbar,.tabbar,.rail,.no-print{display:none!important}body{background:#fff}.app-main{padding:0}.rc{border-radius:0}}
</style>
</helmet>
<div>
  <div class="appbar"><a class="icon-btn" href="/painel/plano" aria-label="Voltar"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></a><h1>Recibo</h1></div>
  <div class="app-main">
    <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}"><div style="color: #9C9CAD; padding-top: 30px">Carregando…</div></sc-if>
    <sc-if value="{{missing}}" hint-placeholder-val="{{ false }}"><div class="card" style="padding: 20px; color: #C9C9D6">Recibo não encontrado.</div></sc-if>
    <sc-if value="{{ok}}" hint-placeholder-val="{{ true }}">
      <div class="rc">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
          <div><b style="font: 700 22px 'Space Grotesk'">WhiteLink</b><div class="k">GM DIGITAL · WhatsApp (11) 99393-1841</div></div>
          <div style="text-align: right"><div class="k">RECIBO</div><b style="font: 700 17px 'Space Mono'">{{o.code}}</b></div>
        </div>
        <div style="height: 1px; background: #DDDAD0"></div>
        <div class="g">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="6"><div><div class="k">{{r.k}}</div><div class="v">{{r.v}}</div></div></sc-for>
        </div>
        <div style="height: 1px; background: #DDDAD0"></div>
        <div style="display: flex; justify-content: space-between; align-items: baseline"><b>Total pago</b><b style="font: 700 28px 'Space Grotesk'">{{o.value}}</b></div>
        <span class="k">Este recibo comprova o pagamento do plano. Não substitui nota fiscal.</span>
      </div>
      <button class="btn full no-print" onClick="{{print}}" style="margin-top: 14px">Salvar em PDF ou imprimir</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { loading: true, o: null, u: null }; }
  async componentDidMount() {
    const code = new URLSearchParams(location.search).get('c') || '';
    const [r, m] = await Promise.all([DC.api('orders/' + encodeURIComponent(code)), DC.api('me')]);
    if (r.status === 401) { location.href = '/entrar'; return; }
    this.setState({ loading: false, o: r.ok && r.order.status === 'liberado' ? r.order : null, u: m.ok ? m.user : null });
  }
  renderVals() {
    const s = this.state, o = s.o, u = s.u || {};
    const d = (t) => (t ? new Date(t).toLocaleDateString('pt-BR') : '—');
    return {
      loading: s.loading, missing: !s.loading && !o, ok: !!o, o: o || {},
      rows: o ? [
        { k: 'Cliente', v: u.name || '—' }, { k: 'E-mail', v: u.email || '—' },
        { k: 'Plano', v: o.planName + ' ' + o.periodName }, { k: 'Período', v: d(o.periodStart) + ' a ' + d(o.periodEnd) },
        { k: 'Forma de pagamento', v: 'Pix' }, { k: 'Pago em', v: d(o.paidAt) }
      ] : [],
      print: () => window.print()
    };
  }
}
</script>
</body>
</html>
