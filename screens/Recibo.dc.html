<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Recibo — WhiteLink</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:#0B0B10}
a{color:#D4FF3A}a:hover{color:#E6FF8A}
button,input{font-family:Inter,system-ui,sans-serif}

@media (max-width: 600px){
[style*="font-size: 60px"]{font-size:36px !important}
[style*="font-size: 44px"],[style*="font-size: 42px"],[style*="font-size: 40px"]{font-size:28px !important}
[style*="font-size: 38px"],[style*="font-size: 36px"],[style*="font-size: 34px"]{font-size:26px !important}
[style*="font-size: 32px"],[style*="font-size: 31px"],[style*="font-size: 30px"]{font-size:24px !important}
[style*="font-size: 29px"],[style*="font-size: 28px"],[style*="font-size: 27px"],[style*="font-size: 26px"]{font-size:21px !important}
[style*="font-size: 25px"],[style*="font-size: 24px"],[style*="font-size: 23px"],[style*="font-size: 22px"]{font-size:18px !important}
[style*="font-size: 20px"],[style*="font-size: 19px"]{font-size:16px !important}
[style*="font-size: 18px"],[style*="font-size: 17px"]{font-size:15px !important}
[style*="font-size: 16px"]{font-size:15px !important}
h1,h2{line-height:1.15 !important;letter-spacing:-0.01em !important}
p{line-height:1.5 !important}
[style*="padding: 72px 24px 56px"]{padding:32px 16px 28px !important}
[style*="padding: 88px 24px 40px"],[style*="padding: 72px 24px 40px"]{padding:40px 16px 12px !important}
[style*="padding: 56px 24px 72px"],[style*="padding: 56px 24px 24px"]{padding:28px 16px !important}
[style*="padding: 56px 32px"]{padding:32px 20px !important}
[style*="padding: 36px"]{padding:22px !important}
[style*="padding: 32px 24px 56px"],[style*="padding: 28px 24px 56px"],[style*="padding: 28px 24px 48px"]{padding:20px 14px 40px !important}
[style*="padding: 48px 24px"]{padding:24px 14px !important}
[style*="padding: 48px;"]{padding:24px 18px !important}
[style*="padding: 26px"],[style*="padding: 24px;"]{padding:18px !important}
[style*="padding: 22px"]{padding:16px !important}
[style*="gap: 48px"]{gap:28px !important}
[style*="gap: 36px"]{gap:22px !important}
[style*="height: 56px"]{height:50px !important}
}

</style>
</helmet>
<div style="min-height: 1000px; background: #0B0B10; color: #F3F3F7; font-family: Inter, system-ui, sans-serif">
  <header style="border-bottom: 1px solid #22222B; background: #0E0E14">
    <div style="max-width: 1000px; margin: 0 auto; padding: 14px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <a href="Main.dc.html" style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; color: #F3F3F7; text-decoration: none">WhiteLink</a>
      <div style="flex: 1"></div>
      <a href="CentralAjuda.dc.html" style="font-size: 14px; color: #C9C9D6; text-decoration: none">Ajuda</a>
      <a href="Entrar.dc.html" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #33333E; color: #F3F3F7; font-size: 14px; display: flex; align-items: center; text-decoration: none">Entrar</a>
    </div>
  </header>
  <div style="max-width: 720px; margin: 0 auto; padding: 48px 24px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <a href="MeuPlano.dc.html" style="font-size: 14px; color: #A7A7B8">← Voltar para Meu plano</a>
    <section aria-label="Recibo" style="padding: 28px; border-radius: 20px; background: #F6F5F0; color: #16161A; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px">WhiteLink</span>
          <span style="font-size: 13px; color: #5C5C66">GM DIGITAL · WhatsApp (11) 99393-1841</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; text-align: right">
          <span style="font-size: 12px; color: #5C5C66; text-transform: uppercase; letter-spacing: .06em">Recibo</span>
          <span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 18px">WL-4801</span>
        </div>
      </div>
      <div style="height: 1px; background: #DDDAD0"></div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
          <div style="display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 12px; color: #5C5C66">{{r.k}}</span>
            <span style="font-size: 15px; font-weight: 600">{{r.v}}</span>
          </div>
        </sc-for>
      </div>
      <div style="height: 1px; background: #DDDAD0"></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
        <span style="font-size: 16px; font-weight: 600">Total pago</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700">R$ 399,86</span>
      </div>
      <span style="font-size: 12px; color: #5C5C66; line-height: 1.5">Este recibo comprova o pagamento do plano. Não substitui nota fiscal. [Se emitir nota fiscal, ela chega por e-mail.]</span>
    </section>
    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
      <button onClick="{{dl}}" style="height: 48px; padding: 0 18px; border-radius: 12px; border: none; background: #D4FF3A; color: #0E0E14; font-weight: 600; font-size: 15px; cursor: pointer">{{dlLabel}}</button>
      <button onClick="{{mail}}" style="height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid #33333E; background: transparent; color: #F3F3F7; font-size: 15px; cursor: pointer">{{mailLabel}}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { dl: false, mail: false }; }
  renderVals() {
    const s = this.state;
    return {
      rows: [
        { k: 'Cliente', v: '[Nome do cliente]' }, { k: 'E-mail', v: '[e-mail do cliente]' },
        { k: 'Plano', v: 'Diamante anual' }, { k: 'Período', v: '[DATA] a [DATA]' },
        { k: 'Forma de pagamento', v: 'Pix direto' }, { k: 'Data do pagamento', v: '[DATA] às [HORA]' },
        { k: 'ID da transação Pix', v: 'E9876...543' }, { k: 'Recebedor', v: 'GM DIGITAL' }
      ],
      dlLabel: s.dl ? 'PDF baixado ✓' : 'Baixar em PDF', dl: () => this.setState({ dl: true }),
      mailLabel: s.mail ? 'Enviado para o seu e-mail ✓' : 'Enviar por e-mail', mail: () => this.setState({ mail: true })
    };
  }
}
</script>
</body>
</html>
