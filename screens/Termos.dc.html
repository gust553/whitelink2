<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { i: 0 }; }
  renderVals() {
    const S = [
      [

      ],
      [
            "Conta e cadastro",
            [
                  "Você precisa informar e-mail, celular e o @ do Instagram que vai usar na página. Os dados precisam ser seus e verdadeiros.",
                  "Você é responsável pela sua senha e por tudo o que acontece na sua conta. Avise o suporte se achar que alguém entrou nela."

      ],
      [

      ],

            [
                  "Dúvidas sobre estes termos: chat de suporte ou WhatsApp (11) 99393-1841.",

];
    const i = this.state.i;
    return {
      secs: S.map((x, j) => ({ n: (j + 1) + '. ' + x[0], sel: i === j, pick: () => this.setState({ i: j }),
        style: 'min-height: 40px; padding: 0 12px; border-radius: 10px; cursor: pointer; font-size: 13px; ' + (i === j ? 'border: 1px solid #D4FF3A; background: #22222B; color: #F3F3F7; font-weight: 600' : 'border: 1px solid #2A2A34; background: transparent; color: #C9C9D6') })),

</script>
