<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Enviar comprovante — WhiteLink</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
.up{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;border-radius:18px;border:2px dashed #33333E;background:#14141B;cursor:pointer;color:#C9C9D6;font-size:15px;text-align:center;padding:16px;position:relative;overflow:hidden}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.up img{max-height:220px;max-width:100%;border-radius:10px}
.ck{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:#C9C9D6;line-height:1.45;cursor:pointer}
.ck input{width:22px;height:22px;accent-color:#D4FF3A;flex:none;margin-top:1px}
</style>
</helmet>
<div>
  <div class="appbar"><a class="icon-btn" href="{{backHref}}" aria-label="Voltar"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></a><h1>Enviar comprovante</h1></div>
  <div class="app-main">
    <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}"><div style="color: #9C9CAD; padding-top: 30px">Carregando…</div></sc-if>
    <sc-if value="{{notFound}}" hint-placeholder-val="{{ false }}"><div class="card" style="padding: 20px; color: #C9C9D6">Pedido não encontrado. <a href="/painel/plano">Voltar para Meu plano</a></div></sc-if>

    <sc-if value="{{form}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div class="card" style="padding: 14px 16px; display: flex; justify-content: space-between; align-items: center"><span style="color: #9C9CAD; font-size: 14px">Pedido {{o.code}}</span><b style="font-size: 18px; color: #D4FF3A">{{o.value}}</b></div>
        <label class="up">
          <input type="file" accept="image/*" onChange="{{pickFile}}" aria-label="Print do comprovante">
          <sc-if value="{{hasImg}}" hint-placeholder-val="{{ false }}"><img src="{{img}}" alt="Comprovante"></sc-if>
          <sc-if value="{{noImg}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#D4FF3A" stroke-width="2" stroke-linecap="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg><b>Toque para enviar o print</b><span style="font-size: 13px; color: #9C9CAD">do comprovante do Pix</span></div></sc-if>
        </label>
        <label class="fld" style="margin: 0">Nome de quem pagou<input class="inp" value="{{payer}}" onInput="{{setPayer}}" maxlength="80"></label>
        <label class="fld" style="margin: 0">Banco (opcional)<input class="inp" value="{{bank}}" onInput="{{setBank}}" maxlength="60" placeholder="Ex.: Nubank"></label>
        <label class="ck"><input type="checkbox" checked="{{confirm}}" onChange="{{setConfirm}}"><span>Confirmo que fiz o Pix de {{o.value}} agora, sem agendar.</span></label>
        <sc-if value="{{err}}" hint-placeholder-val="{{ false }}"><div style="padding: 12px 14px; border-radius: 14px; background: #2A1512; color: #FFB4A3; font-size: 14px">{{err}}</div></sc-if>
        <button class="btn full" onClick="{{send}}" disabled="{{busy}}">{{sendLabel}}</button>
      </div>
    </sc-if>

    <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding-top: 30px">
        <div style="width: 76px; height: 76px; border-radius: 26px; background: rgba(212,255,58,.14); color: #D4FF3A; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h2 style="margin: 0; font: 700 24px 'Space Grotesk'">Comprovante recebido!</h2>
        <p style="margin: 0; color: #C9C9D6; font-size: 15px; line-height: 1.5; max-width: 340px">Vamos conferir o Pix e liberar seu plano. Você recebe um aviso assim que estiver tudo certo.</p>
        <a class="btn full" href="{{waHref}}" target="_blank" rel="noopener" style="background: #25D366; color: #06210F">Avisar no WhatsApp</a>
        <a class="btn ghost full" href="/painel/plano">Ver meu plano</a>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { loading: true, o: null, img: '', payer: '', bank: '', confirm: false, busy: false, err: '', done: false, code: new URLSearchParams(location.search).get('c') || '' };
  }
  async componentDidMount() {
    const r = await DC.api('orders/' + encodeURIComponent(this.state.code));
    if (r.status === 401) { location.href = '/entrar'; return; }
    this.setState({ loading: false, o: r.ok ? r.order : null, done: r.ok && r.order.status === 'conferir' });
  }
  file(e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const img = new Image();
    const url = URL.createObjectURL(f);
    img.onload = () => {
      const max = 1400, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let q = 0.8, data = c.toDataURL('image/jpeg', q);
      while (data.length > 800000 && q > 0.3) { q -= 0.15; data = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(url);
      this.setState({ img: data, err: '' });
    };
    img.onerror = () => this.setState({ err: 'Não conseguimos abrir essa imagem. Tente outro print.' });
    img.src = url;
  }
  renderVals() {
    const s = this.state, o = s.o;
    return {
      loading: s.loading, notFound: !s.loading && !o,
      form: !!o && !s.done, done: !!o && s.done,
      backHref: o ? '/pagamento?c=' + o.code : '/painel/plano',
      o: o || {}, img: s.img, hasImg: !!s.img, noImg: !s.img,
      payer: s.payer, bank: s.bank, confirm: s.confirm,
      pickFile: (e) => this.file(e),
      setPayer: (e) => this.setState({ payer: e.target.value }),
      setBank: (e) => this.setState({ bank: e.target.value }),
      setConfirm: (e) => this.setState({ confirm: e.target.checked }),
      err: s.err, busy: s.busy, sendLabel: s.busy ? 'Enviando…' : 'Enviar comprovante',
      send: async () => {
        if (!s.img) { this.setState({ err: 'Envie o print do comprovante.' }); return; }
        this.setState({ busy: true, err: '' });
        const r = await DC.api('orders/' + o.code, 'POST', { image: s.img, payer: s.payer, bank: s.bank, confirm: s.confirm });
        this.setState({ busy: false });
        if (!r.ok) { this.setState({ err: r.error }); return; }
        this.setState({ done: true });
      },
      waHref: o ? 'https://wa.me/' + o.whatsapp + '?text=' + encodeURIComponent('Olá! Enviei o comprovante do pedido ' + o.code + ' (' + o.value + ').') : '#'
    };
  }
}
</script>
</body>
</html>
