<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ferramentas — WhiteLink</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:900px){.tools{grid-template-columns:repeat(3,1fr)}}
.tool{position:relative;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:18px;background:#14141B;border:1px solid #22222B;text-decoration:none;color:inherit;min-height:132px}
.tool:active{transform:scale(.98)}
.tool .ti{width:40px;height:40px;border-radius:12px;background:#1B1B24;display:flex;align-items:center;justify-content:center}
.tool .ti svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tool b{font-size:15px}.tool span{font-size:12.5px;color:#A7A7B8;line-height:1.4}
.tool .hq{position:absolute;top:10px;right:10px;margin:0}
.tool .lk{align-self:flex-start;margin-top:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
</style>
</helmet>
<div>
  <div class="appbar"><h1>Ferramentas</h1></div>
  <div class="app-main">
    <a class="card" href="MeuPlano.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 16px; text-decoration: none; color: inherit; margin-top: 4px">
      <div style="width: 54px; height: 54px; border-radius: 50%; background: #1B1B24; border: 2px solid {{planColor}}; display: flex; align-items: center; justify-content: center; font: 700 19px 'Space Grotesk'; flex: none">{{initials}}</div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <b style="font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{name}}</b>
        <span style="font-size: 13px; color: {{planColor}}; font-weight: 600">{{planLabel}}</span>
      </div>
      <svg class="chev" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
    </a>

    <div class="sec-t" style="margin-top: 18px">Ferramentas</div>
    <div class="tools">
      <sc-for list="{{g1}}" as="r" hint-placeholder-count="6">
        <a class="tool" href="{{r.href}}"><span class="ti" style="{{r.icStyle}}"><svg viewBox="0 0 24 24"><path d="{{r.icon}}"/></svg></span><b>{{r.t}}</b><span>{{r.d}}</span><sc-if value="{{r.tag}}" hint-placeholder-val="{{ false }}"><em class="lk" style="font-style: normal; {{r.tagSt}}">{{r.tag}}</em></sc-if><button class="hq" data-help="{{r.h}}" aria-label="O que é {{r.t}}?">?</button></a>
      </sc-for>
    </div>
    <div class="sec-t">Conta</div>

    <div class="list">
      <sc-for list="{{g2}}" as="r" hint-placeholder-count="3">
        <a class="row" href="{{r.href}}"><span class="row-ic" style="{{r.icStyle}}"><svg viewBox="0 0 24 24"><path d="{{r.icon}}"/></svg></span><span class="row-tx"><b>{{r.t}}</b><span>{{r.d}}</span></span><svg class="chev" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></a>
      </sc-for>
    </div>

    <div class="sec-t">Ajuda</div>
    <div class="list">
      <sc-for list="{{g3}}" as="r" hint-placeholder-count="3">
        <a class="row" href="{{r.href}}" target="{{r.target}}"><span class="row-ic" style="{{r.icStyle}}"><svg viewBox="0 0 24 24"><path d="{{r.icon}}"/></svg></span><span class="row-tx"><b>{{r.t}}</b><span>{{r.d}}</span></span><svg class="chev" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></a>
      </sc-for>
    </div>

    <button class="btn danger full" onClick="{{logout}}" style="margin-top: 24px">Sair da conta</button>
    
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { u: null }; }
  async componentDidMount() {
    const d = await DC.api('me');
    if (d.status === 401) { location.href = '/entrar'; return; }
    if (d.ok) this.setState({ u: d.user });
  }
  renderVals() {
    const u = this.state.u || { name: '', plan: 'prata', trial: false };
    const lv = { prata: 0, ouro: 1, diamante: 2 }[u.plan] || 0;
    const days = u.until ? Math.max(0, Math.ceil((u.until - Date.now()) / 86400000)) : 0;
    const ic = (c) => 'color: ' + c;
    const I = {
      cal: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
      gift: 'M4 11h16v9H4zM3 7h18v4H3zM12 7v13M12 7c-2-4-6-3-5 0M12 7c2-4 6-3 5 0',
      gear: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1-2 2-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21h-3v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1-2-2 .1-.1A1.7 1.7 0 0 0 4.6 15H3v-3h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1 2-2 .1.1A1.7 1.7 0 0 0 9 4.6V3h3v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1 2 2-.1.1a1.7 1.7 0 0 0 1.2 2.9H21v3h-.2a1.7 1.7 0 0 0-1.4 2.7z',
      crown: 'M3 8l4 4 5-7 5 7 4-4-2 11H5z',
      user: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1-4 4-6 8-6s7 2 8 6',
      help: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01',
      chat: 'M4 20l1.4-4A8 8 0 1 1 8 18.6z',
      doc: 'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5',
      palette: 'M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-1.3-1-1.7-1-2.9 0-1 .8-1.6 1.8-1.6H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z',
      kit: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
      link: 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.2 1.2M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.2-1.2',
      bolt: 'M13 2L4 14h7l-1 8 9-12h-7z',
      bell: 'M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0',
      qr: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2M14 18h2v2M18 18h2v2h-2'
    };
    return {
      name: u.name, initials: (u.name || 'W').split(/\s+/).map((w) => w[0] || '').join('').slice(0, 2).toUpperCase(),
      planColor: u.agency ? '#D4FF3A' : ['#C9CDD6', '#F2C14E', '#8FE3FF'][lv],
      planLabel: u.trial ? 'Teste Diamante · ' + days + (days === 1 ? ' dia restante' : ' dias restantes') : u.agency ? 'Plano Agência' : ['Prata grátis', 'Plano Ouro', 'Plano Diamante'][lv],
      g1: [
        { t: 'Turbo', d: 'Pessoas vendo agora, A/B automático e links de campanha', href: '/painel/turbo', icon: I.bolt, icStyle: ic('#D4FF3A'), h: 'aovivo', tag: lv < 2 ? 'Diamante' : '', tagSt: 'background: rgba(143,227,255,.14); color: #8FE3FF' },
        { t: 'Avisos e app', d: 'Aviso no celular a cada venda e contato', href: '/painel/avisos', icon: I.bell, icStyle: ic('#4ADE80'), h: 'avisos' },
        { t: 'Mídia kit', d: 'Página para fechar publis com marcas', href: '/painel/midiakit', icon: I.kit, icStyle: ic('#F2C14E'), h: 'midiakit', tag: lv < 1 ? 'Ouro' : '', tagSt: 'background: rgba(242,193,78,.16); color: #F2C14E' },
        { t: 'Parceiros', d: 'Afiliados que vendem por você, com comissão', href: '/painel/parceiros', icon: I.link, icStyle: ic('#8FE3FF'), h: 'parceiros', tag: lv < 2 ? 'Diamante' : '', tagSt: 'background: rgba(143,227,255,.14); color: #8FE3FF' },
        { t: 'Links programados', d: 'Links que aparecem e somem sozinhos', href: '/painel/agendamentos', icon: I.cal, icStyle: ic('#B9A6FF'), h: 'agendamentos', tag: lv < 1 ? 'Ouro' : '', tagSt: 'background: rgba(242,193,78,.16); color: #F2C14E' },
        { t: 'Aparência e temas', d: '77 temas, cores, fontes e criador de tema', href: '/painel/aparencia', icon: I.palette, icStyle: ic('#FF9AD5'), h: 'temas' },
        { t: 'QR code e Google', d: 'QR com sua cara, Pixel, Analytics e domínio', href: 'Configuracoes.dc.html', icon: I.qr, icStyle: ic('#7CF5D0'), h: 'qr' },
        { t: 'Indique e ganhe', d: 'Dias grátis indicando amigos', href: '/painel/indique', icon: I.gift, icStyle: ic('#F2C14E'), h: 'indique' },
        { t: 'Suporte', d: 'Chat com a equipe aqui no app', href: '/painel/suporte', icon: I.chat, icStyle: ic('#B9A6FF'), h: 'onde' }
      ],
      g2: [
        { t: 'Meu plano', d: 'Plano, renovação e pagamentos', href: 'MeuPlano.dc.html', icon: I.crown, icStyle: ic('#F2C14E') },
        { t: 'Minha conta', d: 'E-mail, senha e celular', href: '/painel/conta', icon: I.user, icStyle: ic('#8FE3FF') }
      ].concat(u.isAdmin ? [{ t: 'Painel do admin', d: 'Pagamentos, clientes e configurações', href: '/admin', icon: I.gear, icStyle: ic('#D4FF3A') }] : []),
      g3: [
        { t: 'Central de ajuda', d: 'Respostas rápidas', href: 'CentralAjuda.dc.html', target: '_self', icon: I.help, icStyle: ic('#D4FF3A') },
        { t: 'Falar no WhatsApp', d: '(11) 99393-1841', href: 'https://wa.me/5511993931841?text=Ol%C3%A1!%20Preciso%20de%20ajuda%20com%20o%20WhiteLink', target: '_blank', icon: I.chat, icStyle: ic('#4ADE80') },
        { t: 'Termos de uso', d: 'Regras de uso e seus dados', href: 'Termos.dc.html', target: '_self', icon: I.doc, icStyle: ic('#9C9CAD') }
      ],
      logout: async () => { await DC.api('auth/logout', 'POST', {}); location.href = '/'; }
    };
  }
}
</script>
</body>
</html>
