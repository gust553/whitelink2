<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Meu plano — WhiteLink</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
.pc{padding:20px;display:flex;flex-direction:column;gap:6px}
.big{font:700 30px 'Space Grotesk',sans-serif;letter-spacing:-.01em}
.dots{display:flex;gap:8px;margin-top:8px}.dots span{flex:1;height:8px;border-radius:999px;background:#26262F}
.plan-opt{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:#14141B;border:1px solid #24242E;text-decoration:none;color:inherit}
</style>
</helmet>
<div>
  <div class="appbar"><a class="icon-btn" href="/painel/mais" aria-label="Voltar"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></a><h1>Meu plano</h1></div>
  <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}"><div class="app-main" style="color: #9C9CAD; padding-top: 40px">Carregando…</div></sc-if>
  <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
  <div class="app-main">
    <div class="card pc" style="border-color: {{planColor}}">
      <span style="font-size: 13px; color: #9C9CAD">Seu plano</span>
      <span class="big" style="color: {{planColor}}">{{planName}}</span>
      <span style="font-size: 15px; color: #C9C9D6">{{planSub}}</span>
    </div>

    <sc-if value="{{hasOpen}}" hint-placeholder-val="{{ false }}">
      <div class="card" style="margin-top: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; border-color: {{openColor}}">
        <b style="font-size: 16px">{{openTitle}}</b>
        <span style="font-size: 14px; color: #C9C9D6; line-height: 1.5">{{openText}}</span>
        <a class="btn" href="{{openHref}}">{{openBtn}}</a>
      </div>
    </sc-if>

    <div class="sec-t">{{choiceTitle}}</div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{plans}}" as="p" hint-placeholder-count="2">
        <a class="plan-opt" href="{{p.href}}" style="{{p.style}}">
          <span style="width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: {{p.bg}}; color: {{p.color}}; flex: none"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/></svg></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><b style="font-size: 17px; color: {{p.color}}">{{p.name}}</b><span style="font-size: 14px; color: #9C9CAD">{{p.price}}</span></span>
          <span class="btn" style="height: 40px; padding: 0 16px; font-size: 14px; background: {{p.color}}">{{p.cta}}</span>
        </a>
      </sc-for>
    </div>
    <a href="/#precos" style="display: block; text-align: center; margin-top: 12px; font-size: 14px">Comparar os planos</a>

    <sc-if value="{{isPaid}}" hint-placeholder-val="{{ false }}">
      <div class="sec-t">Prêmio de fidelidade</div>
      <div class="card" style="padding: 16px">
        <span style="font-size: 15px; color: #C9C9D6">{{loyaltyText}}</span>
        <div class="dots"><sc-for list="{{dots}}" as="d" hint-placeholder-count="3"><span style="{{d}}"></span></sc-for></div>
      </div>
    </sc-if>

    <sc-if value="{{hasHist}}" hint-placeholder-val="{{ false }}">
      <div class="sec-t">Pagamentos</div>
      <div class="list">
        <sc-for list="{{hist}}" as="h" hint-placeholder-count="2">
          <a class="row" href="{{h.href}}"><span class="row-tx"><b>{{h.title}}</b><span>{{h.sub}}</span></span><span style="font-size: 13px; color: #D4FF3A">Recibo</span></a>
        </sc-for>
      </div>
    </sc-if>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { d: null }; }
  async componentDidMount() {
    const d = await DC.api('billing');
    if (d.status === 401) { location.href = '/entrar'; return; }
    this.setState({ d: d.ok ? d : null });
  }
  renderVals() {
    const d = this.state.d;
    if (!d) return { loading: true, ready: false };
    const u = d.user;
    const lv = { prata: 0, ouro: 1, diamante: 2 }[u.plan] || 0;
    const C = ['#C9CDD6', '#F2C14E', '#8FE3FF'];
    const date = (t) => new Date(t).toLocaleDateString('pt-BR');
    const days = u.until ? Math.max(0, Math.ceil((u.until - Date.now()) / 86400000)) : 0;
    const o = d.open;
    let openTitle = '', openText = '', openBtn = '', openHref = '', openColor = '#24242E';
    if (o && o.status === 'aguardando') { openTitle = 'Pix aguardando pagamento'; openText = 'Pedido ' + o.code + ' · ' + o.value + ' · plano ' + o.planName + ' ' + o.periodName + '.'; openBtn = 'Pagar ou enviar comprovante'; openHref = '/pagamento?c=' + o.code; openColor = '#F2C14E'; }
    if (o && o.status === 'conferir') { openTitle = 'Comprovante em conferência'; openText = 'Recebemos o comprovante do pedido ' + o.code + '. Assim que conferirmos, seu plano é liberado.'; openBtn = 'Falar no WhatsApp'; openHref = 'https://wa.me/' + d.whatsapp + '?text=' + encodeURIComponent('Olá! Enviei o comprovante do pedido ' + o.code); openColor = '#8FE3FF'; }
    if (o && o.status === 'recusado') { openTitle = 'Comprovante recusado'; openText = (o.note || 'Não encontramos o Pix desse comprovante.') + ' Envie outro comprovante ou fale com a gente.'; openBtn = 'Enviar outro comprovante'; openHref = '/pagamento/confirmar?c=' + o.code; openColor = '#FF8A6B'; }
    const isPaid = lv > 0 && !u.trial;
    const every = d.loyalty.every || 3;
    return {
      loading: false, ready: true,
      planName: u.trial ? 'Teste Diamante' : ['Prata', 'Ouro', 'Diamante'][lv],
      planColor: C[lv],
      planSub: u.trial ? 'Faltam ' + days + (days === 1 ? ' dia' : ' dias') + '. Depois sua conta continua no Prata grátis.' : (lv === 0 ? 'Grátis para sempre' : 'Válido até ' + date(u.until)),
      hasOpen: !!o, openTitle, openText, openBtn, openHref, openColor,
      choiceTitle: isPaid ? 'Renovar ou mudar de plano' : 'Assinar',
      plans: [['ouro', 'Ouro', 1], ['diamante', 'Diamante', 2]].map((p) => ({
        name: p[1], color: C[p[2]], bg: p[2] === 1 ? 'rgba(242,193,78,.14)' : 'rgba(143,227,255,.14)',
        price: d.prices[p[0] + '_m'].label + '/mês ou ' + d.prices[p[0] + '_y'].label + '/ano',
        cta: lv === p[2] && !u.trial ? 'Renovar' : 'Assinar',
        href: '/pagamento?p=' + p[0],
        style: lv === p[2] && !u.trial ? 'border-color: ' + C[p[2]] : ''
      })),
      isPaid: isPaid,
      loyaltyText: 'A cada ' + every + ' renovações seguidas, você ganha ' + d.loyalty.days + ' dias grátis. ' + d.loyalty.count + ' de ' + every + '.',
      dots: Array.from({ length: every }, (_, i) => i < d.loyalty.count ? 'background: #D4FF3A' : ''),
      hasHist: d.history.length > 0,
      hist: d.history.map((h) => ({ title: 'Plano ' + h.planName + ' ' + h.periodName + ' · ' + h.value, sub: 'Pago em ' + date(h.paidAt) + ' · pedido ' + h.code, href: '/painel/recibo?c=' + h.code }))
    };
  }
}
</script>
</body>
</html>
