<script>window.DC_LINKS={"Main.dc.html":"/","Entrar.dc.html":"/entrar","Teste.dc.html":"/entrar#cadastro","Editor.dc.html":"/painel","Aparencia.dc.html":"/painel/aparencia","Temas.dc.html":"/painel/temas","CriadorTema.dc.html":"/painel/criador-tema","Agenda.dc.html":"/painel/agendamentos","Stats.dc.html":"/painel/estatisticas","Contatos.dc.html":"/painel/contatos","Configuracoes.dc.html":"/painel/configuracoes","Indique.dc.html":"/painel/indique","MeuPlano.dc.html":"/painel/plano","Conta.dc.html":"/painel/conta","EditarLink.dc.html":"/painel/editar-link","Pagamento.dc.html":"/pagamento","ConfirmarPagamento.dc.html":"/pagamento/confirmar","CentralAjuda.dc.html":"/ajuda","SuporteCliente.dc.html":"/painel/suporte","Recibo.dc.html":"/painel/recibo","Termos.dc.html":"/termos","Privacidade.dc.html":"/privacidade","Planos.dc.html":"/#precos","PaginaPublica.dc.html":"/","PaginaFechada.dc.html":"/"};</script>

<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { handle: '', yearly: false, open: 0 }; }
  renderVals() {
    const s = this.state;
    const h = s.handle.toLowerCase().replace(/[^a-z0-9._]/g, '');
    const chk = s.chk || {};
    let msg = 'Escolha seu endereço antes que alguém pegue.', col = '#A7A7B8';
    if (h.length > 0 && h.length < 3) { msg = 'Use pelo menos 3 caracteres.'; col = '#FF8A6B'; }
    else if (h.length >= 3 && chk.h !== h) { msg = 'Conferindo whitelink.site/' + h + '…'; }
    else if (h.length >= 3 && chk.free === false) { msg = chk.reason || ('whitelink.site/' + h + ' já está em uso. Tente outro.'); col = '#FF8A6B'; }
    else if (h.length >= 3 && chk.free) { msg = 'whitelink.site/' + h + ' está livre!'; col = '#D4FF3A'; }
    const yr = s.yearly;
    const tog = (sel) => 'height: 44px; padding: 0 18px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; ' + (sel ? 'background: #F3F3F7; color: #0E0E14; font-weight: 600' : 'background: transparent; color: #C9C9D6');
    const P = [
      { name: 'Prata', color: '#C9CDD6', free: true, items: ['Grátis para sempre', 'Até 3 links', 'Blocos de link e texto', '2 temas prontos', 'Total de visitas dos últimos 7 dias'] },
      { name: 'Ouro', color: '#F2C14E', m: 'R$ 19,90', y: 'R$ 199,90', items: ['Até 10 links', 'Produtos, contagem, captura e Pix', '13 temas e editor de aparência', 'Vídeos, estatísticas de 30 dias e links agendados', 'Sem a marca WhiteLink e chat de suporte'], hi: true },
      { name: 'Diamante', color: '#8FE3FF', m: 'R$ 39,90', y: 'R$ 399,90', items: ['Links ilimitados', '77 temas (64 exclusivos, com movimento) + crie o seu', 'Teste A/B e estatísticas de 90 dias', 'Domínio próprio, até 3 páginas e selo de verificado', 'Suporte prioritário'] }
    ];
    const F = [
      { t: 'Editor arrastável', d: 'Arraste os blocos para a ordem que quiser e veja a página mudando na hora, no celular ou no computador.', plan: 'Todos os planos', icon: 'M5 9h14M5 15h14M9 5l-4 4 4 4' },
      { t: 'Venda direto pela bio', d: 'Blocos de produto, botão de Pix, contagem regressiva para promoções e formulário para captar contatos.', plan: 'Ouro e Diamante', icon: 'M6 6h15l-2 9H8L6 3H3M9 20h.01M18 20h.01' },
      { t: 'Estatísticas de verdade', d: 'Saiba quantas pessoas clicaram, em qual link, de qual rede social, aparelho e cidade.', plan: 'Detalhadas no Ouro e Diamante', icon: 'M4 20V10M10 20V4M16 20v-7M22 20H2' },
      { t: 'Links agendados e destaque', d: 'Programe um link para aparecer e sumir sozinho e chame atenção para o mais importante com animação.', plan: 'Ouro e Diamante', icon: 'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0' },
      { t: 'Teste A/B', d: 'Coloque dois títulos no mesmo link e descubra qual deles faz mais gente clicar.', plan: 'Diamante', icon: 'M7 4v16M17 4v16M3 8h8M13 16h8' },
      { t: 'Temas e tema próprio', d: 'Escolha um tema pronto ou crie o seu, com suas cores, fontes e até fotos e vídeo de fundo.', plan: 'Tema próprio no Diamante', icon: 'M12 3a9 9 0 1 0 0 18c1 0 1.5-.8 1.5-1.5 0-1.2-1-1.5-1-2.5S13.5 15 15 15h2a4 4 0 0 0 4-4c0-4.4-4-8-9-8' }
    ];
    const Q = [
      ['Preciso conectar meu Instagram?', 'Não. Você só copia o seu link do WhiteLink e cola na bio do Instagram, TikTok, YouTube ou onde quiser. Não pedimos sua senha nem acesso à sua conta.'],
      ['Como funciona o teste grátis?', 'Você usa todos os recursos do Diamante, o plano mais completo, por 3 dias sem colocar cartão. Para ser justo com todos, cada pessoa pode fazer o teste uma vez, confirmado pelo celular e pelo e-mail.'],
      ['O que acontece quando o teste acaba?', 'Sua conta passa para o Prata, que é grátis para sempre, e a página continua no ar. O que passa do limite do Prata fica guardado e volta na hora em que você assinar o Ouro ou o Diamante.'],
      ['O plano Prata é grátis mesmo?', 'Sim, para sempre e sem cartão. Ele tem o básico para ter sua página: até 3 links, 2 temas e o total de visitas da semana.'],
      ['Posso trocar de plano depois?', 'Sim. Você pode subir ou descer de plano quando quiser, em Meu plano.'],
      ['Quais formas de pagamento vocês aceitam?', 'Só Pix. No Pix automático o plano é liberado na hora, assim que o banco confirma. No Pix direto você paga o valor exato do pedido, envia o comprovante e liberamos assim que conferirmos. Se o plano vencer sem pagamento, sua conta volta para o Prata grátis e tudo volta quando o pagamento for conferido.'],
      ['Como cancelo?', 'Em Meu plano, a qualquer momento. Você usa o plano até o fim do período já pago e depois continua no Prata grátis.']
    ];
    return {
      handle: s.handle,
      setHandle: (e) => {
        const v = e.target.value; this.setState({ handle: v });
        const hh = v.toLowerCase().replace(/[^a-z0-9._]/g, '');
        clearTimeout(this.ht);
        if (hh.length >= 3) this.ht = setTimeout(async () => { const d = await DC.api('handle-check?h=' + encodeURIComponent(hh)); this.setState({ chk: { h: hh, free: d.free, reason: d.reason } }); }, 350);
      },
      claimHref: '/entrar?h=' + encodeURIComponent(h) + '#cadastro',
      handleMsg: msg, handleColor: col,
      shownHandle: h || 'seunome',
      features: F,
      steps: [
        { n: '1', t: 'Escolha seu endereço', d: 'Crie sua conta com e-mail e garanta o seu whitelink.site/seunome.' },
        { n: '2', t: 'Monte sua página', d: 'Adicione links, produtos e vídeos, escolha um tema e arraste tudo para o lugar.' },
        { n: '3', t: 'Cole na bio e acompanhe', d: 'Coloque o link na bio das suas redes e veja os cliques chegando no painel.' }
      ],
      monthly: !yr, yearly: yr, mStyle: tog(!yr), yStyle: tog(yr),
      setMonthly: () => this.setState({ yearly: false }),
      setYearly: () => this.setState({ yearly: true }),
      plans: P.map((p) => ({ name: p.name, color: p.color, items: p.items,
        price: p.free ? 'Grátis' : (yr ? p.y : p.m), per: p.free ? '' : (yr ? '/ano' : '/mês'), note: p.free ? 'para sempre, sem cartão' : (yr ? 'pagamento único por 12 meses' : 'ou ' + p.y + ' por ano'),
        href: p.free ? 'Teste.dc.html' : 'Pagamento.dc.html', cta: p.free ? 'Começar grátis' : 'Assinar ' + p.name,
        btn: 'margin-top: auto; height: 48px; border-radius: 12px; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; text-decoration: none; ' + (p.hi ? 'background: ' + p.color + '; color: #0E0E14' : 'border: 1px solid #33333E; color: #F3F3F7'),
        card: 'padding: 26px; border-radius: 20px; display: flex; flex-direction: column; gap: 12px; background: ' + (p.hi ? '#17171F' : '#121218') + '; border: ' + (p.hi ? '2px solid ' + p.color : '1px solid #22222B') })),
      faq: Q.map((q, i) => ({ q: q[0], a: q[1], open: s.open === i, sign: s.open === i ? '−' : '+', toggle: () => this.setState({ open: s.open === i ? -1 : i }) }))
    };
  }
}

DC.mount(document.getElementById('root'), "\n<div style=\"min-height: 3600px; background: #0B0B10; color: #F3F3F7; font-family: Inter, system-ui, sans-serif\">\n\n  <header style=\"position: sticky; top: 0; z-index: 5; background: #0B0B10; border-bottom: 1px solid #1C1C24\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 14px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px\">\n      <span style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em\">WhiteLink</span>\n      <nav aria-label=\"Principal\" style=\"display: flex; flex-wrap: wrap; gap: 4px\">\n        <a href=\"#recursos\" style=\"padding: 10px 12px; color: #C9C9D6; font-size: 14px; text-decoration: none\">Recursos</a>\n        <a href=\"#como\" style=\"padding: 10px 12px; color: #C9C9D6; font-size: 14px; text-decoration: none\">Como funciona</a>\n        <a href=\"#precos\" style=\"padding: 10px 12px; color: #C9C9D6; font-size: 14px; text-decoration: none\">Preços</a>\n        <a href=\"#duvidas\" style=\"padding: 10px 12px; color: #C9C9D6; font-size: 14px; text-decoration: none\">Dúvidas</a>\n      </nav>\n      <div style=\"flex: 1\"></div>\n      <a href=\"Entrar.dc.html\" style=\"height: 44px; padding: 0 16px; border-radius: 12px; color: #F3F3F7; font-size: 14px; display: flex; align-items: center; text-decoration: none\">Entrar</a>\n      <a href=\"Teste.dc.html\" style=\"height: 44px; padding: 0 18px; border-radius: 12px; background: #D4FF3A; color: #0E0E14; font-weight: 600; font-size: 14px; display: flex; align-items: center; text-decoration: none\">Testar grátis</a>\n    </div>\n  </header>\n\n  <section style=\"max-width: 1200px; margin: 0 auto; padding: 72px 24px 56px; box-sizing: border-box; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 48px; align-items: center\">\n    <div style=\"display: flex; flex-direction: column; gap: 22px\">\n      <span style=\"align-self: flex-start; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: #1A2008; color: #D4FF3A; border: 1px solid #3A4714\">Diamante grátis por 3 dias · depois Prata grátis</span>\n      <h1 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 60px; line-height: 1.02; font-weight: 700; letter-spacing: -0.03em\">O link da sua bio,<br>feito para vender.</h1>\n      <p style=\"margin: 0; font-size: 19px; line-height: 1.55; color: #C9C9D6; max-width: 520px\">Monte sua página arrastando blocos, venda com Pix e produtos, capture contatos e veja de onde vem cada clique. Tudo em um só link.</p>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; max-width: 520px\">\n        <label style=\"flex: 1 1 260px; display: flex; align-items: center; height: 56px; border-radius: 14px; background: #14141B; border: 1px solid #33333E; padding: 0 6px 0 16px; box-sizing: border-box; font-size: 16px; color: #A7A7B8\">\n          <span>whitelink.site/</span>\n          <input aria-label=\"Escolha seu nome de usuário\" value=\"{{handle}}\" onInput=\"{{setHandle}}\" placeholder=\"seunome\" style=\"flex: 1; min-width: 0; height: 100%; border: none; background: transparent; color: #F3F3F7; font-size: 16px; outline: none\">\n        </label>\n        <a href=\"{{claimHref}}\" style=\"height: 56px; padding: 0 22px; border-radius: 14px; background: #D4FF3A; color: #0E0E14; font-weight: 600; font-size: 16px; display: flex; align-items: center; text-decoration: none\">Garantir meu link</a>\n      </div>\n      <span style=\"font-size: 13px; color: {{handleColor}}; min-height: 18px\">{{handleMsg}}</span>\n    </div>\n\n    <div style=\"display: flex; justify-content: center\">\n      <div aria-hidden=\"true\" style=\"width: 300px; border-radius: 40px; padding: 12px; background: #1A1A22; border: 1px solid #2A2A34\">\n        <div style=\"border-radius: 30px; overflow: hidden; background: linear-gradient(180deg, #1C1F10 0%, #0E0E14 60%); padding: 28px 18px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px\">\n          <div style=\"width: 76px; height: 76px; border-radius: 50%; background: #2A2A34; border: 3px solid #D4FF3A\"></div>\n          <span style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px\">@{{shownHandle}}</span>\n          <span style=\"font-size: 12px; color: #A7A7B8; text-align: center\">[sua descrição curta aqui]</span>\n          <div style=\"width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 8px\">\n            <div style=\"height: 46px; border-radius: 14px; background: #D4FF3A; color: #0E0E14; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center\">Meu produto em destaque</div>\n            <div style=\"height: 46px; border-radius: 14px; background: #1A1A22; border: 1px solid #33333E; font-size: 13px; display: flex; align-items: center; justify-content: center\">Canal no YouTube</div>\n            <div style=\"border-radius: 14px; background: #1A1A22; border: 1px solid #33333E; padding: 12px; display: flex; flex-direction: column; gap: 6px; align-items: center\">\n              <span style=\"font-size: 11px; color: #A7A7B8\">A promoção acaba em</span>\n              <span style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: .04em\">02 : 14 : 37</span>\n            </div>\n            <div style=\"height: 46px; border-radius: 14px; background: #1A1A22; border: 1px solid #33333E; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px\">Pagar com Pix</div>\n            <div style=\"height: 46px; border-radius: 14px; background: #1A1A22; border: 1px solid #33333E; font-size: 13px; display: flex; align-items: center; justify-content: center\">Entre na minha lista VIP</div>\n          </div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n
