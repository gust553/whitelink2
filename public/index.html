<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
:root{--bg:#09090D;--card:#121218;--line:#22222C;--tx:#F3F3F7;--mu:#A7A7B8;--li:#D4FF3A;--au:#F2C14E;--di:#8FE3FF;--pk:#FF9AD5}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.hd{position:sticky;top:0;z-index:50;background:rgba(9,9,13,.72);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}
.hd .wrap{display:flex;align-items:center;gap:14px;height:66px}
.logo{display:flex;align-items:center;gap:10px;font:700 21px 'Space Grotesk';text-decoration:none}.logo i{width:34px;height:34px;border-radius:11px;background:var(--li);color:#0E0E14;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:17px}
.nav{display:flex;gap:4px;margin-left:18px}.nav a{padding:8px 12px;border-radius:10px;color:var(--mu);text-decoration:none;font-size:14.5px}.nav a:hover{color:var(--tx);background:#16161E}
.sp{flex:1}.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;border:none;cursor:pointer;font-family:inherit;white-space:nowrap}
.b.p{background:var(--li);color:#0E0E14}.b.g{background:#18181F;color:var(--tx);border:1px solid var(--line)}.b.lg{height:58px;padding:0 28px;font-size:16.5px}
@media (max-width:820px){.nav{display:none}.hd .b.g{display:none}}
.hero{position:relative;padding:70px 0 40px;overflow:hidden}
.hero::before{content:"";position:absolute;width:900px;height:900px;left:50%;top:-420px;transform:translateX(-50%);background:radial-gradient(circle,rgba(212,255,58,.16),transparent 60%);pointer-events:none}
.hg{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;position:relative}
@media (max-width:960px){.hg{grid-template-columns:1fr;gap:40px}}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:#151A08;border:1px solid #34411A;color:var(--li);font-size:13.5px;font-weight:600}
.pill b{width:8px;height:8px;border-radius:50%;background:var(--li);box-shadow:0 0 0 0 rgba(212,255,58,.6);animation:pu 2s infinite}@keyframes pu{70%{box-shadow:0 0 0 9px rgba(212,255,58,0)}100%{box-shadow:0 0 0 0 rgba(212,255,58,0)}}
h1{font:700 clamp(40px,6.2vw,72px)/1.02 'Space Grotesk',sans-serif;letter-spacing:-.025em;margin:20px 0 18px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--li),#7CF5D0 55%,var(--di));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:19px;color:#C9C9D6;max-width:560px;margin:0 0 28px}
.claim{display:flex;gap:8px;flex-wrap:wrap;max-width:560px}
.claim label{flex:1 1 260px;display:flex;align-items:center;height:58px;border-radius:16px;background:#131319;border:1px solid #2C2C38;padding:0 6px 0 16px;color:var(--mu);font-size:16.5px}
.claim input{flex:1;min-width:0;background:none;border:none;color:var(--tx);font:600 16.5px Inter,sans-serif;outline:none;height:100%}
.hint{font-size:14px;margin-top:10px;min-height:20px}
.trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;color:var(--mu);font-size:14px}.trust span::before{content:"✓ ";color:var(--li);font-weight:700}
.phone{width:310px;height:630px;margin:0 auto;border-radius:46px;background:#000;padding:12px;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px #2A2A34,inset 0 0 0 2px #1A1A22;position:relative}
.scr{width:100%;height:100%;border-radius:36px;overflow:hidden;position:relative;background:linear-gradient(180deg,#24124A 0%,#0E0E14 55%)}
.cov{height:150px;background:linear-gradient(135deg,#FF5FA2,#7A3CFF);position:relative}.cov::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,#170C2E)}
.pin{position:absolute;inset:0;padding:96px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:9px}
.av{width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,#FFD1E8,#FF7AB8);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font:700 26px 'Space Grotesk';color:#5A1340}
.nm{font:700 17px 'Space Grotesk';display:flex;align-items:center;gap:6px}.nm i{width:17px;height:17px;border-radius:50%;background:var(--di);color:#06222B;font-size:10px;font-style:normal;display:flex;align-items:center;justify-content:center}
.bi{font-size:12px;color:#D8CCF0;margin-top:-6px}
.pb{width:100%;padding:11px;border-radius:14px;background:rgba(255,255,255,.12);text-align:center;font-size:13px;font-weight:600;animation:in .6s both}
.pb.m{background:#fff;color:#2A0E4A}
.pg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;animation:in .6s both}.pg2 div{border-radius:14px;background:rgba(255,255,255,.1);padding:6px;font-size:11px}.pg2 span{display:block;height:58px;border-radius:10px;margin-bottom:5px}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.live{position:absolute;left:12px;top:14px;padding:6px 11px;border-radius:999px;background:rgba(0,0,0,.55);font-size:11px;font-weight:600;display:flex;gap:6px;align-items:center;backdrop-filter:blur(6px)}.live b{width:7px;height:7px;border-radius:50%;background:#4ADE80}
.tst{position:absolute;left:12px;right:12px;bottom:16px;padding:10px 12px;border-radius:14px;background:rgba(10,10,14,.9);font-size:12px;animation:tsn 6s infinite;box-shadow:0 10px 24px rgba(0,0,0,.4)}
@keyframes tsn{0%,12%{opacity:0;transform:translateY(16px)}18%,80%{opacity:1;transform:none}90%,100%{opacity:0;transform:translateY(16px)}}
.flt{position:absolute;padding:12px 14px;border-radius:16px;background:#141419;border:1px solid #2A2A34;font-size:13px;box-shadow:0 20px 40px rgba(0,0,0,.4);animation:fl 5s ease-in-out infinite}
.flt b{display:block;font:700 20px 'Space Grotesk'}
@keyframes fl{50%{transform:translateY(-10px)}}
@media (max-width:960px){.flt{display:none}}
.sec{padding:90px 0}.sec.alt{background:linear-gradient(180deg,#0D0D12,#09090D)}
.eyebrow{color:var(--li);font-weight:700;font-size:13.5px;letter-spacing:.08em;text-transform:uppercase}
h2{font:700 clamp(32px,4.4vw,50px)/1.08 'Space Grotesk',sans-serif;letter-spacing:-.02em;margin:10px 0 14px}
.sub{color:#C9C9D6;font-size:18px;max-width:640px;margin:0}
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:44px}
@media (max-width:1000px){.fg{grid-template-columns:repeat(2,1fr)}}@media (max-width:560px){.fg{grid-template-columns:1fr}}
.f{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:10px;transition:transform .25s,border-color .25s}
.f:hover{transform:translateY(-4px);border-color:#3A3A48}
.f .ic{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:23px}
.f h3{margin:4px 0 0;font:700 19px 'Space Grotesk'}.f p{margin:0;color:var(--mu);font-size:14.5px}
.tg{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:auto;align-self:flex-start}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}@media (max-width:820px){.steps{grid-template-columns:1fr}}
.st{padding:24px;border-radius:24px;background:var(--card);border:1px solid var(--line)}.st b{width:42px;height:42px;border-radius:50%;background:var(--li);color:#0E0E14;display:flex;align-items:center;justify-content:center;font:700 18px 'Space Grotesk';margin-bottom:12px}
.st h3{margin:0 0 6px;font:700 19px 'Space Grotesk'}.st p{margin:0;color:var(--mu);font-size:14.5px}
.cmp{margin-top:40px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--card)}
.cmp .r{display:grid;grid-template-columns:1.6fr 1fr 1fr;align-items:center;border-bottom:1px solid var(--line)}.cmp .r:last-child{border:none}
.cmp .r>div{padding:15px 18px;font-size:14.5px}.cmp .r>div:nth-child(n+2){text-align:center}
.cmp .h{background:#16161D;font-weight:700}.cmp .h>div:nth-child(3){color:var(--li)}
.y{color:var(--li);font-weight:700}.n{color:#5E5E6E}
.tog{display:inline-flex;gap:4px;padding:5px;border-radius:999px;background:#15151C;border:1px solid var(--line);margin-top:26px}
.tog button{height:42px;padding:0 18px;border-radius:999px;border:none;background:none;color:var(--mu);font:600 14.5px Inter,sans-serif;cursor:pointer}.tog button[aria-pressed="true"]{background:var(--tx);color:#0E0E14}
.tog small{color:var(--li);font-weight:700;margin-left:4px}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px;align-items:start}@media (max-width:1100px){.pg{grid-template-columns:repeat(2,1fr)}}@media (max-width:600px){.pg{grid-template-columns:1fr}}
.pc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:14px}
.pc.hi{border-color:var(--di);box-shadow:0 0 0 1px var(--di),0 30px 60px rgba(143,227,255,.12)}
.pc .tag{position:absolute;top:-12px;left:22px;padding:5px 12px;border-radius:999px;background:var(--di);color:#06222B;font-size:12px;font-weight:800}
.pc h3{margin:0;font:700 23px 'Space Grotesk'}.pc .pr{font:700 36px 'Space Grotesk';letter-spacing:-.02em}.pc .pr small{font:500 14px Inter;color:var(--mu)}
.pc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.pc li{position:relative;padding-left:24px;font-size:14px;color:#D2D2DD;line-height:1.45}.pc li::before{content:"";position:absolute;left:2px;top:5px;width:11px;height:6px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);color:var(--li)}
.pc li.hd2{padding-left:0;font-weight:700;color:var(--tx)}.pc li.hd2::before{display:none}
.more{background:none;border:none;color:var(--mu);font:600 13.5px Inter;cursor:pointer;text-align:left;padding:0}
.faq{max-width:820px;margin:40px auto 0;display:flex;flex-direction:column;gap:10px}
.q{background:var(--card);border:1px solid var(--line);border-radius:18px}.q button{width:100%;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:18px 20px;background:none;border:none;color:var(--tx);font:600 16px Inter;cursor:pointer;text-align:left}
.q p{margin:0;padding:0 20px 18px;color:#C9C9D6;font-size:15px}
.cta{margin:20px 0 0;padding:56px 28px;border-radius:32px;text-align:center;background:radial-gradient(circle at 50% 0%,rgba(212,255,58,.25),transparent 60%),#111117;border:1px solid #2A3214}
.ft{padding:40px 0 60px;color:var(--mu);font-size:14px;border-top:1px solid var(--line);margin-top:60px}.ft .wrap{display:flex;gap:18px;flex-wrap:wrap;align-items:center}.ft a{text-decoration:none}
@keyframes rvIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@supports (animation-timeline: view()){.rv{animation:rvIn linear both;animation-timeline:view();animation-range:entry 0% entry 70%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<script>window.DC_LINKS={"Main.dc.html":"/","Entrar.dc.html":"/entrar","Teste.dc.html":"/entrar#cadastro","Editor.dc.html":"/painel","Aparencia.dc.html":"/painel/aparencia","Temas.dc.html":"/painel/temas","CriadorTema.dc.html":"/painel/criador-tema","Computador.dc.html":"/painel/computador","Agenda.dc.html":"/painel/agendamentos","Stats.dc.html":"/painel/estatisticas","Contatos.dc.html":"/painel/clientes","Configuracoes.dc.html":"/painel/configuracoes","Indique.dc.html":"/painel/indique","MeuPlano.dc.html":"/painel/plano","Conta.dc.html":"/painel/conta","EditarLink.dc.html":"/painel","Pagamento.dc.html":"/pagamento","ConfirmarPagamento.dc.html":"/pagamento/confirmar","CentralAjuda.dc.html":"/ajuda","SuporteCliente.dc.html":"/painel/suporte","Recibo.dc.html":"/painel/recibo","Termos.dc.html":"/termos","Privacidade.dc.html":"/privacidade","Planos.dc.html":"/#precos","PaginaPublica.dc.html":"/","PaginaFechada.dc.html":"/"};</script>

<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { handle: '', yearly: false, open: 0, prices: null, expand: {}, viewers: 12 }; }
  componentDidMount() {
    fetch('/api/prices').then((r) => r.json()).then((d) => { if (d.ok) this.setState({ prices: d.prices }); }).catch(() => {});
    this.vt = setInterval(() => this.setState({ viewers: 9 + Math.floor(Math.random() * 9) }), 4000);
  }
  renderVals() {
    const s = this.state;
    const h = s.handle.toLowerCase().replace(/[^a-z0-9._]/g, '');
    const chk = s.chk || {};
    let msg = 'Escolha seu endereço antes que alguém pegue.', col = '#A7A7B8';
    if (h.length > 0 && h.length < 3) { msg = 'Use pelo menos 3 caracteres.'; col = '#FF8A6B'; }
    else if (h.length >= 3 && chk.h !== h) { msg = 'Conferindo whitelink.site/' + h + '…'; }
    else if (h.length >= 3 && chk.free === false) { msg = chk.reason || ('whitelink.site/' + h + ' já está em uso. Tente outro.'); col = '#FF8A6B'; }
    else if (h.length >= 3 && chk.free) { msg = '✓ whitelink.site/' + h + ' está livre!'; col = '#D4FF3A'; }
    const yr = s.yearly, P = s.prices || { ouro_m: 'R$ 19,90', ouro_y: 'R$ 199,90', diamante_m: 'R$ 39,90', diamante_y: 'R$ 399,90', agencia_m: 'R$ 99,90', agencia_y: 'R$ 999,90' };
    const W = window.WL_PLANOS || {};
    const tg = (c) => 'background: ' + c + '22; color: ' + c;
    const F = [
      ['🛍', 'Loja com Pix na hora', 'Produtos com foto, carrinho e Pix copia e cola com o valor certo. O dinheiro cai direto na sua conta, sem taxa nossa.', 'Ouro e Diamante', '#D4FF3A'],
      ['📅', 'Agenda de horários', 'O cliente escolhe o dia e o horário livres e confirma no WhatsApp. No Diamante, cobra o sinal por Pix.', 'Ouro e Diamante', '#7CF5D0'],
      ['👥', 'Clientes organizados', 'Cada contato, compra e agendamento vira uma ficha com histórico, etapa e etiquetas. Campanhas por WhatsApp em poucos toques.', 'CRM completo no Diamante', '#8FE3FF'],
      ['🤝', 'Parceiros que vendem por você', 'Dê um link para afiliados e revendedores e veja quanto cada um vendeu e a comissão de cada um.', 'Diamante', '#B9A6FF'],
      ['✨', 'Assistente de IA', 'Escreve sua descrição, os títulos dos botões e as descrições dos produtos, e analisa seus números com dicas para vender mais.', 'Ouro e Diamante', '#FF9AD5'],
      ['🔥', 'Prova social ao vivo', '"12 pessoas vendo agora" e "Ana comprou há 2 min" na sua página. Quem vê, compra mais.', 'Diamante', '#FF8A6B'],
      ['🧠', 'Página que se otimiza sozinha', 'O teste A/B escolhe o título vencedor e os links mais clicados sobem sozinhos.', 'Diamante', '#F2C14E'],
      ['📊', 'Mídia kit que fecha publi', 'Página profissional com seus números reais atualizados, público e preços. A marca manda a proposta por ela.', 'Ouro e Diamante', '#4ADE80'],
      ['📲', 'App com avisos', 'Instale no celular e receba um aviso a cada venda, agendamento e contato.', 'Ouro e Diamante', '#D4FF3A'],
      ['🔗', 'Links inteligentes', 'Abrem direto no app do YouTube ou do Instagram, mudam por aparelho e horário, com links de campanha e relatório.', 'Ouro e Diamante', '#7CF5D0'],
      ['🎨', '77 temas e criador de tema', 'Temas com movimento, capa em foto ou vídeo, animações de entrada, um tema com a sua cara (até com foto de fundo) e versão para computador com cara de site.', 'Todos os planos', '#8FE3FF'],
      ['🏢', 'Feito para agências', 'Até 20 páginas de clientes num painel só, com relatório para mostrar às marcas.', 'Agência', '#D4FF3A']
    ];
    const C = [['Loja com carrinho e Pix', '✗'], ['Agenda de horários com sinal', '✗'], ['CRM de clientes e campanhas', '✗'], ['Afiliados com comissão', '✗'], ['IA que escreve e analisa', '✗'], ['Prova social ao vivo', '✗'], ['A/B que decide sozinho', '✗'], ['Mídia kit com números reais', 'Às vezes'], ['Abrir links direto no app', 'Às vezes'], ['Pagamento por Pix', 'Raro']];
    const mk = (key, name, color, price, per, note, cta, href, opts) => {
      const all = W[key] || [], open = !!s.expand[key], lim = 8;
      return Object.assign({ name, color, price, per, note, cta, href, cls: '', st: '', tag: '', btn: 'g',
        items: (open ? all : all.slice(0, lim)).map((t) => ({ t, c: /e mais:$/.test(t) ? 'hd2' : '' })),
        more: all.length > lim ? (open ? 'Mostrar menos' : 'Ver tudo (' + all.length + ')') : '',
        toggle: () => this.setState({ expand: Object.assign({}, s.expand, { [key]: !open }) }) }, opts || {});
    };
    return {
      handle: s.handle, viewers: s.viewers,
      setHandle: (e) => {
        const v = e.target.value; this.setState({ handle: v });
        const hh = v.toLowerCase().replace(/[^a-z0-9._]/g, '');
        clearTimeout(this.ht);
        if (hh.length >= 3) this.ht = setTimeout(async () => { const d = await DC.api('handle-check?h=' + encodeURIComponent(hh)); this.setState({ chk: { h: hh, free: d.free, reason: d.reason } }); }, 350);
      },
      claimHref: '/entrar?h=' + encodeURIComponent(h) + '#cadastro', handleMsg: msg, handleColor: col,
      features: F.map((f) => ({ i: f[0], t: f[1], d: f[2], plan: f[3], bg: 'background: ' + f[4] + '1F', tg: tg(f[4]) })),
      steps: [
        { n: '1', t: 'Garanta seu endereço', d: 'Crie a conta com e-mail e celular e escolha o seu whitelink.site/seunome.' },
        { n: '2', t: 'Monte em minutos', d: 'Adicione links, produtos, agenda e quiz. A IA ajuda a escrever. Escolha entre 77 temas.' },
        { n: '3', t: 'Compartilhe em qualquer lugar', d: 'Na bio, nos stories, em anúncios, em grupos e status do WhatsApp, no e-mail ou num QR code impresso. Os pedidos, agendamentos e contatos chegam no seu celular.' }
      ],
      compare: C.map((c) => ({ t: c[0], a: c[1], ac: c[1] === '✗' ? 'n' : '' })),
      isM: !yr, isY: yr, monthly: () => this.setState({ yearly: false }), yearly: () => this.setState({ yearly: true }),
      plans: [
        mk('prata', 'Prata', '#C9CDD6', 'R$ 0', 'para sempre', 'Para começar', 'Começar grátis', '/entrar#cadastro'),
        mk('ouro', 'Ouro', '#F2C14E', yr ? P.ouro_y : P.ouro_m, yr ? '/ano' : '/mês', 'Para quem quer vender', 'Assinar Ouro', '/pagamento?p=ouro'),
        mk('diamante', 'Diamante', '#8FE3FF', yr ? P.diamante_y : P.diamante_m, yr ? '/ano' : '/mês', 'Tudo liberado · teste 3 dias grátis', 'Testar 3 dias grátis', '/entrar#cadastro', { cls: 'hi', tag: 'MAIS ESCOLHIDO', btn: 'p' }),
        mk('agencia', 'Agência', '#D4FF3A', yr ? P.agencia_y : P.agencia_m, yr ? '/ano' : '/mês', 'Para agências e assessorias', 'Assinar Agência', '/pagamento?p=agencia')
      ],
      faq: [
        ['Preciso conectar meu Instagram?', 'Não. Você copia o seu link do WhiteLink e usa onde quiser: bio e stories do Instagram e do TikTok, anúncios, grupos e status do WhatsApp, YouTube, e-mail ou QR code. Não pedimos sua senha nem acesso à sua conta.'],
        ['Como recebo o dinheiro das minhas vendas?', 'Direto na sua conta, pelo Pix da sua chave. O WhiteLink gera o Pix copia e cola com o valor certo e você confirma o recebimento no painel. Não cobramos taxa sobre as suas vendas.'],
        ['Como funciona o teste grátis?', 'Você usa tudo do Diamante por 3 dias, sem cartão. Para ser justo com todos, cada pessoa pode testar uma vez, confirmado pelo celular e pelo e-mail.'],
        ['O que acontece quando o teste acaba?', 'Sua conta passa para o Prata, grátis para sempre, e a página continua no ar. O que passa do limite fica guardado e volta na hora em que você assinar.'],
