<style>
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:#14141B;border:1px solid #24242E}
.seg button{flex:1;height:44px;border-radius:12px;border:none;background:transparent;color:#C9C9D6;font-size:15px;cursor:pointer;font-family:inherit}
.seg button[aria-pressed="true"]{background:#F3F3F7;color:#0E0E14;font-weight:700}
.pick{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:#14141B;border:2px solid #24242E;cursor:pointer;width:100%;text-align:left;color:inherit;font-family:inherit}
.val{font:700 40px 'Space Grotesk',sans-serif;color:#D4FF3A;letter-spacing:-.01em}
.copybox{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-radius:14px;background:#0E0E14;border:1px solid #2A2A34}
.copybox code{flex:1;min-width:0;font:500 13px 'Space Mono',monospace;color:#C9C9D6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qr{width:220px;height:220px;border-radius:18px;background:#fff;padding:12px;margin:0 auto;display:block}
.spin{flex:none;width:22px;height:22px;border-radius:50%;border:3px solid #26262F;border-top-color:#D4FF3A;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.warn{padding:12px 14px;border-radius:14px;background:#2B2210;color:#F7DFA0;font-size:14px;line-height:1.5}
</style>
<link rel="stylesheet" href="/assets/shell.css">
</head>

<script>window.DC_LINKS={"Main.dc.html":"/","Entrar.dc.html":"/entrar","Teste.dc.html":"/entrar#cadastro","Editor.dc.html":"/painel","Aparencia.dc.html":"/painel/aparencia","Temas.dc.html":"/painel/temas","CriadorTema.dc.html":"/painel/criador-tema","Agenda.dc.html":"/painel/agendamentos","Stats.dc.html":"/painel/estatisticas","Contatos.dc.html":"/painel/contatos","Configuracoes.dc.html":"/painel/configuracoes","Indique.dc.html":"/painel/indique","MeuPlano.dc.html":"/painel/plano","Conta.dc.html":"/painel/conta","EditarLink.dc.html":"/painel/editar-link","Pagamento.dc.html":"/pagamento","ConfirmarPagamento.dc.html":"/pagamento/confirmar","CentralAjuda.dc.html":"/ajuda","SuporteCliente.dc.html":"/painel/suporte","Recibo.dc.html":"/painel/recibo","Termos.dc.html":"/termos","Privacidade.dc.html":"/privacidade","Planos.dc.html":"/#precos","PaginaPublica.dc.html":"/","PaginaFechada.dc.html":"/"};</script>
<script src="/assets/dc.js"></script>
<script src="/assets/temas-list.js"></script>
<script>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    const q = new URLSearchParams(location.search);
    this.state = { loading: true, d: null, plan: q.get('p') === 'diamante' ? 'diamante' : 'ouro', period: 'm', order: null, busy: false, err: '', toast: '', code: q.get('c') };
  }
  async componentDidMount() {
    const d = await DC.api('billing');
    if (d.status === 401) { location.href = '/entrar'; return; }
    let order = null;
    if (this.state.code) { const r = await DC.api('orders/' + this.state.code); if (r.ok && r.order.status === 'aguardando') order = r.order; }
    else if (d.open && d.open.status === 'aguardando') order = d.open;
    if (d.open && d.open.status === 'conferir') { location.href = '/painel/plano'; return; }
    this.setState({ loading: false, d: d, order: order });
    this.watch();
  }
  // Pix automático (gateway): confere sozinho a cada 5 segundos
  watch() {
    clearInterval(this.w);
    const o = this.state.order;
    if (!o || !o.auto) return;
    this.w = setInterval(async () => {
      if (document.hidden) return;
      const r = await DC.api('orders/' + o.code);
      if (r.ok && r.order.status === 'liberado') { clearInterval(this.w); location.href = '/painel/plano?ok=1'; }
      else if (r.ok && r.order.status !== 'aguardando') { clearInterval(this.w); this.setState({ order: null, err: 'Esse Pix venceu. Gere um novo.' }); }
    }, 5000);
  }
  flash(t) { this.setState({ toast: t }); clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ toast: '' }), 1800); }
  async copy(text, msg) { try { await navigator.clipboard.writeText(text); } catch (e) {} this.flash(msg); }
  renderVals() {
    const s = this.state, d = s.d, o = s.order;
    if (!d) return { loading: true, choose: false, pay: false, barTitle: 'Assinar' };
    const C = { ouro: '#F2C14E', diamante: '#8FE3FF' };
    const hints = { ouro: '10 links, todos os blocos e 13 temas', diamante: 'Tudo liberado e os 77 temas' };
    return {
      loading: false, choose: !o, pay: !!o, barTitle: o ? 'Pagar com Pix' : 'Assinar',
      isM: s.period === 'm', isY: s.period === 'y',
      setM: () => this.setState({ period: 'm' }), setY: () => this.setState({ period: 'y' }),
      plans: ['ouro', 'diamante'].map((p) => ({
        name: p === 'ouro' ? 'Ouro' : 'Diamante', color: C[p], hint: hints[p], sel: s.plan === p,
        price: d.prices[p + '_' + s.period].label + (s.period === 'y' ? '/ano' : '/mês'),
        style: s.plan === p ? 'border-color: ' + C[p] + '; background: #191920' : '',
        pick: () => this.setState({ plan: p })
      })),
      err: s.err, busy: s.busy,
      createLabel: s.busy ? 'Gerando…' : 'Gerar Pix',
      create: async () => {
        this.setState({ busy: true, err: '' });
        const r = await DC.api('orders', 'POST', { plan: s.plan, period: s.period });
        this.setState({ busy: false });
        if (!r.ok) { this.setState({ err: r.error }); return; }
        history.replaceState(null, '', '/pagamento?c=' + r.order.code);
        this.setState({ order: r.order });
        this.watch();
      },
      o: o || {}, manual: !!o && !o.auto,
      qr: o ? 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=0&data=' + encodeURIComponent(o.pix) : '',
      copyPixLabel: 'Copiar Pix copia e cola',
      copyPix: () => this.copy(o.pix, 'Pix copiado! Cole no app do seu banco.'),
      copyKeyLabel: 'Copiar chave',
      copyKey: () => this.copy(o.pixKey, 'Chave copiada!'),
      expires: o ? new Date(o.expiresAt).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '',
      confirmHref: o ? '/pagamento/confirmar?c=' + o.code : '#',
      restart: () => { history.replaceState(null, '', '/pagamento'); this.setState({ order: null }); },
      toast: s.toast
    };
  }
}

DC.mount(document.getElementById('root'), "\n<div>\n  <div class=\"appbar\"><a class=\"icon-btn\" href=\"/painel/plano\" aria-label=\"Voltar\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M15 5l-7 7 7 7\"/></svg></a><h1>{{barTitle}}</h1></div>\n  <div class=\"app-main\">\n    <sc-if value=\"{{loading}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color: #9C9CAD; padding-top: 30px\">Carregando…</div></sc-if>\n\n    <sc-if value=\"{{choose}}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px\">\n        <div class=\"seg\" role=\"group\" aria-label=\"Período\">\n          <button onClick=\"{{setM}}\" aria-pressed=\"{{isM}}\">Mensal</button>\n          <button onClick=\"{{setY}}\" aria-pressed=\"{{isY}}\">Anual · 2 meses grátis</button>\n        </div>\n        <sc-for list=\"{{plans}}\" as=\"p\" hint-placeholder-count=\"2\">\n          <button class=\"pick\" onClick=\"{{p.pick}}\" aria-pressed=\"{{p.sel}}\" style=\"{{p.style}}\">\n            <span style=\"flex: 1; display: flex; flex-direction: column; gap: 4px\"><b style=\"font-size: 19px; color: {{p.color}}\">{{p.name}}</b><span style=\"font-size: 14px; color: #9C9CAD\">{{p.hint}}</span></span>\n            <span style=\"font: 700 22px 'Space Grotesk'\">{{p.price}}</span>\n          </button>\n        </sc-for>\n        <span style=\"font-size: 14px; color: #9C9CAD; text-align: center\">Pagamento só por Pix. Seu plano começa assim que o pagamento é confirmado.</span>\n        <sc-if value=\"{{err}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"warn\" style=\"background: #2A1512; color: #FFB4A3\">{{err}}</div></sc-if>\n        <button class=\"btn full\" onClick=\"{{create}}\" disabled=\"{{busy}}\">{{createLabel}}</button>\n      </div>\n    </sc-if>\n\n    <sc-if value=\"{{pay}}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 14px\">\n        <div class=\"card\" style=\"padding: 18px; text-align: center; display: flex; flex-direction: column; gap: 4px\">\n          <span style=\"font-size: 14px; color: #9C9CAD\">Pague exatamente</span>\n          <span class=\"val\">{{o.value}}</span>\n          <span style=\"font-size: 14px; color: #C9C9D6\">Plano {{o.planName}} {{o.periodName}} · pedido <b>{{o.code}}</b></span>\n          <sc-if value=\"{{manual}}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size: 13px; color: #9C9CAD\">Os centavos diferentes mostram que o Pix é seu</span></sc-if>\n        </div>\n        <button class=\"btn full\" onClick=\"{{copyPix}}\">{{copyPixLabel}}</button>\n        <img class=\"qr\" src=\"{{qr}}\" alt=\"QR code do Pix\">\n        <sc-if value=\"{{manual}}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 14px\">\n            <div class=\"copybox\"><code>{{o.pixKey}}</code><button class=\"chip\" onClick=\"{{copyKey}}\" style=\"border: none; background: rgba(212,255,58,.14); color: #D4FF3A; cursor: pointer\">{{copyKeyLabel}}</button></div>\n            <span style=\"font-size: 14px; color: #C9C9D6; text-align: center\">Recebedor: <b>{{o.pixName}}</b></span>\n          </div>\n        </sc-if>\n        <div class=\"warn\">Não use Pix agendado. Este pedido vale até {{expires}}.</div>\n        <sc-if value=\"{{manual}}\" hint-placeholder-val=\"{{ true }}\"><a class=\"btn ghost full\" href=\"{{confirmHref}}\">Já paguei, enviar comprovante</a></sc-if>\n        <sc-if value=\"{{o.auto}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"card\" role=\"status\" style=\"padding: 16px; display: flex; gap: 12px; align-items: center; font-size: 14.5px; color: #C9C9D6\"><span class=\"spin\" aria-hidden=\"true\"></span><span>Assim que o Pix cair, seu plano é liberado sozinho. Pode deixar esta tela aberta.</span></div></sc-if>\n        <button onClick=\"{{restart}}\" style=\"background: none; border: none; color: #9C9CAD; font-size: 14px; cursor: pointer; padding: 8px\">Trocar de plano</button>\n      </div>\n    </sc-if>\n  </div>\n  <sc-if value=\"{{toast}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"toast\" role=\"status\">{{toast}}</div></sc-if>\n</div>\n", Component, {});
(async()=>{const d=await DC.api('me');if(d.status===401)location.href='/entrar';})();
</script>
</body>
</html>
