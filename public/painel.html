.ed-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;max-width:1180px;margin:0 auto}

<script>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.uid = 1;
    this.state = { loading: true, user: null, theme: 0, font: 0, shape: 1, acc: '', title: '', bio: '', blocks: [],
      drag: null, over: null, sheet: null, editing: null, saved: 'idle', toast: '' };
  }
  async componentDidMount() {
    const d = await DC.api('editor');
    if (d.status === 401) { location.href = '/entrar'; return; }
    if (!d.ok) { this.setState({ loading: false, saved: 'error', err: d.error }); return; }
    const a = d.appearance || {};
    this.uid = d.blocks.reduce((m, b) => Math.max(m, b.id || 0), 0) + 1;
    this.setState({ loading: false, user: d.user, blocks: d.blocks, title: d.profile.title || '', bio: d.profile.bio || '',
      theme: a.theme || 0, tk: a.tk || '', font: a.font || 0, shape: a.shape == null ? 1 : a.shape, acc: a.acc || '' });
  }
  flash(t) { this.setState({ toast: t }); clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ toast: '' }), 1800); }
  change(patch) {
    this.setState(Object.assign({ saved: 'dirty' }, patch));
    clearTimeout(this.st);
    this.st = setTimeout(() => this.save(), 800);
  }
  async save() {
    clearTimeout(this.st);
    const s = this.state;
    this.setState({ saved: 'saving' });
    const d = await DC.api('editor', 'PUT', { blocks: s.blocks, title: s.title, bio: s.bio,
      appearance: { theme: s.theme, tk: s.tk, font: s.font, shape: s.shape, acc: s.acc } });
    if (d.status === 401) { location.href = '/entrar'; return; }
    this.setState({ saved: d.ok ? 'saved' : 'error', err: d.error });
  }
  kinds() {
    return {
      link: { svg: 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.2 1.2M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.2-1.2', label: 'Link', ic: 'Ln', hint: 'Botão com destino', t: 'Nome do botão', u: 'Link', uh: 'minhaloja.com.br' },
      text: { svg: 'M5 6h14M5 11h14M5 16h9', label: 'Texto', ic: 'Tx', hint: 'Título ou recado', t: 'Texto', u: '', uh: '' },
      video: { svg: 'M4 6h11v12H4zM15 10l5-3v10l-5-3', label: 'Vídeo', ic: 'Vd', hint: 'YouTube, TikTok, Reels', t: 'Título', u: 'Link do vídeo', uh: 'https://youtube.com/watch?v=...' },
      shop: { svg: 'M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2', label: 'Produto', ic: 'Pr', hint: 'Vitrine com preço', t: 'Produto e preço', u: 'Link para comprar', uh: 'minhaloja.com.br/produto' },
      timer: { svg: 'M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM12 9v4l2.5 2M9 2h6', label: 'Contagem', ic: 'Ct', hint: 'Urgência para ofertas', t: 'Texto', u: 'Termina em (AAAA-MM-DD HH:MM)', uh: '2026-12-31 23:59' },
      lead: { svg: 'M4 20l1.4-4A8 8 0 1 1 8 18.6zM9 11h6M9 14h4', label: 'Captura', ic: 'Cc', hint: 'Pegue o WhatsApp', t: 'Texto', u: '', uh: '' },
      pix: { svg: 'M12 3l9 9-9 9-9-9z', label: 'Pix', ic: 'Px', hint: 'Doação ou pagamento', t: 'Nome do botão', u: 'Sua chave Pix', uh: 'e-mail, celular ou chave aleatória' },
      gallery: { svg: 'M4 5h16v14H4zM4 15l4-4 4 4 3-3 5 5M15 9h.01', label: 'Galeria', ic: 'Gl', hint: 'Link para álbum', t: 'Título', u: 'Link do álbum', uh: '' }
    };
  }
  move(from, to) {
    const b = this.state.blocks.slice();
    if (to < 0 || to >= b.length || from === to) return;
    const [x] = b.splice(from, 1);
    b.splice(to, 0, x);
    this.change({ blocks: b });
  }
  update(id, patch) {
    this.change({ blocks: this.state.blocks.map((b) => (b.id === id ? Object.assign({}, b, patch) : b)) });
  }
  renderVals() {
    const K = this.kinds();
    const s = this.state;
    const u = s.user || { plan: 'prata', trial: false, handle: '', instagram: '', limit: 3 };
    const plan = { prata: 0, ouro: 1, diamante: 2 }[u.plan] || 0;
    const themes = [
      { bg: '#0E0E14', fg: '#F3F3F7', card: '#1A1A22', muted: '#A7A7B8', accent: '#D4FF3A', ink: '#0E0E14' },
      { bg: '#F4F2EC', fg: '#16161A', card: '#FFFFFF', muted: '#5C5C66', accent: '#1F5BFF', ink: '#FFFFFF' },
      { bg: '#06222B', fg: '#EAF7F7', card: '#0D3340', muted: '#9CC3C9', accent: '#7CF5D0', ink: '#06222B' },
      { bg: '#1A0F0B', fg: '#FBEFE7', card: '#2A1912', muted: '#C9A999', accent: '#FF8A3D', ink: '#1A0F0B' }
    ];
    const themeIdx = plan === 0 && s.theme >= 2 ? 0 : s.theme;
    const th = Object.assign({}, themes[themeIdx], (plan >= 1 && s.acc) ? { accent: s.acc } : {});
    const fonts = ["'Space Grotesk', Inter, sans-serif", 'Inter, system-ui, sans-serif', 'Georgia, serif'];
    const radius = ['5px', '13px', '999px'][plan >= 1 ? s.shape : 1];
    const list = s.blocks;
    const NEED = { link: 0, video: 1, text: 0, gallery: 1, timer: 1, shop: 1, lead: 1, pix: 1 };
    const limit = u.limit || 0;
    const links = list.filter((b) => b.kind === 'link').length;
    const full = limit > 0 && links >= limit;
    const tierC = ['#C9CDD6', '#F2C14E', '#8FE3FF'];
    const sw = (on) => 'background: ' + (on ? '#D4FF3A' : '#33333E') + '; justify-content: ' + (on ? 'flex-end' : 'flex-start');
    const knob = (on) => 'background: ' + (on ? '#0E0E14' : '#A7A7B8');
    const blocks = list.map((b, i) => {
      const k = K[b.kind] || K.link;
      const hidden = NEED[b.kind] > plan;
      return {
        title: b.title, ic: k.ic, svg: k.svg, featured: !!b.featured, on: b.on,
        sub: hidden ? 'Só no Ouro' : (b.on ? '' : 'Escondido'),
        cls: 'row' + (s.over === i && s.drag !== null && s.drag !== i ? ' over' : ''),
        rowStyle: 'padding-left: 6px; opacity: ' + (b.on ? (s.drag === i ? '.5' : '1') : '.5'),
        toggleLabel: b.on ? 'Esconder bloco' : 'Mostrar bloco',
        swStyle: sw(b.on), knobStyle: knob(b.on),
        dragStart: (e) => { try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(i)); } catch (x) {} this.setState({ drag: i }); },
        dragOver: (e) => { e.preventDefault(); if (this.state.over !== i) this.setState({ over: i }); },
        drop: (e) => { e.preventDefault(); const from = this.state.drag; this.setState({ drag: null, over: null }); if (from !== null) this.move(from, i); },
        dragEnd: () => this.setState({ drag: null, over: null }),
        edit: () => this.setState({ sheet: 'edit', editing: b.id }),
        toggle: () => { this.update(b.id, { on: !b.on });  }
      };
    });
    const idx = list.findIndex((b) => b.id === s.editing);
    const eb = list[idx];
    const ek = eb ? (K[eb.kind] || K.link) : K.link;
    const ed = eb ? {
      kindLabel: ek.label, title: eb.title, url: eb.url || '', titleLabel: ek.t, urlLabel: ek.u, urlHint: ek.uh, hasUrl: !!ek.u,
      canFeature: eb.kind === 'link', featured: !!eb.featured, featSw: sw(!!eb.featured), featKnob: knob(!!eb.featured),
      first: idx === 0, last: idx === list.length - 1,
      setTitle: (e) => this.update(eb.id, { title: e.target.value.slice(0, 300) }),
      setUrl: (e) => this.update(eb.id, { url: e.target.value.slice(0, 600) }),
      toggleFeatured: () => this.update(eb.id, { featured: !eb.featured }),
      up: () => this.move(idx, idx - 1), down: () => this.move(idx, idx + 1),
      remove: () => { if (confirm('Remover o bloco "' + eb.title + '"?')) { this.change({ blocks: list.filter((x) => x.id !== eb.id), sheet: null, editing: null });  } }
    } : {};
    let shown = list.filter((b) => b.on && NEED[b.kind] <= plan);
    shown = shown.filter((b) => b.featured).concat(shown.filter((b) => !b.featured));
    const TT = window.WL_TEMAS || [];
    const tkRaw = s.tk || ['noite', 'papel', 'oceano', 'brasa'][s.theme] || 'noite';
    const trow = TT.find((t) => t[1] === tkRaw) || ['Noite', 'noite', 0];
    const tk = trow[2] <= plan ? trow[1] : 'noite';
    const basic = ['noite', 'papel', 'oceano', 'brasa'].indexOf(tk) >= 0;
    const visible = shown.map((b) => ({
      title: b.title,
      cls: b.kind === 'text' ? 'ph-bio' : (b.kind === 'shop' || b.kind === 'lead' || b.kind === 'timer' || b.kind === 'video' ? 'ph-card' : 'ph-btn' + (b.featured ? ' main' : '')),
      pStyle: (b.kind === 'text' ? 'text-align: center; max-width: none' : '') + (plan >= 1 && basic && b.kind !== 'text' ? '; border-radius: ' + radius : '') + (plan >= 1 && s.acc && b.featured ? '; background: ' + s.acc + '; border-color: ' + s.acc : '')
    }));
    const saveMap = { idle: ['Tudo salvo', '#6F6F80'], dirty: ['Salvando em instantes…', '#F2C14E'], saving: ['Salvando…', '#9C9CAD'], saved: ['Tudo salvo ✓', '#D4FF3A'], error: [s.err || 'Não salvou. Confira a internet.', '#FF8A6B'] };
    const days = u.until ? Math.max(0, Math.ceil((u.until - Date.now()) / 86400000)) : 0;
    const title = s.title || u.name || '';
    const close = () => this.setState({ sheet: null, editing: null });
    return {
      loading: s.loading, ready: !s.loading,
      handle: u.handle, instagram: u.instagram, pageUrl: '/' + u.handle,
      planLabel: u.trial ? 'Teste Diamante · ' + days + (days === 1 ? ' dia' : ' dias') : ['Prata grátis', 'Plano Ouro', 'Plano Diamante'][plan],
      planColor: tierC[plan], planBg: ['rgba(201,205,214,.12)', 'rgba(242,193,78,.14)', 'rgba(143,227,255,.14)'][plan],
      limitText: limit ? links + ' de ' + limit + ' links' : links + (links === 1 ? ' link' : ' links') + ' · ilimitados',
      limitColor: full ? '#F2C14E' : '#C9C9D6',
      saveText: saveMap[s.saved][0], saveColor: saveMap[s.saved][1], saveError: s.saved === 'error',
      copyLabel: 'Copiar',
      copyLink: async () => { try { await navigator.clipboard.writeText('https://whitelink.site/' + u.handle); } catch (e) {} this.flash('Link copiado!'); },
      share: async () => {
        const url = 'https://whitelink.site/' + u.handle;
        if (navigator.share) { try { await navigator.share({ title: title, url: url }); return; } catch (e) { return; } }
        try { await navigator.clipboard.writeText(url); } catch (e) {} this.flash('Link copiado!');
      },
      count: list.length, empty: list.length === 0, hasBlocks: list.length > 0,
      blocks: blocks, ed: ed,
      visible: visible, showBrand: plan === 0, isPrata: plan === 0,
      initials: (title.split(/\s+/).map((w) => w[0] || '').join('').slice(0, 2) || 'WL').toUpperCase(),
      pageTitle: title, bio: s.bio, bioLine: s.bio || 'Toque para escrever sua bio',
      setPageTitle: (e) => this.change({ title: e.target.value.slice(0, 60) }),
      setBio: (e) => this.change({ bio: e.target.value.slice(0, 160) }),
      bg: th.bg, fg: th.fg, card: th.card, muted: th.muted, accent: th.accent,
      tcls: 't-' + tk, phStyle: plan >= 1 && basic ? 'font-family: ' + fonts[s.font] : '',
      fontStack: fonts[plan >= 1 ? s.font : 0],
      sheetAdd: s.sheet === 'add', sheetEdit: s.sheet === 'edit' && !!eb, sheetProfile: s.sheet === 'profile', sheetPreview: s.sheet === 'preview',
      openAdd: () => this.setState({ sheet: 'add' }),
      openProfile: () => this.setState({ sheet: 'profile' }),
      openPreview: () => this.setState({ sheet: 'preview' }),
      closeSheet: () => { close(); this.save(); },
      stop: (e) => e.stopPropagation(),
      toast: s.toast,
      library: Object.keys(K).map((key) => {
        const lim = key === 'link' && full;
        const locked = NEED[key] > plan || lim;
        return Object.assign({}, K[key], {
          locked: locked, need: lim ? 'Limite' : 'Ouro',
          add: () => {
            if (locked) return;
            const id = this.uid++;
            const nb = { id: id, kind: key, title: key === 'text' ? 'Escreva seu texto aqui' : K[key].label, url: '', on: true };
            this.change({ blocks: list.concat([nb]), sheet: 'edit', editing: id });
          }
        });
      })
    };
  }
}
