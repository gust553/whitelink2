}

</head>
<body>

<div id="root"></div>

<script>window.DC_LINKS={"Main.dc.html":"/","Entrar.dc.html":"/entrar","Teste.dc.html":"/entrar#cadastro","Editor.dc.html":"/painel","Aparencia.dc.html":"/painel/aparencia","Temas.dc.html":"/painel/temas","CriadorTema.dc.html":"/painel/criador-tema","Agenda.dc.html":"/painel/agendamentos","Stats.dc.html":"/painel/estatisticas","Contatos.dc.html":"/painel/contatos","Configuracoes.dc.html":"/painel/configuracoes","Indique.dc.html":"/painel/indique","MeuPlano.dc.html":"/painel/plano","Conta.dc.html":"/painel/conta","EditarLink.dc.html":"/painel/editar-link","Pagamento.dc.html":"/pagamento","ConfirmarPagamento.dc.html":"/pagamento/confirmar","CentralAjuda.dc.html":"/ajuda","SuporteCliente.dc.html":"/painel/suporte","Recibo.dc.html":"/painel/recibo","Termos.dc.html":"/termos","Privacidade.dc.html":"/privacidade","Planos.dc.html":"/#precos","PaginaPublica.dc.html":"/","PaginaFechada.dc.html":"/"};</script>
<script src="/assets/dc.js"></script>

<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { i: 0 }; }
  renderVals() {
    const S = [
      [
            "Quais dados coletamos",
            [
                  "Cadastro: nome, e-mail, celular, @ do Instagram e senha (guardada de forma protegida).",
                  "Uso: páginas visitadas no painel, aparelho, navegador e conexão, para segurança e para evitar mais de um teste por pessoa.",
                  "Pagamento: valor, data, nome de quem pagou e o comprovante ou o ID da transação Pix. Não guardamos dados de cartão."
            ]
      ],
      [
            "Para que usamos",
            [
                  "Para criar e manter a sua conta, liberar o seu plano, mandar códigos e avisos por SMS e e-mail e prestar suporte.",
                  "Para proteger o serviço contra fraude, como testes repetidos, comprovantes falsos e indicações falsas."
            ]
      ],
      [
            "Visitantes da sua página",
            [
                  "Contamos visitas e cliques da sua página para mostrar nas suas estatísticas, sem identificar quem é o visitante.",
                  "Se você usar a captura de contato, os dados que os visitantes enviam ficam disponíveis só para você."
            ]
      ],
      [
            "Com quem compartilhamos",
            [
                  "Só com empresas necessárias para o serviço funcionar: hospedagem, envio de SMS e e-mail e, quando ligado, o gateway de pagamento.",
                  "Não vendemos os seus dados."
            ]
      ],
      [
            "Seus direitos (LGPD)",
            [
                  "Você pode pedir para ver, corrigir, levar ou apagar os seus dados a qualquer momento, pelo suporte.",
                  "Alguns dados de pagamento precisam ser guardados pelo prazo que a lei exige."
            ]
      ],
      [
            "Segurança",
            [
                  "Usamos conexão segura, senhas protegidas, código por SMS e aviso quando há login em aparelho novo."
            ]
      ],
      [
            "Contato do responsável",
            [
                  "Responsável pelos dados: GM DIGITAL · WhatsApp (11) 99393-1841."
            ]
      ]
];
    const i = this.state.i;
    return {
      secs: S.map((x, j) => ({ n: (j + 1) + '. ' + x[0], sel: i === j, pick: () => this.setState({ i: j }),
        style: 'min-height: 40px; padding: 0 12px; border-radius: 10px; cursor: pointer; font-size: 13px; ' + (i === j ? 'border: 1px solid #D4FF3A; background: #22222B; color: #F3F3F7; font-weight: 600' : 'border: 1px solid #2A2A34; background: transparent; color: #C9C9D6') })),
      cur: { n: (i + 1) + '. ' + S[i][0], p: S[i][1] }
    };
  }
}

DC.mount(document.getElementById('root'), "\n<div style=\"min-height: 1300px; background: #0B0B10; color: #F3F3F7; font-family: Inter, system-ui, sans-serif\">\n  <header style=\"border-bottom: 1px solid #22222B; background: #0E0E14\">\n    <div style=\"max-width: 1000px; margin: 0 auto; padding: 14px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 12px\">\n      <a href=\"Main.dc.html\" style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; color: #F3F3F7; text-decoration: none\">WhiteLink</a>\n      <div style=\"flex: 1\"></div>\n      <a href=\"CentralAjuda.dc.html\" style=\"font-size: 14px; color: #C9C9D6; text-decoration: none\">Ajuda</a>\n      <a href=\"Entrar.dc.html\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #33333E; color: #F3F3F7; font-size: 14px; display: flex; align-items: center; text-decoration: none\">Entrar</a>\n    </div>\n  </header>\n  <div style=\"max-width: 820px; margin: 0 auto; padding: 48px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px\">\n    <div style=\"padding: 14px 16px; border-radius: 12px; background: #2B2210; border: 1px solid #4A3A14; color: #F7DFA0; font-size: 14px; line-height: 1.55\">Modelo para o protótipo. Antes de colocar o site no ar, peça para um advogado revisar este texto.</div>\n    <h1 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 40px; font-weight: 700\">Política de privacidade</h1>\n    <span style=\"font-size: 14px; color: #A7A7B8\">Última atualização: 19/11/2026 · GM DIGITAL</span>\n    <p style=\"margin: 0; font-size: 16px; color: #C9C9D6; line-height: 1.6\">Aqui explicamos quais dados guardamos, por que guardamos e como você pode pedir para ver ou apagar.</p>\n    <nav aria-label=\"Seções\" style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n      <sc-for list=\"{{secs}}\" as=\"x\" hint-placeholder-count=\"7\">\n        <button onClick=\"{{x.pick}}\" aria-pressed=\"{{x.sel}}\" style=\"{{x.style}}\">{{x.n}}</button>\n      </sc-for>\n    </nav>\n    <section style=\"padding: 24px; border-radius: 18px; background: #14141B; border: 1px solid #22222B; display: flex; flex-direction: column; gap: 12px\">\n      <h2 style=\"margin: 0; font-size: 22px; font-weight: 600\">{{cur.n}}</h2>\n      <sc-for list=\"{{cur.p}}\" as=\"p\" hint-placeholder-count=\"3\">\n        <p style=\"margin: 0; font-size: 15px; color: #C9C9D6; line-height: 1.65\">{{p}}</p>\n      </sc-for>\n    </section>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px\">\n      <a href=\"Termos.dc.html\">Ler os Termos de uso</a>\n      <a href=\"CentralAjuda.dc.html\">Dúvidas? Fale com a gente</a>\n    </div>\n  </div>\n</div>\n", Component, {});

</script>
