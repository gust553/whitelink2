<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
.hero{padding:20px;border-radius:24px;background:linear-gradient(140deg,#1E2A0A,#14141B 70%);border:1px solid #33421A;display:flex;flex-direction:column;gap:14px}
.hero h2{margin:0;font:700 24px/1.15 'Space Grotesk',sans-serif}
.code{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:16px;background:#0E0E14;border:1px solid #2A2A34}
.code span{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#C9C9D6}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.kp .card{padding:14px;display:flex;flex-direction:column;gap:4px}
.kp b{font:700 24px 'Space Grotesk',sans-serif}
.kp span{font-size:12.5px;color:#9C9CAD}
.lv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lv div{padding:12px 10px;border-radius:16px;border:1px solid #2A2A34;background:#14141B;font-size:12.5px;color:#9C9CAD;display:flex;flex-direction:column;gap:3px}
.lv div b{font-size:14px;color:#F3F3F7}
.lv div.on{border-color:#D4FF3A;background:rgba(212,255,58,.08)}
.step{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:#C9C9D6;line-height:1.45}
.step i{flex:none;width:28px;height:28px;border-radius:50%;background:#1B1B24;color:#D4FF3A;font:700 13px 'Space Grotesk';font-style:normal;display:flex;align-items:center;justify-content:center}
</style>
<link rel="stylesheet" href="/assets/shell.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0B0B10"><link rel="apple-touch-icon" href="/assets/icons/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="icon" href="/assets/icons/icon-192.png">
</head>
<body class="has-shell">

<div id="root"></div>
<nav class="rail" aria-label="Menu"><a class="rail-logo" href="/painel" aria-label="WhiteLink">W</a><a class="rail-i" href="/painel"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>Página</a><a class="rail-i" href="/painel/vendas"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9M4 9h16v11H4zM9 13h6"/></svg></span>Vendas</a><a class="rail-i" href="/painel/clientes"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.4 3.4-5 6.5-5s5.7 1.6 6.5 5M16 4.6a3.5 3.5 0 0 1 0 6.8M17.5 15c2 .6 3.4 2.3 3.8 5"/></svg></span>Clientes</a><a class="rail-i" href="/painel/estatisticas"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg></span>Números</a><a class="rail-i on" href="/painel/mais" aria-current="page"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg></span>Mais</a></nav>

<script>window.DC_LINKS={"Main.dc.html":"/","Entrar.dc.html":"/entrar","Teste.dc.html":"/entrar#cadastro","Editor.dc.html":"/painel","Aparencia.dc.html":"/painel/aparencia","Temas.dc.html":"/painel/temas","CriadorTema.dc.html":"/painel/criador-tema","Agenda.dc.html":"/painel/agendamentos","Stats.dc.html":"/painel/estatisticas","Contatos.dc.html":"/painel/clientes","Configuracoes.dc.html":"/painel/configuracoes","Indique.dc.html":"/painel/indique","MeuPlano.dc.html":"/painel/plano","Conta.dc.html":"/painel/conta","EditarLink.dc.html":"/painel","Pagamento.dc.html":"/pagamento","ConfirmarPagamento.dc.html":"/pagamento/confirmar","CentralAjuda.dc.html":"/ajuda","SuporteCliente.dc.html":"/painel/suporte","Recibo.dc.html":"/painel/recibo","Termos.dc.html":"/termos","Privacidade.dc.html":"/privacidade","Planos.dc.html":"/#precos","PaginaPublica.dc.html":"/","PaginaFechada.dc.html":"/"};</script>
<script src="/assets/dc.js"></script>
<script src="/assets/temas-list.js"></script>
<script src="/assets/planos.js"></script>
<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { d: null, copied: false }; }
  async componentDidMount() {
    const d = await DC.api('referrals');
    if (d.status === 401) { location.href = '/entrar'; return; }
    this.setState({ d: d.ok ? d : null });
  }
  renderVals() {
    const d = this.state.d;
    if (!d) return { loading: true };
    const L = [['Indicador', '1 a 4 amigos', '50% · renov. 10%'], ['Embaixador', '5 a 14 amigos', '60% · renov. 15%'], ['Elite', '15 ou mais', '70% · renov. 20%']];
    const st = { aguardando: ['Chegando', 'rgba(242,193,78,.16)', '#F7DFA0'], liberado: ['Ganhou', 'rgba(212,255,58,.14)', '#D4FF3A'], cancelado: ['Cancelado', '#26262F', '#9C9CAD'], cadastrou: ['Cadastrou', '#1B1B24', '#9C9CAD'] };
    return {
      loading: false, ready: true, link: d.link,
      copyLabel: this.state.copied ? 'Copiado ✓' : 'Copiar',
      copy: async () => { try { await navigator.clipboard.writeText(d.link); } catch (e) {} this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 2000); },
      waShare: 'https://wa.me/?text=' + encodeURIComponent('Crie sua página de links no WhiteLink e ganhe 7 dias a mais: ' + d.link),
      earned: d.earned, waiting: d.waiting, paying: d.paying,
      levels: L.map((l) => ({ name: l[0], need: l[1], gain: l[2], cls: l[0] === d.level ? 'on' : '' })),
      friends: d.friends.map((f) => { const s = st[f.status] || st.cadastrou; return { ini: (f.name[0] || '?').toUpperCase(), name: f.name, sub: f.plan + (f.days ? ' · +' + f.days + ' dias para você' : ''), status: s[0], chipStyle: 'background: ' + s[1] + '; color: ' + s[2] }; }),
      noFriends: d.friends.length === 0
    };
  }
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
DC.mount(document.getElementById('root'), "\n<div>\n  <div class=\"appbar\"><a class=\"icon-btn\" href=\"/painel/mais\" aria-label=\"Voltar\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M15 5l-7 7 7 7\"/></svg></a><h1>Indique e ganhe</h1></div>\n  <div class=\"app-main\">\n    <sc-if value=\"{{loading}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color: #9C9CAD; padding-top: 30px\">Carregando…</div></sc-if>\n    <sc-if value=\"{{ready}}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <div class=\"hero\">\n        <h2>Indique um amigo e ganhe dias grátis</h2>\n        <span style=\"font-size: 14px; color: #C9C9D6; line-height: 1.5\">Seu amigo ganha 7 dias a mais. Quando ele assinar, você ganha dias no seu plano.</span>\n        <div class=\"code\"><span>{{link}}</span><button class=\"btn\" onClick=\"{{copy}}\" style=\"height: 42px; padding: 0 16px\">{{copyLabel}}</button></div>\n        <a class=\"btn ghost full\" href=\"{{waShare}}\" target=\"_blank\" rel=\"noopener\">Mandar no WhatsApp</a>\n      </div>\n\n      <div class=\"kp\">\n        <div class=\"card\"><b>{{earned}}</b><span>dias ganhos</span></div>\n        <div class=\"card\"><b>{{waiting}}</b><span>dias chegando</span></div>\n        <div class=\"card\"><b>{{paying}}</b><span>amigos assinantes</span></div>\n      </div>\n\n      <div class=\"sec-t\">Seu nível</div>\n      <div class=\"lv\"><sc-for list=\"{{levels}}\" as=\"l\" hint-placeholder-count=\"3\"><div class=\"{{l.cls}}\"><b>{{l.name}}</b>{{l.need}}<span style=\"color: #D4FF3A\">{{l.gain}}</span></div></sc-for></div>\n\n      <div class=\"sec-t\">Como funciona</div>\n      <div class=\"card\" style=\"padding: 16px; display: flex; flex-direction: column; gap: 14px\">\n        <div class=\"step\"><i>1</i><span>Mande seu link. Seu amigo cria a conta por ele e já ganha 7 dias a mais de teste.</span></div>\n        <div class=\"step\"><i>2</i><span>Quando ele pagar, você ganha dias no seu plano, de acordo com o seu nível. Nas renovações dele, você ganha de novo.</span></div>\n        <div class=\"step\"><i>3</i><span>Os dias entram na sua conta 7 dias depois do pagamento do amigo.</span></div>\n      </div>\n\n      <div class=\"sec-t\">Seus amigos</div>\n      <div class=\"list\">\n        <sc-for list=\"{{friends}}\" as=\"f\" hint-placeholder-count=\"3\">\n          <div class=\"row\" style=\"cursor: default\"><span class=\"row-ic\" style=\"font: 700 15px 'Space Grotesk'; color: #F3F3F7\">{{f.ini}}</span><span class=\"row-tx\"><b>{{f.name}}</b><span>{{f.sub}}</span></span><span class=\"chip\" style=\"{{f.chipStyle}}\">{{f.status}}</span></div>\n        </sc-for>\n        <sc-if value=\"{{noFriends}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"row\" style=\"color: #9C9CAD; cursor: default\">Ninguém ainda. Mande seu link!</div></sc-if>\n      </div>\n    </div>\n    </sc-if>\n  </div>\n</div>\n", Component, {});
(async()=>{const d=await DC.api('me');if(d.status===401)location.href='/entrar?next='+encodeURIComponent(location.pathname+location.search);})();
</script>
</body>
</html>
