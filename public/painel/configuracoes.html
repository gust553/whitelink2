<script>window.DC_LINKS={"Main.dc.html":"/","Entrar.dc.html":"/entrar","Teste.dc.html":"/entrar#cadastro","Editor.dc.html":"/painel","Aparencia.dc.html":"/painel/aparencia","Temas.dc.html":"/painel/temas","CriadorTema.dc.html":"/painel/criador-tema","Agenda.dc.html":"/painel/agendamentos","Stats.dc.html":"/painel/estatisticas","Contatos.dc.html":"/painel/contatos","Configuracoes.dc.html":"/painel/configuracoes","Indique.dc.html":"/painel/indique","MeuPlano.dc.html":"/painel/plano","Conta.dc.html":"/painel/conta","EditarLink.dc.html":"/painel","Pagamento.dc.html":"/pagamento","ConfirmarPagamento.dc.html":"/pagamento/confirmar","CentralAjuda.dc.html":"/ajuda","SuporteCliente.dc.html":"/painel/suporte","Recibo.dc.html":"/painel/recibo","Termos.dc.html":"/termos","Privacidade.dc.html":"/privacidade","Planos.dc.html":"/#precos","PaginaPublica.dc.html":"/","PaginaFechada.dc.html":"/"};</script>
<script src="/assets/dc.js"></script>
<script src="/assets/temas-list.js"></script>
<script src="/assets/planos.js"></script>
<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { d: null, s: { seo: {} }, saved: false, warn: '' }; }
  async componentDidMount() {
    const d = await DC.api('settings');
    if (d.status === 401) { location.href = '/entrar'; return; }
    this.setState({ d: d, s: Object.assign({ seo: {} }, d.settings) });
  }
  set(patch) { this.setState({ s: Object.assign({}, this.state.s, patch), saved: false }); }
  renderVals() {
    const d = this.state.d, s = this.state.s;
    if (!d || !d.ok) return { loading: true };
    const url = 'https://whitelink.site/' + d.handle;
    return {
      loading: false, ready: true, handle: d.handle,
      qr: 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=0&data=' + encodeURIComponent(url),
      qrDownload: 'https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&margin=20&format=png&data=' + encodeURIComponent(url),
      seoTitle: s.seo.title || '', seoDesc: s.seo.desc || '',
      setSeoTitle: (e) => this.set({ seo: Object.assign({}, s.seo, { title: e.target.value }) }),
      setSeoDesc: (e) => this.set({ seo: Object.assign({}, s.seo, { desc: e.target.value }) }),
      dia: d.level === 2, notDia: d.level < 2,
      pixel: s.pixel || '', ga: s.ga || '', domain: s.domain || '',
      setPixel: (e) => this.set({ pixel: e.target.value }), setGa: (e) => this.set({ ga: e.target.value }), setDomain: (e) => this.set({ domain: e.target.value }),
      warn: this.state.warn,
      saveLabel: this.state.saved ? 'Salvo ✓' : 'Salvar',
      save: async () => {
        const r = await DC.api('settings', 'PUT', s);
        this.setState({ saved: r.ok, warn: r.ok ? (r.warnings || []).join(' ') : r.error });
      }
    };
  }
}

DC.mount(document.getElementById('root'), "\n<div>\n  <div class=\"appbar\"><a class=\"icon-btn\" href=\"/painel/mais\" aria-label=\"Voltar\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M15 5l-7 7 7 7\"/></svg></a><h1>Configurações</h1></div>\n  <div class=\"app-main\">\n    <sc-if value=\"{{loading}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color: #9C9CAD; padding-top: 30px\">Carregando…</div></sc-if>\n    <sc-if value=\"{{ready}}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <div class=\"sec-t\" style=\"margin-top: 6px\">QR code da sua página</div>\n      <div class=\"card\" style=\"padding: 18px; display: flex; flex-direction: column; gap: 14px; align-items: center\">\n        <img class=\"qr\" src=\"{{qr}}\" alt=\"QR code de whitelink.site/{{handle}}\">\n        <span style=\"font-size: 15px\">whitelink.site/<b>{{handle}}</b></span>\n        <a class=\"btn full\" href=\"{{qrDownload}}\" target=\"_blank\" rel=\"noopener\" download=\"whitelink-qrcode.png\">Baixar QR code</a>\n      </div>\n\n      <div class=\"sec-t\">Aparecer no Google</div>\n      <div class=\"card\" style=\"padding: 16px\">\n        <label class=\"fld\">Título<input class=\"inp\" value=\"{{seoTitle}}\" onInput=\"{{setSeoTitle}}\" maxlength=\"70\" placeholder=\"Ex.: Mariana Souza · Moda autoral\"></label>\n        <label class=\"fld\" style=\"margin: 0\">Descrição<input class=\"inp\" value=\"{{seoDesc}}\" onInput=\"{{setSeoDesc}}\" maxlength=\"160\" placeholder=\"Uma frase sobre você ou sua loja\"></label>\n      </div>\n\n      <div class=\"sec-t\" style=\"display: flex; align-items: center; gap: 8px\">Pixel, Analytics e domínio <span class=\"lk\">Diamante</span></div>\n      <div class=\"card\" style=\"padding: 16px\">\n        <sc-if value=\"{{dia}}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <label class=\"fld\">Pixel da Meta (ID)<input class=\"inp\" value=\"{{pixel}}\" onInput=\"{{setPixel}}\" inputmode=\"numeric\" placeholder=\"Ex.: 123456789012345\"></label>\n            <label class=\"fld\">Google Analytics (ID)<input class=\"inp\" value=\"{{ga}}\" onInput=\"{{setGa}}\" placeholder=\"Ex.: G-ABC123XYZ\"></label>\n            <label class=\"fld\" style=\"margin: 0\">Domínio próprio<input class=\"inp\" value=\"{{domain}}\" onInput=\"{{setDomain}}\" placeholder=\"Ex.: links.seusite.com.br\"></label>\n            <sc-if value=\"{{domain}}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size: 13px; color: #9C9CAD; line-height: 1.5; margin: 10px 0 0\">Para ligar o domínio, chame a gente no WhatsApp. Nós configuramos com você.</p></sc-if>\n          </div>\n        </sc-if>\n        <sc-if value=\"{{notDia}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 12px\">\n            <span style=\"font-size: 14px; color: #C9C9D6; line-height: 1.5\">Pixel da Meta, Google Analytics e domínio próprio (seusite.com.br) ficam liberados no Diamante.</span>\n            <a class=\"btn\" href=\"/painel/plano\" style=\"background: #8FE3FF\">Conhecer o Diamante</a>\n          </div>\n        </sc-if>\n      </div>\n      <sc-if value=\"{{warn}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: #2B2210; color: #F7DFA0; font-size: 14px\">{{warn}}</div></sc-if>\n      <button class=\"btn full\" onClick=\"{{save}}\" style=\"margin-top: 16px\">{{saveLabel}}</button>\n    </div>\n    </sc-if>\n  </div>\n</div>\n", Component, {});
(async()=>{const d=await DC.api('me');if(d.status===401)location.href='/entrar';})();
</script>
