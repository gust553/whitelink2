<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { d: null, s: { seo: {} }, saved: false, warn: '' }; }
  async componentDidMount() {
    const d = await DC.api('settings');
    if (d.status === 401) { location.href = '/entrar'; return; }
    this.setState({ d: d, s: Object.assign({ seo: {} }, d.settings) });
    if (d.level === 2) this.loadDomain(false);
  }
  async loadDomain(check) {
    this.setState({ dmBusy: true });
    const r = await DC.api('domain' + (check ? '?check=1' : ''));
    this.setState({ dm: r.ok ? r : null, dmBusy: false, dmChecked: !!check });
  }
  dmVals() {
    const st = this.state, r = st.dm;
    const copy = (t) => { try { navigator.clipboard.writeText(t); } catch (e) {} };
    if (!r) return { off: false, ask: false, has: false, err: st.dmErr || '' };
    const dmn = r.domain;
    const base = { busy: !!st.dmBusy, err: st.dmErr || '', input: st.dmInput || '' };
    if (!r.enabled && !dmn) return Object.assign(base, { off: true });
    if (!dmn) return Object.assign(base, {
      ask: true,
      setInput: (e) => this.setState({ dmInput: e.target.value, dmErr: '' }),
      add: async () => {
        this.setState({ dmBusy: true, dmErr: '' });
        const x = await DC.api('domain', 'POST', { hostname: st.dmInput });
        if (!x.ok) { this.setState({ dmBusy: false, dmErr: x.error }); return; }
        this.loadDomain(false);
      }
    });
    const on = dmn.status === 'ativo';
    return Object.assign(base, {
      has: true, host: dmn.hostname, active: on, waiting: !on, url: 'https://' + dmn.hostname,
      st: on ? 'Funcionando' : 'Aguardando', chip: on ? 'background: rgba(74,222,128,.14); color: #4ADE80' : 'background: rgba(242,193,78,.16); color: #F2C14E',
      howMany: dmn.records.length === 1 ? 'este registro' : 'estes registros',
      records: dmn.records.map((x) => ({ type: x.type, name: x.name, value: x.value, copyName: () => copy(x.name), copyValue: () => copy(x.value) })),
      error: st.dmChecked && !on ? (dmn.error ? 'Ainda não ficou pronto: ' + dmn.error : 'Ainda não ficou pronto. Confira o registro e tente de novo em alguns minutos.') : '',
      checkLabel: st.dmBusy ? 'Verificando…' : 'Já configurei, verificar agora',
      check: () => this.loadDomain(true),
      remove: async () => { if (!confirm('Remover o domínio ' + dmn.hostname + '? Sua página continua em whitelink.site.')) return; await DC.api('domain', 'DELETE'); this.setState({ dmInput: '' }); this.loadDomain(false); }
    });
  }
  qrUrl(url, size) {
    const c = (this.state.qrColor || '#0e0e14').slice(1), b = (this.state.qrBg || '#ffffff').slice(1);
    return 'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size + '&margin=0&ecc=H&color=' + c + '&bgcolor=' + b + '&data=' + encodeURIComponent(url);
  }
  async downloadQr(url, d) {
    const load = (src, cors) => new Promise((ok, bad) => { const i = new Image(); if (cors) i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = bad; i.src = src; });
    try {
      const S = 1000, P = 60, cv = document.createElement('canvas'); cv.width = cv.height = S + P * 2;
      const x = cv.getContext('2d'); x.fillStyle = this.state.qrBg || '#ffffff'; x.fillRect(0, 0, cv.width, cv.height);
      x.drawImage(await load(this.qrUrl(url, S), true), P, P, S, S);
      if (this.state.qrLogoOn && d.avatar) {
        const a = await load('/m/' + d.avatar), r = 110, c = cv.width / 2;
        x.fillStyle = this.state.qrBg || '#ffffff'; x.beginPath(); x.arc(c, c, r + 16, 0, 7); x.fill();
        x.save(); x.beginPath(); x.arc(c, c, r, 0, 7); x.clip(); x.drawImage(a, c - r, c - r, r * 2, r * 2); x.restore();
      }
      const link = document.createElement('a'); link.download = 'whitelink-qrcode.png'; link.href = cv.toDataURL('image/png'); link.click();
    } catch (e) { window.open(this.qrUrl(url, 1000), '_blank'); }
  }
  set(patch) { this.setState({ s: Object.assign({}, this.state.s, patch), saved: false }); }
  renderVals() {
    const d = this.state.d, s = this.state.s;
    if (!d || !d.ok) return { loading: true };
    const url = 'https://whitelink.site/' + d.handle;
    return {
      loading: false, ready: true, handle: d.handle,
      qr: this.qrUrl(url, 400),
      qrBox: 'background: ' + (this.state.qrBg || '#ffffff'), qrBgHex: this.state.qrBg || '#ffffff', qrColor: this.state.qrColor || '#0e0e14',
      qrLocked: d.level < 1, qrLogo: this.state.qrLogoOn && d.avatar ? '/m/' + d.avatar : '',
      logoLabel: !d.avatar ? 'Sem foto de perfil' : this.state.qrLogoOn ? 'Tirar minha foto' : 'Pôr minha foto',
      setQrColor: (e) => this.setState({ qrColor: e.target.value }), setQrBg: (e) => this.setState({ qrBg: e.target.value }),
      toggleLogo: () => { if (d.level < 1) return; if (!d.avatar) { location.href = '/painel'; return; } this.setState({ qrLogoOn: !this.state.qrLogoOn }); },
      downloadQr: () => this.downloadQr(url, d),
      seoTitle: s.seo.title || '', seoDesc: s.seo.desc || '',
      setSeoTitle: (e) => this.set({ seo: Object.assign({}, s.seo, { title: e.target.value }) }),
      setSeoDesc: (e) => this.set({ seo: Object.assign({}, s.seo, { desc: e.target.value }) }),
      dia: d.level === 2, notDia: d.level < 2,
      pixel: s.pixel || '', ga: s.ga || '',
      setPixel: (e) => this.set({ pixel: e.target.value }), setGa: (e) => this.set({ ga: e.target.value }),
      dm: this.dmVals(),
      warn: this.state.warn,
      saveLabel: this.state.saved ? 'Salvo ✓' : 'Salvar',
      save: async () => {
        const r = await DC.api('settings', 'PUT', s);
        this.setState({ saved: r.ok, warn: r.ok ? (r.warnings || []).join(' ') : r.error });
      }
    };
  }
}

DC.mount(document.getElementById('root'), "\n<div>\n  <div class=\"appbar\"><a class=\"icon-btn\" href=\"/painel/mais\" aria-label=\"Voltar\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M15 5l-7 7 7 7\"/></svg></a><h1>Configurações</h1></div>\n  <div class=\"app-main\">\n    <sc-if value=\"{{loading}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color: #9C9CAD; padding-top: 30px\">Carregando…</div></sc-if>\n    <sc-if value=\"{{ready}}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <div class=\"sec-t\" style=\"margin-top: 6px\">QR code da sua página<button class=\"hq\" data-help=\"qr\" aria-label=\"Ajuda\">?</button></div>\n      <div class=\"card\" style=\"padding: 18px; display: flex; flex-direction: column; gap: 14px; align-items: center\">\n        <div style=\"position: relative; width: 220px; height: 220px; border-radius: 18px; padding: 10px; box-sizing: border-box; {{qrBox}}\"><img src=\"{{qr}}\" alt=\"QR code de whitelink.site/{{handle}}\" style=\"width: 100%; height: 100%; display: block\"><sc-if value=\"{{qrLogo}}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{qrLogo}}\" alt=\"\" style=\"position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px; border-radius: 50%; border: 4px solid {{qrBgHex}}; object-fit: cover\"></sc-if></div>\n        <span style=\"font-size: 15px\">whitelink.site/<b>{{handle}}</b></span>\n        <div style=\"display: flex; gap: 10px; width: 100%; align-items: center\">\n          <label style=\"flex: 1; font-size: 12.5px; color: #9C9CAD; display: flex; flex-direction: column; gap: 4px\">Cor<input type=\"color\" value=\"{{qrColor}}\" onInput=\"{{setQrColor}}\" disabled=\"{{qrLocked}}\" style=\"width: 100%; height: 42px; border-radius: 12px; border: 1px solid #24242E; background: #14141B\"></label>\n          <label style=\"flex: 1; font-size: 12.5px; color: #9C9CAD; display: flex; flex-direction: column; gap: 4px\">Fundo<input type=\"color\" value=\"{{qrBgHex}}\" onInput=\"{{setQrBg}}\" disabled=\"{{qrLocked}}\" style=\"width: 100%; height: 42px; border-radius: 12px; border: 1px solid #24242E; background: #14141B\"></label>\n          <button class=\"btn ghost\" onClick=\"{{toggleLogo}}\" style=\"flex: 1.3; height: 42px; margin-top: 18px; font-size: 13px\">{{logoLabel}}</button>\n        </div>\n        <sc-if value=\"{{qrLocked}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 12.5px; color: #9C9CAD; text-align: center\">Cores e sua foto no meio do QR: plano Ouro.</span></sc-if>\n        <button class=\"btn full\" onClick=\"{{downloadQr}}\">Baixar QR code</button>\n      </div>\n\n      <div class=\"sec-t\">Aparecer no Google<button class=\"hq\" data-help=\"google\" aria-label=\"Ajuda\">?</button></div>\n      <div class=\"card\" style=\"padding: 16px\">\n        <label class=\"fld\">Título<input class=\"inp\" value=\"{{seoTitle}}\" onInput=\"{{setSeoTitle}}\" maxlength=\"70\" placeholder=\"Ex.: Mariana Souza · Moda autoral\"></label>\n        <label class=\"fld\" style=\"margin: 0\">Descrição<input class=\"inp\" value=\"{{seoDesc}}\" onInput=\"{{setSeoDesc}}\" maxlength=\"160\" placeholder=\"Uma frase sobre você ou sua loja\"></label>\n      </div>\n\n      <div class=\"sec-t\" style=\"display: flex; align-items: center; gap: 8px\">Pixel e Analytics <span class=\"lk\">Diamante</span><button class=\"hq\" data-help=\"pixel\" aria-label=\"Ajuda\">?</button></div>\n      <div class=\"card\" style=\"padding: 16px\">\n        <sc-if value=\"{{dia}}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <label class=\"fld\">Pixel da Meta (ID)<input class=\"inp\" value=\"{{pixel}}\" onInput=\"{{setPixel}}\" inputmode=\"numeric\" placeholder=\"Ex.: 123456789012345\"></label>\n            <label class=\"fld\" style=\"margin: 0\">Google Analytics (ID)<input class=\"inp\" value=\"{{ga}}\" onInput=\"{{setGa}}\" placeholder=\"Ex.: G-ABC123XYZ\"></label>\n          </div>\n        </sc-if>\n        <sc-if value=\"{{notDia}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 12px\">\n            <span style=\"font-size: 14px; color: #C9C9D6; line-height: 1.5\">Pixel da Meta, Google Analytics e domínio próprio (ex.: links.seusite.com.br) ficam liberados no Diamante.</span>\n            <a class=\"btn\" href=\"/painel/plano\" style=\"background: #8FE3FF\">Conhecer o Diamante</a>\n          </div>\n        </sc-if>\n      </div>\n      <sc-if value=\"{{dia}}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div class=\"sec-t\" style=\"display: flex; align-items: center; gap: 8px\">Domínio próprio <span class=\"lk\">Diamante</span><button class=\"hq\" data-help=\"dominio\" aria-label=\"Ajuda\">?</button></div>\n        <div class=\"card\" style=\"padding: 16px; display: flex; flex-direction: column; gap: 12px\">\n          <sc-if value=\"{{dm.off}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 14px; color: #C9C9D6; line-height: 1.5\">O domínio próprio está sendo ativado no WhiteLink. Volte em breve ou fale com o suporte.</span></sc-if>\n          <sc-if value=\"{{dm.ask}}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 12px\">\n              <span style=\"font-size: 14px; color: #C9C9D6; line-height: 1.5\">Use um endereço seu, como <b>links.seusite.com.br</b>. Você precisa já ter comprado o domínio (por exemplo no registro.br).</span>\n              <input class=\"inp\" value=\"{{dm.input}}\" onInput=\"{{dm.setInput}}\" placeholder=\"links.seusite.com.br\" autocapitalize=\"none\" aria-label=\"Seu domínio\">\n              <button class=\"btn full\" onClick=\"{{dm.add}}\" disabled=\"{{dm.busy}}\">Conectar domínio</button>\n            </div>\n          </sc-if>\n          <sc-if value=\"{{dm.has}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 12px\">\n              <div style=\"display: flex; align-items: center; gap: 10px\"><b style=\"flex: 1; font-size: 16px; word-break: break-all\">{{dm.host}}</b><span class=\"chip\" style=\"{{dm.chip}}\">{{dm.st}}</span></div>\n              <sc-if value=\"{{dm.waiting}}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display: flex; flex-direction: column; gap: 10px\">\n                  <span style=\"font-size: 14px; color: #C9C9D6; line-height: 1.5\">Falta um passo: entre no site onde você comprou o domínio, abra a parte de <b>DNS</b> e crie {{dm.howMany}}:</span>\n                  <sc-for list=\"{{dm.records}}\" as=\"r\" hint-placeholder-count=\"1\">\n                    <div style=\"border-radius: 14px; background: #0E0E14; border: 1px solid #24242E; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px\">\n                      <div><span style=\"color: #9C9CAD\">Tipo:</span> <b>{{r.type}}</b></div>\n                      <div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"color: #9C9CAD\">Nome:</span> <code style=\"flex: 1; word-break: break-all\">{{r.name}}</code><button class=\"chip\" onClick=\"{{r.copyName}}\" style=\"border: none; cursor: pointer\">Copiar</button></div>\n                      <div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"color: #9C9CAD\">Valor:</span> <code style=\"flex: 1; word-break: break-all\">{{r.value}}</code><button class=\"chip\" onClick=\"{{r.copyValue}}\" style=\"border: none; cursor: pointer\">Copiar</button></div>\n                    </div>\n                  </sc-for>\n                  <span style=\"font-size: 13px; color: #9C9CAD; line-height: 1.5\">Depois de criar, pode levar de alguns minutos até algumas horas. O endereço ativa sozinho, com cadeado de segurança. No registro.br, o \"Nome\" é só a primeira parte (ex.: <b>links</b>).</span>\n                  <sc-if value=\"{{dm.error}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 13px; color: #F7DFA0\">{{dm.error}}</span></sc-if>\n                  <button class=\"btn full\" onClick=\"{{dm.check}}\" disabled=\"{{dm.busy}}\">{{dm.checkLabel}}</button>\n                </div>\n              </sc-if>\n              <sc-if value=\"{{dm.active}}\" hint-placeholder-val=\"{{ false }}\"><a class=\"btn full\" href=\"{{dm.url}}\" target=\"_blank\" rel=\"noopener\">Abrir {{dm.host}}</a></sc-if>\n              <button class=\"btn ghost full\" onClick=\"{{dm.remove}}\">Remover domínio</button>\n            </div>\n          </sc-if>\n          <sc-if value=\"{{dm.err}}\" hint-placeholder-val=\"{{ false }}\"><div role=\"alert\" style=\"padding: 10px 12px; border-radius: 12px; background: #3A1518; color: #FFB4B4; font-size: 14px\">{{dm.err}}</div></sc-if>\n        </div>\n      </div>\n      </sc-if>\n      <sc-if value=\"{{warn}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: #2B2210; color: #F7DFA0; font-size: 14px\">{{warn}}</div></sc-if>\n      <button class=\"btn full\" onClick=\"{{save}}\" style=\"margin-top: 16px\">{{saveLabel}}</button>\n    </div>\n    </sc-if>\n  </div>\n</div>\n", Component, {});
