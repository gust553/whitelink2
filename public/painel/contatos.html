<style>

}

}

<body>
<div style="position:sticky;top:0;z-index:50;background:#2B2210;border-bottom:1px solid #4A3A14;color:#F7DFA0;font:500 13px Inter,sans-serif;padding:8px 16px;text-align:center">Prévia: esta tela ainda mostra dados de exemplo. Ela será ligada à sua conta nas próximas atualizações. <a href="/painel" style="color:#D4FF3A">Voltar ao editor</a></div>
<div id="root"></div>
<script>window.DC_LINKS={"Main.dc.html":"/","Entrar.dc.html":"/entrar","Teste.dc.html":"/entrar#cadastro","Editor.dc.html":"/painel","Temas.dc.html":"/painel/em-breve?t=Temas","CriadorTema.dc.html":"/painel/em-breve?t=Criador%20de%20tema","Agenda.dc.html":"/painel/em-breve?t=Agendamentos","Stats.dc.html":"/painel/em-breve?t=Estat%C3%ADsticas","Contatos.dc.html":"/painel/contatos","Configuracoes.dc.html":"/painel/configuracoes","Indique.dc.html":"/painel/em-breve?t=Indique%20e%20ganhe","MeuPlano.dc.html":"/painel/plano","Conta.dc.html":"/painel/em-breve?t=Minha%20conta","EditarLink.dc.html":"/painel/editar-link","Pagamento.dc.html":"/pagamento","ConfirmarPagamento.dc.html":"/pagamento/confirmar","CentralAjuda.dc.html":"/ajuda","SuporteCliente.dc.html":"/ajuda","Recibo.dc.html":"/painel/recibo","Termos.dc.html":"/termos","Privacidade.dc.html":"/privacidade","Planos.dc.html":"/#precos","PaginaPublica.dc.html":"/","PaginaFechada.dc.html":"/"};</script>
<script src="/assets/dc.js"></script>
<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { plan: 1, q: '', exported: false }; }
  renderVals() {
    const s = this.state;
    const T = ['Prata', 'Ouro', 'Diamante'], C = ['#C9CDD6', '#F2C14E', '#8FE3FF'];
    const pill = (sel, col) => 'height: 36px; padding: 0 12px; border-radius: 8px; cursor: pointer; font-size: 13px; ' + (sel ? 'border: 1px solid ' + col + '; background: #22222B; color: ' + col + '; font-weight: 600' : 'border: 1px solid #2A2A34; background: transparent; color: #C9C9D6');
    const L = [
      ['[Contato 1]', '(00) 00000-0001', '—', 'Receba as novidades no WhatsApp', 'hoje 14:20'],
      ['[Contato 2]', '—', 'contato2@email.com', 'Lista VIP por e-mail', 'hoje 11:05'],
      ['[Contato 3]', '(00) 00000-0003', 'contato3@email.com', 'Receba as novidades no WhatsApp', 'ontem 21:40'],
      ['[Contato 4]', '(00) 00000-0004', '—', 'Receba as novidades no WhatsApp', 'ontem 18:12'],
      ['[Contato 5]', '—', 'contato5@email.com', 'Lista VIP por e-mail', 'há 3 dias'],
      ['[Contato 6]', '(00) 00000-0006', '—', 'Receba as novidades no WhatsApp', 'há 5 dias']
    ];
    const q = s.q.trim().toLowerCase();
    const rows = L.filter((r) => !q || r.join(' ').toLowerCase().indexOf(q) >= 0).map((r) => ({ n: r[0], w: r[1], e: r[2], src: r[3], when: r[4], act: r[1] !== '—' ? 'Chamar no WhatsApp' : 'Mandar e-mail', href: r[1] !== '—' ? 'https://wa.me/55' + r[1].replace(/\D/g, '') : 'mailto:' + r[2] }));
    return {
      asPlan: T.map((n, i) => ({ name: n, sel: s.plan === i, style: pill(s.plan === i, C[i]), pick: () => this.setState({ plan: i, exported: false }) })),
      isPrata: s.plan === 0, notPrata: s.plan > 0,
      canExport: s.plan === 2, cantExport: s.plan === 1,
      exportLabel: s.exported ? 'Planilha baixada ✓' : 'Exportar planilha (.csv)',
      doExport: () => this.setState({ exported: true }),
      total: String(L.length), wpp: String(L.filter((r) => r[1] !== '—').length), mail: String(L.filter((r) => r[2] !== '—').length),
      q: s.q, setQ: (e) => this.setState({ q: e.target.value }),
      rows: rows, empty: rows.length === 0
    };
  }
}

DC.mount(document.getElementById('root'), "\n<div style=\"min-height: 1000px; background: #0B0B10; color: #F3F3F7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column\">\n  <header style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid #22222B; background: #0E0E14\">\n    <span style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em\">WhiteLink</span>\n    <nav aria-label=\"Seções\" style=\"display: flex; gap: 4px; flex-wrap: wrap\">\n      <a href=\"Editor.dc.html\" style=\"padding: 10px 14px; border-radius: 10px; color: #A7A7B8; font-size: 14px\">Editor</a>\n      <a href=\"Temas.dc.html\" style=\"padding: 10px 14px; border-radius: 10px; color: #A7A7B8; font-size: 14px\">Temas</a>\n      <a href=\"Agenda.dc.html\" style=\"padding: 10px 14px; border-radius: 10px; color: #A7A7B8; font-size: 14px\">Agendamentos</a>\n      <a href=\"Stats.dc.html\" style=\"padding: 10px 14px; border-radius: 10px; color: #A7A7B8; font-size: 14px\">Estatísticas</a>\n      <a href=\"#\" aria-current=\"page\" style=\"padding: 10px 14px; border-radius: 10px; background: #1A1A22; color: #F3F3F7; font-size: 14px; font-weight: 500\">Contatos</a>\n      <a href=\"Configuracoes.dc.html\" style=\"padding: 10px 14px; border-radius: 10px; color: #A7A7B8; font-size: 14px\">Configurações</a>\n      <a href=\"Indique.dc.html\" style=\"padding: 10px 14px; border-radius: 10px; color: #A7A7B8; font-size: 14px\">Indique e ganhe</a>\n      <a href=\"MeuPlano.dc.html\" style=\"padding: 10px 14px; border-radius: 10px; color: #A7A7B8; font-size: 14px\">Meu plano</a>\n      <a href=\"Conta.dc.html\" style=\"padding: 10px 14px; border-radius: 10px; color: #A7A7B8; font-size: 14px\">Minha conta</a>\n    </nav>\n    <div style=\"flex: 1\"></div>\n    <a href=\"SuporteCliente.dc.html\" style=\"height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #33333E; color: #F3F3F7; font-size: 14px; display: flex; align-items: center\">Suporte</a>\n  </header>\n\n  <div style=\"max-width: 1240px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 28px 24px 56px; display: flex; flex-direction: column; gap: 20px\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px\">\n      <div style=\"display: flex; flex-direction: column; gap: 4px\">\n        <h1 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700\">Contatos captados</h1>\n        <span style=\"font-size: 13px; color: #A7A7B8\">Quem deixou WhatsApp ou e-mail no bloco de captura da sua página · pessoas de exemplo</span>\n      </div>\n      <div role=\"group\" aria-label=\"Ver como cliente do plano\" style=\"display: flex; gap: 6px; align-items: center\">\n        <span style=\"font-size: 12px; color: #A7A7B8\">Ver como:</span>\n        <sc-for list=\"{{asPlan}}\" as=\"p\" hint-placeholder-count=\"3\">\n          <button onClick=\"{{p.pick}}\" aria-pressed=\"{{p.sel}}\" style=\"{{p.style}}\">{{p.name}}</button>\n        </sc-for>\n      </div>\n    </div>\n\n    <sc-if value=\"{{isPrata}}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding: 32px; border-radius: 20px; background: #14141B; border: 1px dashed #F2C14E; display: flex; flex-direction: column; gap: 12px; align-items: flex-start\">\n        <h2 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700\">Capte contatos com o plano Ouro</h2>\n        <p style=\"margin: 0; font-size: 15px; color: #C9C9D6; line-height: 1.55; max-width: 620px\">O bloco \"Captura de contato\" pede o WhatsApp ou o e-mail de quem visita sua página. Os contatos aparecem aqui para você chamar depois.</p>\n        <a href=\"MeuPlano.dc.html\" style=\"height: 48px; padding: 0 20px; border-radius: 12px; background: #F2C14E; color: #0E0E14; font-weight: 600; font-size: 15px; display: flex; align-items: center; text-decoration: none\">Subir para o Ouro</a>\n      </div>\n    </sc-if>\n\n    <sc-if value=\"{{notPrata}}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 16px\">\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px\">\n          <div style=\"padding: 18px; border-radius: 16px; background: #14141B; border: 1px solid #22222B; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 13px; color: #A7A7B8\">Total de contatos</span><span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700\">{{total}}</span></div>\n          <div style=\"padding: 18px; border-radius: 16px; background: #14141B; border: 1px solid #22222B; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 13px; color: #A7A7B8\">Com WhatsApp</span><span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700\">{{wpp}}</span></div>\n          <div style=\"padding: 18px; border-radius: 16px; background: #14141B; border: 1px solid #22222B; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 13px; color: #A7A7B8\">Com e-mail</span><span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700\">{{mail}}</span></div>\n        </div>\n\n        <section aria-label=\"Lista de contatos\" style=\"padding: 20px; border-radius: 16px; background: #14141B; border: 1px solid #22222B; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n            <label style=\"flex: 1 1 260px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #C9C9D6\">Buscar\n              <input class=\"ct-in\" value=\"{{q}}\" onInput=\"{{setQ}}\" placeholder=\"nome, WhatsApp ou e-mail\" style=\"flex: 1; min-width: 0\">\n            </label>\n            <sc-if value=\"{{canExport}}\" hint-placeholder-val=\"{{ false }}\">\n              <button onClick=\"{{doExport}}\" style=\"height: 44px; padding: 0 16px; border-radius: 12px; border: none; background: #8FE3FF; color: #06222B; font-weight: 600; font-size: 14px; cursor: pointer\">{{exportLabel}}</button>\n            </sc-if>\n            <sc-if value=\"{{cantExport}}\" hint-placeholder-val=\"{{ true }}\">\n              <a href=\"MeuPlano.dc.html\" style=\"height: 44px; padding: 0 16px; border-radius: 12px; border: 1px dashed #8FE3FF; color: #8FE3FF; font-size: 14px; display: flex; align-items: center; text-decoration: none\">Exportar planilha · Diamante</a>\n            </sc-if>\n          </div>\n          <div style=\"overflow-x: auto\">\n            <table style=\"width: 100%; min-width: 720px; border-collapse: collapse; font-size: 14px\">\n              <thead>\n                <tr style=\"text-align: left; color: #A7A7B8; font-size: 12px; text-transform: uppercase; letter-spacing: .05em\">\n                  <th style=\"padding: 10px 8px; font-weight: 600\">Nome</th>\n                  <th style=\"padding: 10px 8px; font-weight: 600\">WhatsApp</th>\n                  <th style=\"padding: 10px 8px; font-weight: 600\">E-mail</th>\n                  <th style=\"padding: 10px 8px; font-weight: 600\">Veio de</th>\n                  <th style=\"padding: 10px 8px; font-weight: 600\">Quando</th>\n                  <th style=\"padding: 10px 8px; font-weight: 600\"><span style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Ações</span></th>\n                </tr>\n              </thead>\n              <tbody>\n                <sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"6\">\n                  <tr style=\"border-top: 1px solid #22222B\">\n                    <td style=\"padding: 12px 8px; font-weight: 500\">{{r.n}}</td>\n                    <td style=\"padding: 12px 8px; color: #C9C9D6\">{{r.w}}</td>\n                    <td style=\"padding: 12px 8px; color: #C9C9D6\">{{r.e}}</td>\n                    <td style=\"padding: 12px 8px; color: #C9C9D6\">{{r.src}}</td>\n                    <td style=\"padding: 12px 8px; color: #C9C9D6\">{{r.when}}</td>\n                    <td style=\"padding: 12px 8px; text-align: right\"><a href=\"{{r.href}}\" target=\"_blank\" rel=\"noopener\" style=\"height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #33333E; color: #F3F3F7; font-size: 13px; display: inline-flex; align-items: center; text-decoration: none; white-space: nowrap\">{{r.act}}</a></td>\n                  </tr>\n                </sc-for>\n              </tbody>\n            </table>\n          </div>\n          <sc-if value=\"{{empty}}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size: 14px; color: #A7A7B8; padding: 6px\">Nenhum contato com essa busca.</span>\n          </sc-if>\n        </section>\n        <span style=\"font-size: 12px; color: #A7A7B8; line-height: 1.5\">O bloco de captura mostra ao visitante um aviso de que ele aceita receber suas mensagens, como pede a LGPD. Quem pedir para sair é removido da lista.</span>\n      </div>\n    </sc-if>\n  </div>\n</div>\n", Component, {});
(async()=>{const d=await DC.api('me');if(d.status===401)location.href='/entrar';})();
</script>
</body>
</html>
