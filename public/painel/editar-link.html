<style>
body{margin:0;background:#0B0B10}
a{color:#D4FF3A}a:hover{color:#E6FF8A}
button,input{font-family:Inter,system-ui,sans-serif}
.el-in{height:48px;box-sizing:border-box;border-radius:12px;border:1px solid #33333E;background:#0E0E14;color:#F3F3F7;padding:0 14px;font-size:15px;width:100%}
.el-in:focus{outline:2px solid #D4FF3A;outline-offset:1px}
.el-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.el-up{height:44px;padding:0 14px;border-radius:10px;border:1px dashed #44444F;color:#F3F3F7;font-size:13px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
@keyframes elPulse{0%{box-shadow:0 0 0 0 rgba(212,255,58,.55)}70%{box-shadow:0 0 0 12px rgba(212,255,58,0)}100%{box-shadow:0 0 0 0 rgba(212,255,58,0)}}
@keyframes elShake{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-2deg)}92%{transform:rotate(2deg)}95%{transform:rotate(-1deg)}}
@keyframes elGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
.el-pulse{animation:elPulse 1.8s ease-out infinite}
.el-shake{animation:elShake 2.4s ease-in-out infinite}
.el-glow{animation:elGlow 1.6s ease-in-out infinite}

<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { plan: 2, title: '[Seu link principal]', icon: 1, thumb: '', kind: 0, cover: '', effect: 1, saved: false }; }
  file(e, key) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try { const o = { saved: false }; o[key] = URL.createObjectURL(f); this.setState(o); } catch (x) {}
  }
  renderVals() {
    const s = this.state;
    const T = ['Prata', 'Ouro', 'Diamante'], C = ['#C9CDD6', '#F2C14E', '#8FE3FF'];
    const pill = (sel, col) => 'height: 36px; padding: 0 12px; border-radius: 8px; cursor: pointer; font-size: 13px; ' + (sel ? 'border: 1px solid ' + col + '; background: #22222B; color: ' + col + '; font-weight: 600' : 'border: 1px solid #2A2A34; background: transparent; color: #C9C9D6');
    const opt = (sel, locked) => 'height: 44px; padding: 0 14px; border-radius: 10px; font-size: 13px; ' + (locked ? 'border: 1px solid #22222B; background: transparent; color: #6F6F80; cursor: not-allowed' : (sel ? 'border: 1px solid #D4FF3A; background: #22222B; color: #F3F3F7; font-weight: 600; cursor: pointer' : 'border: 1px solid #2A2A34; background: transparent; color: #C9C9D6; cursor: pointer'));
    const I = [
      ['Nenhum', ''],
      ['Loja', 'M6 6h15l-2 9H8L6 3H3M9 20h.01M18 20h.01'],
      ['Vídeo', 'M3 6h13v12H3zM16 10l5-3v10l-5-3'],
      ['WhatsApp', 'M4 20l1.3-3.9A8 8 0 1 1 8 18.8z'],
      ['Presente', 'M4 11h16v9H4zM3 7h18v4H3zM12 7v13M12 7c-2-4-6-3-5 0M12 7c2-4 6-3 5 0'],
      ['Calendário', 'M4 6h16v14H4zM4 10h16M9 3v4M15 3v4']
    ];
    const E = [['Sem efeito', ''], ['Pulsar', 'el-pulse'], ['Tremer', 'el-shake'], ['Brilhar', 'el-glow']];
    const ouro = s.plan >= 1, dia = s.plan === 2;
    const kind = dia ? s.kind : 0;
    const effect = ouro ? s.effect : 0;
    const icon = ouro ? s.icon : 0;
    return {
      asPlan: T.map((n, i) => ({ name: n, sel: s.plan === i, style: pill(s.plan === i, C[i]), pick: () => this.setState({ plan: i }) })),
      ouroUp: ouro, isPrata: !ouro,
      title: s.title, setTitle: (e) => this.setState({ title: e.target.value, saved: false }),
      icons: I.map((x, i) => ({ name: x[0], d: x[1] || 'M6 12h12', sel: s.icon === i, pick: () => this.setState({ icon: i, saved: false }),
        style: 'width: 48px; height: 48px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #F3F3F7; background: #0E0E14; border: ' + (s.icon === i ? '2px solid #D4FF3A' : '1px solid #2A2A34') })),
      onThumb: (e) => this.file(e, 'thumb'),
      thumbLabel: s.thumb ? 'Trocar fotinha ✓' : 'Ou envie uma fotinha (miniatura)',
      hasThumb: ouro && !!s.thumb, showIcon: ouro && !s.thumb && icon > 0, thumb: s.thumb, iconD: I[icon][1] || 'M6 12h12',
      kinds: ['Botão de texto', 'Botão com imagem grande'].map((n, i) => ({ name: n, sel: kind === i, locked: i === 1 && !dia, style: opt(kind === i, i === 1 && !dia), pick: () => { if (i === 0 || dia) this.setState({ kind: i, saved: false }); } })),
      isText: kind === 0, isImage: kind === 1,
      onCover: (e) => this.file(e, 'cover'),
      coverLabel: s.cover ? 'Trocar imagem ✓' : 'Enviar imagem do botão',
      hasCover: !!s.cover, noCover: !s.cover, cover: s.cover,
      effects: E.map((x, i) => ({ name: x[0], sel: effect === i, locked: i > 0 && !ouro, style: opt(effect === i, i > 0 && !ouro), pick: () => { if (i === 0 || ouro) this.setState({ effect: i, saved: false }); } })),
      fx: E[effect][1],
      saveLabel: s.saved ? 'Salvo ✓' : 'Salvar link',
      save: () => this.setState({ saved: true })
    };
  }
}

DC.mount(document.getElementById('root'), "\n<div style=\"min-height: 1100px; background: #0B0B10; color: #F3F3F7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column\">\n  <div class=\"appbar\"><a class=\"icon-btn\" href=\"/painel/mais\" aria-label=\"Voltar\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M15 5l-7 7 7 7\"/></svg></a><h1>Editar link</h1></div>\n\n  <div style=\"max-width: 1240px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 24px; display: flex; flex-wrap: wrap; gap: 24px\">\n    <div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n      <h1 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700\">Editar link</h1>\n\n      <section aria-label=\"Texto e destino\" style=\"padding: 20px; border-radius: 18px; background: #14141B; border: 1px solid #22222B; display: flex; flex-direction: column; gap: 12px\">\n        <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #C9C9D6\">Texto do botão\n          <input class=\"el-in\" value=\"{{title}}\" onInput=\"{{setTitle}}\">\n        </label>\n        <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #C9C9D6\">Para onde o link leva\n          <input class=\"el-in\" type=\"url\" placeholder=\"https://...\" value=\"[endereço do link]\">\n        </label>\n      </section>\n\n      <section aria-label=\"Ícone e miniatura\" style=\"padding: 20px; border-radius: 18px; background: #14141B; border: 1px solid #22222B; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px\">\n          <h2 style=\"margin: 0; font-size: 16px; font-weight: 600\">Ícone ou miniatura</h2>\n          <span style=\"font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid #F2C14E; color: #F2C14E\">Ouro e Diamante</span>\n        </div>\n        <sc-if value=\"{{ouroUp}}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 12px\">\n            <div role=\"radiogroup\" aria-label=\"Ícone\" style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n              <sc-for list=\"{{icons}}\" as=\"i\" hint-placeholder-count=\"6\">\n                <button role=\"radio\" aria-checked=\"{{i.sel}}\" aria-label=\"{{i.name}}\" onClick=\"{{i.pick}}\" style=\"{{i.style}}\">\n                  <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{i.d}}\"></path></svg>\n                </button>\n              </sc-for>\n            </div>\n            <label class=\"el-up\"><input class=\"el-file\" type=\"file\" accept=\"image/*\" onChange=\"{{onThumb}}\">{{thumbLabel}}</label>\n          </div>\n        </sc-if>\n        <sc-if value=\"{{isPrata}}\" hint-placeholder-val=\"{{ false }}\">\n          <a href=\"MeuPlano.dc.html\" style=\"font-size: 14px\">Coloque ícones e fotinhas nos links a partir do Ouro</a>\n        </sc-if>\n      </section>\n\n      <section aria-label=\"Formato do botão\" style=\"padding: 20px; border-radius: 18px; background: #14141B; border: 1px solid #22222B; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px\">\n          <h2 style=\"margin: 0; font-size: 16px; font-weight: 600\">Botão com imagem</h2>\n          <span style=\"font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid #8FE3FF; color: #8FE3FF\">Diamante</span>\n        </div>\n        <div role=\"group\" aria-label=\"Formato\" style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n          <sc-for list=\"{{kinds}}\" as=\"k\" hint-placeholder-count=\"2\">\n            <button onClick=\"{{k.pick}}\" aria-pressed=\"{{k.sel}}\" disabled=\"{{k.locked}}\" style=\"{{k.style}}\">{{k.name}}</button>\n          </sc-for>\n        </div>\n        <sc-if value=\"{{isImage}}\" hint-placeholder-val=\"{{ false }}\">\n          <label class=\"el-up\"><input class=\"el-file\" type=\"file\" accept=\"image/*\" onChange=\"{{onCover}}\">{{coverLabel}}</label>\n        </sc-if>\n      </section>\n\n      <section aria-label=\"Destaque\" style=\"padding: 20px; border-radius: 18px; background: #14141B; border: 1px solid #22222B; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px\">\n          <h2 style=\"margin: 0; font-size: 16px; font-weight: 600\">Efeito de destaque</h2>\n          <span style=\"font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid #F2C14E; color: #F2C14E\">Ouro e Diamante</span>\n        </div>\n        <div role=\"group\" aria-label=\"Efeito\" style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n          <sc-for list=\"{{effects}}\" as=\"e\" hint-placeholder-count=\"4\">\n            <button onClick=\"{{e.pick}}\" aria-pressed=\"{{e.sel}}\" disabled=\"{{e.locked}}\" style=\"{{e.style}}\">{{e.name}}</button>\n          </sc-for>\n        </div>\n        <div style=\"display: flex; gap: 12px; flex-wrap: wrap; font-size: 14px\">\n          <a href=\"Agenda.dc.html\">Agendar quando o link aparece</a>\n          <a href=\"Agenda.dc.html\">Teste A/B do título (Diamante)</a>\n        </div>\n      </section>\n\n      <div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n        <button onClick=\"{{save}}\" style=\"height: 48px; padding: 0 20px; border-radius: 12px; border: none; background: #D4FF3A; color: #0E0E14; font-weight: 600; font-size: 15px; cursor: pointer\">{{saveLabel}}</button>\n        <a href=\"Editor.dc.html\" style=\"height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid #33333E; color: #F3F3F7; font-size: 15px; display: flex; align-items: center; text-decoration: none\">Cancelar</a>\n      </div>\n    </div>\n\n    <aside aria-label=\"Pré-visualização\" style=\"flex: 1 1 340px; display: flex; flex-direction: column; align-items: center; gap: 10px\">\n      <span style=\"font-size: 13px; color: #A7A7B8\">Como fica na página</span>\n      <div style=\"width: 320px; min-height: 420px; box-sizing: border-box; border-radius: 36px; border: 8px solid #22222B; background: #0E0E14; padding: 32px 16px; display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"height: 46px; border-radius: 14px; background: #1A1A22; border: 1px solid #2A2A34; font-size: 13px; display: flex; align-items: center; justify-content: center; color: #A7A7B8\">[Outro link]</div>\n        <sc-if value=\"{{isText}}\" hint-placeholder-val=\"{{ true }}\">\n          <div class=\"{{fx}}\" style=\"min-height: 52px; border-radius: 14px; background: #D4FF3A; color: #0E0E14; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; box-sizing: border-box\">\n            <sc-if value=\"{{hasThumb}}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{thumb}}\" alt=\"\" style=\"width: 36px; height: 36px; border-radius: 8px; object-fit: cover\"></sc-if>\n            <sc-if value=\"{{showIcon}}\" hint-placeholder-val=\"{{ true }}\">\n              <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0E0E14\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{iconD}}\"></path></svg>\n            </sc-if>\n            <span style=\"flex: 1; text-align: center\">{{title}}</span>\n          </div>\n        </sc-if>\n        <sc-if value=\"{{isImage}}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"{{fx}}\" style=\"border-radius: 16px; overflow: hidden; background: #1A1A22; border: 2px solid #D4FF3A\">\n            <sc-if value=\"{{hasCover}}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{cover}}\" alt=\"\" style=\"width: 100%; height: 140px; object-fit: cover; display: block\"></sc-if>\n            <sc-if value=\"{{noCover}}\" hint-placeholder-val=\"{{ true }}\"><div style=\"height: 140px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #A7A7B8\">[sua imagem]</div></sc-if>\n            <div style=\"padding: 12px; font-weight: 600; font-size: 14px; text-align: center\">{{title}}</div>\n          </div>\n        </sc-if>\n        <div style=\"height: 46px; border-radius: 14px; background: #1A1A22; border: 1px solid #2A2A34; font-size: 13px; display: flex; align-items: center; justify-content: center; color: #A7A7B8\">[Outro link]</div>\n      </div>\n    </aside>\n  </div>\n</div>\n", Component, {});
(async()=>{const d=await DC.api('me');if(d.status===401)location.href='/entrar';})();
</script>
