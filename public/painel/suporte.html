<style>
.chat{display:flex;flex-direction:column;gap:8px;padding-bottom:150px}
.msg{max-width:82%;padding:10px 14px;border-radius:20px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.msg small{display:block;font-size:11px;opacity:.6;margin-top:4px;text-align:right}
.me{align-self:flex-end;background:#D4FF3A;color:#0E0E14;border-bottom-right-radius:6px}
.them{align-self:flex-start;background:#1B1B24;color:#F3F3F7;border-bottom-left-radius:6px}
.compose{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));padding:10px 12px;background:#0B0B10;border-top:1px solid #1C1C24;display:flex;flex-direction:column;gap:8px;z-index:20}
@media (min-width:900px){.compose{left:96px;bottom:0}}
.compose .bar{display:flex;gap:8px;align-items:flex-end;max-width:720px;width:100%;margin:0 auto}
.compose textarea{flex:1;min-height:48px;max-height:130px;resize:none;border-radius:24px;border:1px solid #24242E;background:#14141B;color:#F3F3F7;padding:13px 16px;font:15px Inter,sans-serif}
.send{width:48px;height:48px;border-radius:50%;border:none;background:#D4FF3A;color:#0E0E14;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.send[disabled]{background:#26262F;color:#6F6F80}
.topics{display:flex;gap:6px;overflow-x:auto;max-width:720px;width:100%;margin:0 auto;scrollbar-width:none}
.topics button{flex:none;height:34px;padding:0 13px;border-radius:999px;border:1px solid #2A2A34;background:#14141B;color:#C9C9D6;font-size:13px;cursor:pointer;font-family:inherit}
.topics button[aria-pressed="true"]{background:#F3F3F7;color:#0E0E14;border-color:#F3F3F7;font-weight:600}
</style>

<script>window.DC_LINKS={"Main.dc.html":"/","Entrar.dc.html":"/entrar","Teste.dc.html":"/entrar#cadastro","Editor.dc.html":"/painel","Aparencia.dc.html":"/painel/aparencia","Temas.dc.html":"/painel/temas","CriadorTema.dc.html":"/painel/criador-tema","Agenda.dc.html":"/painel/agendamentos","Stats.dc.html":"/painel/estatisticas","Contatos.dc.html":"/painel/clientes","Configuracoes.dc.html":"/painel/configuracoes","Indique.dc.html":"/painel/indique","MeuPlano.dc.html":"/painel/plano","Conta.dc.html":"/painel/conta","EditarLink.dc.html":"/painel","Pagamento.dc.html":"/pagamento","ConfirmarPagamento.dc.html":"/pagamento/confirmar","CentralAjuda.dc.html":"/ajuda","SuporteCliente.dc.html":"/painel/suporte","Recibo.dc.html":"/painel/recibo","Termos.dc.html":"/termos","Privacidade.dc.html":"/privacidade","Planos.dc.html":"/#precos","PaginaPublica.dc.html":"/","PaginaFechada.dc.html":"/"};</script>

<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { d: null, text: '', topic: '', err: '', busy: false }; }
  componentDidMount() { this.load(true); this.t = setInterval(() => { if (!document.hidden) this.load(false); }, 15000); }
  componentWillUnmount() { clearInterval(this.t); }
  async load(scroll) {
    const d = await DC.api('support');
    if (d.status === 401) { location.href = '/entrar'; return; }
    const grew = !this.state.d || (d.msgs || []).length !== this.state.d.msgs.length;
    this.setState({ d: d.ok ? d : null });
    if (scroll || grew) setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 30);
  }
  async send() {
    const s = this.state;
    if (!s.text.trim() || s.busy) return;
    this.setState({ busy: true, err: '' });
    const r = await DC.api('support', 'POST', { text: s.text, topic: s.topic || undefined });
    if (!r.ok) { this.setState({ busy: false, err: r.error }); return; }
    this.setState({ busy: false, text: '', topic: '' });
    this.load(true);
  }
  renderVals() {
    const d = this.state.d;
    if (!d) return { loading: true };
    const T = d.level === 0 ? [['pagamento', 'Pagamento'], ['teste', 'Teste grátis']] : [['pagamento', 'Pagamento'], ['pagina', 'Minha página'], ['temas', 'Temas'], ['outro', 'Outro']];
    const first = d.msgs.length === 0;
    return {
      loading: false, ready: true, name: d.name, prata: d.level === 0,
      msgs: d.msgs.map((m) => ({ cls: m.from_admin ? 'them' : 'me', text: m.text, at: new Date(m.created_at).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) })),
      showTopics: first,
      topics: T.map((t) => ({ name: t[1], sel: this.state.topic === t[0], pick: () => this.setState({ topic: t[0], err: '' }) })),
      text: this.state.text, setText: (e) => { this.setState({ text: e.target.value }); e.target.style.height = 'auto'; e.target.style.height = Math.min(130, e.target.scrollHeight) + 'px'; },
      cantSend: this.state.busy || !this.state.text.trim() || (first && !this.state.topic),
      send: () => this.send(), err: this.state.err
    };
  }
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
DC.mount(document.getElementById('root'), "\n<div>\n  <div class=\"appbar\"><a class=\"icon-btn\" href=\"/painel/mais\" aria-label=\"Voltar\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M15 5l-7 7 7 7\"/></svg></a><h1>Suporte</h1><a class=\"icon-btn\" href=\"/ajuda\" aria-label=\"Central de ajuda\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17.2v.1\"/></svg></a></div>\n  <div class=\"app-main\">\n    <sc-if value=\"{{loading}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color: #9C9CAD; padding-top: 30px\">Carregando…</div></sc-if>\n    <sc-if value=\"{{ready}}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"chat\" aria-live=\"polite\">\n        <div class=\"msg them\">Oi, {{name}}! Escreva sua dúvida que a equipe WhiteLink responde por aqui, em horário comercial.<sc-if value=\"{{prata}}\" hint-placeholder-val=\"{{ false }}\"> No Prata, o chat é para pagamento e teste grátis.</sc-if></div>\n        <sc-for list=\"{{msgs}}\" as=\"m\" hint-placeholder-count=\"3\"><div class=\"msg {{m.cls}}\">{{m.text}}<small>{{m.at}}</small></div></sc-for>\n      </div>\n    </sc-if>\n  </div>\n  <sc-if value=\"{{ready}}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"compose\">\n      <sc-if value=\"{{showTopics}}\" hint-placeholder-val=\"{{ true }}\"><div class=\"topics\" role=\"group\" aria-label=\"Assunto\"><sc-for list=\"{{topics}}\" as=\"t\" hint-placeholder-count=\"4\"><button onClick=\"{{t.pick}}\" aria-pressed=\"{{t.sel}}\">{{t.name}}</button></sc-for></div></sc-if>\n      <sc-if value=\"{{err}}\" hint-placeholder-val=\"{{ false }}\"><div role=\"alert\" style=\"max-width: 720px; margin: 0 auto; width: 100%; font-size: 13.5px; color: #FFB4B4\">{{err}} <a href=\"https://wa.me/5511993931841\" target=\"_blank\" rel=\"noopener\">WhatsApp</a></div></sc-if>\n      <div class=\"bar\"><textarea rows=\"1\" placeholder=\"Escreva aqui…\" aria-label=\"Mensagem\" value=\"{{text}}\" onInput=\"{{setText}}\" maxlength=\"1500\"></textarea><button class=\"send\" onClick=\"{{send}}\" disabled=\"{{cantSend}}\" aria-label=\"Enviar\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h13M13 6l6 6-6 6\"/></svg></button></div>\n    </div>\n  </sc-if>\n</div>\n", Component, {});
(async()=>{const d=await DC.api('me');if(d.status===401)location.href='/entrar?next='+encodeURIComponent(location.pathname+location.search);})();
</script>
