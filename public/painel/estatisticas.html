<style>
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kp .card{padding:14px;display:flex;flex-direction:column;gap:4px}
.kp b{font:700 26px 'Space Grotesk',sans-serif}
.kp span{font-size:12.5px;color:#9C9CAD}
.chart{display:flex;align-items:flex-end;gap:3px;height:150px;padding:14px 14px 0}
.chart div{flex:1;min-width:2px;border-radius:5px 5px 0 0;background:#D4FF3A}
.bar{height:8px;border-radius:999px;background:#26262F;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:999px}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chips button{height:38px;padding:0 16px;border-radius:999px;border:1px solid #2A2A34;background:#14141B;color:#C9C9D6;font-size:14px;cursor:pointer;font-family:inherit}
.chips button[aria-pressed="true"]{background:#F3F3F7;color:#0E0E14;border-color:#F3F3F7;font-weight:600}
.chips button[disabled]{opacity:.45}
</style>

<script>window.DC_LINKS={"Main.dc.html":"/","Entrar.dc.html":"/entrar","Teste.dc.html":"/entrar#cadastro","Editor.dc.html":"/painel","Aparencia.dc.html":"/painel/aparencia","Temas.dc.html":"/painel/temas","CriadorTema.dc.html":"/painel/criador-tema","Computador.dc.html":"/painel/computador","Agenda.dc.html":"/painel/agendamentos","Stats.dc.html":"/painel/estatisticas","Contatos.dc.html":"/painel/clientes","Configuracoes.dc.html":"/painel/configuracoes","Indique.dc.html":"/painel/indique","MeuPlano.dc.html":"/painel/plano","Conta.dc.html":"/painel/conta","EditarLink.dc.html":"/painel","Pagamento.dc.html":"/pagamento","ConfirmarPagamento.dc.html":"/pagamento/confirmar","CentralAjuda.dc.html":"/ajuda","SuporteCliente.dc.html":"/painel/suporte","Recibo.dc.html":"/painel/recibo","Termos.dc.html":"/termos","Privacidade.dc.html":"/privacidade","Planos.dc.html":"/#precos","PaginaPublica.dc.html":"/","PaginaFechada.dc.html":"/"};</script>

<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { d: null, days: 7 }; }
  componentDidMount() { this.load(7); }
  async load(days) {
    const d = await DC.api('stats?d=' + days);
    if (d.status === 401) { location.href = '/entrar'; return; }
    this.setState({ d: d.ok ? d : null, days: days });
  }
  renderVals() {
    const d = this.state.d;
    if (!d) return { loading: true, ready: false };
    const fmt = (n) => Number(n || 0).toLocaleString('pt-BR');
    const max = Math.max(1, ...d.series.map((x) => x.views));
    const pct = (rows) => { const t = rows.reduce((a, r) => a + r.n, 0) || 1; return rows.map((r) => ({ k: r.k, pct: Math.round(r.n / t * 100) + '%', st: 'width: ' + Math.round(r.n / t * 100) + '%; background: ' + r.c })); };
    const full = d.level >= 1;
    const b = d.breakdown || { src: [], dev: [], city: [] };
    return {
      loading: false, ready: true, canExport: d.level === 2,
      periods: [7, 30, 90].map((n, i) => ({ name: n + ' dias', sel: d.days === n, locked: i > d.level, pick: () => this.load(n) })),
      kpis: full ? [{ v: fmt(d.visits), l: d.visits === 1 ? 'visita' : 'visitas' }, { v: fmt(d.clicks), l: d.clicks === 1 ? 'clique' : 'cliques' }, { v: fmt(d.contacts), l: d.contacts === 1 ? 'contato' : 'contatos' }] : [{ v: fmt(d.visits), l: (d.visits === 1 ? 'visita' : 'visitas') + ' em 7 dias' }],
      bars: d.series.map((x) => 'height: ' + Math.max(3, x.views / max * 100) + '%' + (x.views ? '' : '; background: #26262F')),
      firstDay: new Date(d.series[0].day + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }),
      locked: !full, full: full,
      links: (d.links || []).filter((l) => l.clicks || l.clicksB).slice(0, 10).map((l) => ({ title: l.title, clicks: fmt(l.clicks + l.clicksB), ab: l.titleB ? 'Teste A/B · A: ' + fmt(l.clicks) + ' · B: ' + fmt(l.clicksB) : '' })),
      noLinks: !(d.links || []).some((l) => l.clicks || l.clicksB),
      dia: d.level === 2, ouroOnly: d.level === 1,
      hours: (d.hours || []).map((n, i, a) => ({ st: 'height: ' + Math.max(4, n / Math.max(1, ...a) * 100) + '%' + (n === Math.max(...a) && n ? '; background: #7CF5D0' : n ? '' : '; background: #26262F'), t: i + 'h: ' + n })),
      peakText: (() => { const h = d.hours || []; const mx = Math.max(0, ...h); if (!mx) return 'Ainda sem visitas suficientes.'; const i = h.indexOf(mx); const D = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado']; const w = d.dows || []; const wi = w.indexOf(Math.max(...w)); return 'Seu público mais entra às ' + i + 'h' + (wi >= 0 ? ', e o melhor dia é ' + D[wi] : '') + '. Poste um pouco antes.'; })(),
      hasCamps: (d.campaigns || []).length > 0, camps: (d.campaigns || []).map((c) => ({ name: c.name, slug: c.slug, n: c.n })),
      tips: this.state.tips || [], tipErr: this.state.tipErr || '',
      analyzeLabel: this.state.tipBusy ? 'Analisando…' : (this.state.tips ? '✨ Analisar de novo' : '✨ Pedir análise da IA'),
      analyze: async () => { this.setState({ tipBusy: true, tipErr: '' }); const r = await DC.ai('analyze'); this.setState({ tipBusy: false, tips: r.ok ? r.items : this.state.tips, tipErr: r.ok ? '' : r.error }); },
      groups: [['De onde vieram', b.src, '#D4FF3A'], ['Aparelho', b.dev, '#7CF5D0'], ['Cidade', b.city, '#B9A6FF']].map((g) => ({ h: 'origem', title: g[0], rows: pct(g[1].map((r) => ({ k: r.k, n: r.n, c: g[2] }))), empty: !g[1].length }))
    };
  }
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
DC.mount(document.getElementById('root'), "\n<div>\n  <div class=\"appbar\"><h1>Números</h1><button class=\"hq\" data-help=\"visitas\" aria-label=\"Ajuda\">?</button><sc-if value=\"{{canExport}}\" hint-placeholder-val=\"{{ false }}\"><a class=\"icon-btn\" href=\"/api/stats/csv\" aria-label=\"Baixar planilha\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\"><path d=\"M12 4v11M7 10l5 5 5-5M5 20h14\"/></svg></a></sc-if></div>\n  <div class=\"app-main\">\n    <sc-if value=\"{{loading}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color: #9C9CAD; padding-top: 30px\">Carregando…</div></sc-if>\n    <sc-if value=\"{{ready}}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <div class=\"chips\" role=\"group\" aria-label=\"Período\">\n        <sc-for list=\"{{periods}}\" as=\"p\" hint-placeholder-count=\"3\"><button onClick=\"{{p.pick}}\" aria-pressed=\"{{p.sel}}\" disabled=\"{{p.locked}}\">{{p.name}}</button></sc-for>\n      </div>\n      <div class=\"kp\">\n        <sc-for list=\"{{kpis}}\" as=\"k\" hint-placeholder-count=\"3\"><div class=\"card\"><b>{{k.v}}</b><span>{{k.l}}</span></div></sc-for>\n      </div>\n      <div class=\"card\" style=\"margin-top: 12px\">\n        <div class=\"chart\" aria-label=\"Visitas por dia\"><sc-for list=\"{{bars}}\" as=\"b\" hint-placeholder-count=\"7\"><div style=\"{{b}}\"></div></sc-for></div>\n        <div style=\"display: flex; justify-content: space-between; padding: 8px 14px 12px; font-size: 12px; color: #9C9CAD\"><span>{{firstDay}}</span><span>hoje</span></div>\n      </div>\n\n      <sc-if value=\"{{locked}}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"card\" style=\"margin-top: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; border-color: #4A3A14\">\n          <b style=\"font-size: 16px\">Veja de onde vêm suas visitas</b>\n          <span style=\"font-size: 14px; color: #C9C9D6; line-height: 1.5\">No Ouro você vê os cliques de cada link, de onde veio cada visita, o aparelho e a cidade.</span>\n          <a class=\"btn\" href=\"/painel/plano\" style=\"background: #F2C14E\">Conhecer o Ouro</a>\n        </div>\n      </sc-if>\n\n      <sc-if value=\"{{full}}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div class=\"sec-t\">Links mais clicados<button class=\"hq\" data-help=\"visitas\" aria-label=\"Ajuda\">?</button></div>\n        <div class=\"list\">\n          <sc-for list=\"{{links}}\" as=\"l\" hint-placeholder-count=\"3\">\n            <div class=\"row\" style=\"cursor: default\"><span class=\"row-tx\"><b>{{l.title}}</b><sc-if value=\"{{l.ab}}\" hint-placeholder-val=\"{{ false }}\"><span>{{l.ab}}</span></sc-if></span><b style=\"font: 700 18px 'Space Grotesk'\">{{l.clicks}}</b></div>\n          </sc-for>\n          <sc-if value=\"{{noLinks}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"row\" style=\"color: #9C9CAD; cursor: default\">Ainda sem cliques neste período.</div></sc-if>\n        </div>\n        <sc-if value=\"{{dia}}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <div class=\"sec-t\">Horários de pico<button class=\"hq\" data-help=\"pico\" aria-label=\"Ajuda\">?</button></div>\n            <div class=\"card\" style=\"padding: 14px\">\n              <div class=\"chart\" style=\"height: 110px; padding: 0\"><sc-for list=\"{{hours}}\" as=\"h\" hint-placeholder-count=\"24\"><div style=\"{{h.st}}\" title=\"{{h.t}}\"></div></sc-for></div>\n              <div style=\"display: flex; justify-content: space-between; font-size: 11px; color: #9C9CAD; margin-top: 6px\"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>23h</span></div>\n              <p style=\"font-size: 14px; margin: 12px 0 0; color: #C9C9D6\">{{peakText}}</p>\n            </div>\n            <sc-if value=\"{{hasCamps}}\" hint-placeholder-val=\"{{ false }}\"><div><div class=\"sec-t\">Links de campanha<button class=\"hq\" data-help=\"campanha\" aria-label=\"Ajuda\">?</button></div><div class=\"list\"><sc-for list=\"{{camps}}\" as=\"c\" hint-placeholder-count=\"2\"><div class=\"row\" style=\"cursor: default\"><span class=\"row-tx\"><b>{{c.name}}</b><span>/{{c.slug}}</span></span><b style=\"font: 700 18px 'Space Grotesk'\">{{c.n}}</b></div></sc-for></div></div></sc-if>\n            <div class=\"sec-t\">Análise da IA<button class=\"hq\" data-help=\"analise\" aria-label=\"Ajuda\">?</button></div>\n            <div class=\"card\" style=\"padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n              <sc-for list=\"{{tips}}\" as=\"t\" hint-placeholder-count=\"2\"><div style=\"font-size: 14px; line-height: 1.5; padding: 10px 12px; border-radius: 12px; background: #14121F; border: 1px solid #2E2A44\">💡 {{t}}</div></sc-for>\n              <sc-if value=\"{{tipErr}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color: #FFB4A3; font-size: 13.5px\">{{tipErr}}</div></sc-if>\n              <button class=\"btn ghost full\" onClick=\"{{analyze}}\">{{analyzeLabel}}</button>\n            </div>\n          </div>\n        </sc-if>\n        <sc-if value=\"{{ouroOnly}}\" hint-placeholder-val=\"{{ false }}\"><a class=\"row card\" href=\"/painel/plano\" style=\"margin-top: 14px; padding: 14px; border-color: #1E3A44\"><span class=\"row-tx\"><b>Horários de pico e análise da IA</b><span>No Diamante você descobre a melhor hora de postar e recebe dicas da IA para vender mais.</span></span><span class=\"chev\">›</span></a></sc-if>\n        <sc-for list=\"{{groups}}\" as=\"g\" hint-placeholder-count=\"3\">\n          <div>\n            <div class=\"sec-t\">{{g.title}}<button class=\"hq\" data-help=\"{{g.h}}\" aria-label=\"Ajuda\">?</button></div>\n            <div class=\"card\" style=\"padding: 14px 16px; display: flex; flex-direction: column; gap: 12px\">\n              <sc-for list=\"{{g.rows}}\" as=\"r\" hint-placeholder-count=\"3\">\n                <div><div style=\"display: flex; justify-content: space-between; font-size: 14px\"><span>{{r.k}}</span><b>{{r.pct}}</b></div><div class=\"bar\"><i style=\"{{r.st}}\"></i></div></div>\n              </sc-for>\n              <sc-if value=\"{{g.empty}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color: #9C9CAD; font-size: 14px\">Sem visitas ainda.</span></sc-if>\n            </div>\n          </div>\n        </sc-for>\n      </div>\n      </sc-if>\n    </div>\n    </sc-if>\n  </div>\n</div>\n", Component, {});
(async()=>{const d=await DC.api('me');if(d.status===401)location.href='/entrar?next='+encodeURIComponent(location.pathname+location.search);})();
</script>
