<script>window.DC_LINKS={"Main.dc.html":"/","Entrar.dc.html":"/entrar","Teste.dc.html":"/entrar#cadastro","Editor.dc.html":"/painel","Aparencia.dc.html":"/painel/aparencia","Temas.dc.html":"/painel/temas","CriadorTema.dc.html":"/painel/criador-tema","Agenda.dc.html":"/painel/agendamentos","Stats.dc.html":"/painel/estatisticas","Contatos.dc.html":"/painel/clientes","Configuracoes.dc.html":"/painel/configuracoes","Indique.dc.html":"/painel/indique","MeuPlano.dc.html":"/painel/plano","Conta.dc.html":"/painel/conta","EditarLink.dc.html":"/painel","Pagamento.dc.html":"/pagamento","ConfirmarPagamento.dc.html":"/pagamento/confirmar","CentralAjuda.dc.html":"/ajuda","SuporteCliente.dc.html":"/painel/suporte","Recibo.dc.html":"/painel/recibo","Termos.dc.html":"/termos","Privacidade.dc.html":"/privacidade","Planos.dc.html":"/#precos","PaginaPublica.dc.html":"/","PaginaFechada.dc.html":"/"};</script>

<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { d: null, k: null, saved: false, err: '' }; }
  componentDidMount() { this.load(); }
  async load() {
    const d = await DC.api('mediakit');
    if (d.status === 401) { location.href = '/entrar'; return; }
    const k = Object.assign({ headline: '', niche: '', about: '', photo: '', networks: [], prices: [], audience: {}, brands: [], showStats: true }, d.kit || {});
    if (!k.networks.length) k.networks = [{ net: 'instagram', handle: '', followers: '', eng: '', views: '' }];
    if (!k.prices.length) k.prices = [{ name: '', price: '' }];
    this.setState({ d: d, k: k });
  }
  set(p) { this.setState({ k: Object.assign({}, this.state.k, p), saved: false }); }
  arr(key, i, p) { const a = this.state.k[key].slice(); a[i] = Object.assign({}, a[i], p); this.set({ [key]: a }); }
  renderVals() {
    const s = this.state, d = s.d, k = s.k;
    if (!d) return { loading: true };
    if (d.level < 1) return { loading: false, locked: true };
    const NETS = [['instagram', 'Instagram'], ['tiktok', 'TikTok'], ['youtube', 'YouTube'], ['twitch', 'Twitch'], ['kwai', 'Kwai'], ['facebook', 'Facebook'], ['x', 'X'], ['outro', 'Outra']];
    const aud = k.audience || {};
    const sw = (on) => 'background: ' + (on ? '#D4FF3A' : '#33333E') + '; justify-content: ' + (on ? 'flex-end' : 'flex-start');
    const reportUrl = d.report ? 'https://whitelink.site/' + d.handle + '/relatorio?k=' + d.report : '';
    const v = {
      loading: false, ready: true, handle: d.handle, dia: d.level >= 2, notDia: d.level < 2, agency: d.agency, k: k, err: s.err,
      url: '/' + d.handle + '/midiakit',
      photo: k.photo ? "background-image: url('/m/" + k.photo + "'); border-style: solid" : '', photoLabel: k.photo ? '' : 'Sua foto',
      pick: async () => { const r = await DC.pickImage({ max: 600, square: true }); if (!r) return; if (!r.ok) { this.setState({ err: r.error }); return; } this.set({ photo: r.id }); },
      nets: k.networks.map((n, i) => ({ handle: n.handle, followers: n.followers || '', eng: n.eng || '', views: n.views || '',
        opts: NETS.map((o) => ({ v: o[0], n: o[1], sel: n.net === o[0] })), setNet: (e) => this.arr('networks', i, { net: e.target.value }),
        setHandle: (e) => this.arr('networks', i, { handle: e.target.value }), setFollowers: (e) => this.arr('networks', i, { followers: e.target.value }),
        setEng: (e) => this.arr('networks', i, { eng: e.target.value }), setViews: (e) => this.arr('networks', i, { views: e.target.value }),
        remove: () => this.set({ networks: k.networks.filter((_, x) => x !== i) }) })),
      addNet: () => this.set({ networks: k.networks.concat([{ net: 'tiktok', handle: '', followers: '', eng: '', views: '' }]) }),
      prices: k.prices.map((p, i) => ({ name: p.name, price: p.price, setName: (e) => this.arr('prices', i, { name: e.target.value }), setPrice: (e) => this.arr('prices', i, { price: e.target.value }) })),
      addPrice: () => this.set({ prices: k.prices.concat([{ name: '', price: '' }]) }),
      aud: aud, brands: Array.isArray(k.brands) ? k.brands.join(', ') : k.brands,
      setWomen: (e) => this.set({ audience: Object.assign({}, aud, { women: e.target.value }) }), setAges: (e) => this.set({ audience: Object.assign({}, aud, { ages: e.target.value }) }),
      setCities: (e) => this.set({ audience: Object.assign({}, aud, { cities: e.target.value }) }), setBrands: (e) => this.set({ brands: e.target.value }),
      showStats: k.showStats !== false, statsSw: sw(k.showStats !== false), statsKnob: 'background: ' + (k.showStats !== false ? '#0E0E14' : '#A7A7B8'), toggleStats: () => this.set({ showStats: k.showStats === false }),
      reportUrl: reportUrl, reportBtn: reportUrl ? 'Desligar o link do relatório' : 'Criar link do relatório',
      copyReport: () => { try { navigator.clipboard.writeText(reportUrl); } catch (e) {} },
      toggleReport: async () => { const r = await DC.api('mediakit', 'PUT', { report: !reportUrl }); if (r.ok) this.load(); else this.setState({ err: r.error }); },
      saveLabel: s.saved ? 'Salvo ✓' : 'Salvar mídia kit',
      save: async () => { const r = await DC.api('mediakit', 'PUT', { kit: k }); this.setState({ saved: r.ok, err: r.ok ? '' : r.error }); }
    };
    ['headline', 'niche', 'about'].forEach((f) => { v['set_' + f] = (e) => this.set({ [f]: e.target.value }); });
    return v;
  }
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
DC.mount(document.getElementById('root'), "\n<div>\n  <div class=\"appbar\"><a class=\"icon-btn\" href=\"/painel/mais\" aria-label=\"Voltar\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M15 5l-7 7 7 7\"/></svg></a><h1>Mídia kit</h1><button class=\"hq\" data-help=\"midiakit\" aria-label=\"Ajuda\">?</button><sc-if value=\"{{url}}\" hint-placeholder-val=\"{{ false }}\"><a class=\"icon-btn\" href=\"{{url}}\" target=\"_blank\" rel=\"noopener\" aria-label=\"Ver mídia kit\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5\"/></svg></a></sc-if></div>\n  <div class=\"app-main\">\n    <sc-if value=\"{{loading}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color: #9C9CAD; padding-top: 30px\">Carregando…</div></sc-if>\n    <sc-if value=\"{{locked}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"card\" style=\"padding: 22px; display: flex; flex-direction: column; gap: 12px; text-align: center; align-items: center; margin-top: 10px\">\n        <b style=\"font-size: 19px\">Feche mais publis</b>\n        <span style=\"font-size: 14px; color: #C9C9D6; line-height: 1.55\">Uma página profissional com seus números, público e preços, com botão para a marca mandar a proposta. Ela chega organizada nos seus Clientes.</span>\n        <a class=\"btn full\" href=\"/painel/plano\" style=\"background: #F2C14E\">Liberar no plano Ouro</a>\n      </div>\n    </sc-if>\n    <sc-if value=\"{{ready}}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <div class=\"card\" style=\"padding: 16px; display: flex; gap: 14px; align-items: center\">\n        <button class=\"pf\" onClick=\"{{pick}}\" style=\"{{photo}}\">{{photoLabel}}</button>\n        <div class=\"note\">Mande o link <b style=\"color: #F3F3F7\">whitelink.site/{{handle}}/midiakit</b> para as marcas, ou adicione o bloco <b style=\"color: #F3F3F7\">Mídia kit</b> na sua página.</div>\n      </div>\n      <div class=\"sec-t\">Sobre você<button class=\"hq\" data-help=\"midiakit\" aria-label=\"Ajuda\">?</button></div>\n      <div class=\"card\" style=\"padding: 16px\">\n        <label class=\"fld\">Título<input class=\"inp\" value=\"{{k.headline}}\" onInput=\"{{set_headline}}\" placeholder=\"Ex.: Mari Souza · Moda e beleza\"></label>\n        <label class=\"fld\">Nicho<input class=\"inp\" value=\"{{k.niche}}\" onInput=\"{{set_niche}}\" placeholder=\"Ex.: Moda, beleza e lifestyle\"></label>\n        <label class=\"fld\" style=\"margin: 0\">Apresentação<textarea class=\"inp\" onInput=\"{{set_about}}\" placeholder=\"Conte quem você é e por que as marcas gostam de trabalhar com você\">{{k.about}}</textarea></label>\n      </div>\n      <div class=\"sec-t\">Redes sociais</div>\n      <sc-for list=\"{{nets}}\" as=\"n\" hint-placeholder-count=\"1\">\n        <div class=\"net\">\n          <div class=\"grid2\"><label class=\"fld\"><span>Rede</span><select class=\"inp\" onChange=\"{{n.setNet}}\"><sc-for list=\"{{n.opts}}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{o.v}}\" selected=\"{{o.sel}}\">{{o.n}}</option></sc-for></select></label><label class=\"fld\">@<input class=\"inp\" value=\"{{n.handle}}\" onInput=\"{{n.setHandle}}\"></label></div>\n          <div class=\"grid2\"><label class=\"fld\">Seguidores<input class=\"inp\" inputmode=\"numeric\" value=\"{{n.followers}}\" onInput=\"{{n.setFollowers}}\"></label><label class=\"fld\">Engajamento %<input class=\"inp\" inputmode=\"decimal\" value=\"{{n.eng}}\" onInput=\"{{n.setEng}}\"></label></div>\n          <label class=\"fld\">Views médias por post<input class=\"inp\" inputmode=\"numeric\" value=\"{{n.views}}\" onInput=\"{{n.setViews}}\"></label>\n          <button class=\"btn ghost\" onClick=\"{{n.remove}}\" style=\"height: 36px; font-size: 13px; color: #FF8A8E\">Remover</button>\n        </div>\n      </sc-for>\n      <button class=\"btn ghost full\" onClick=\"{{addNet}}\">+ Rede</button>\n      <div class=\"sec-t\">Formatos e valores</div>\n      <sc-for list=\"{{prices}}\" as=\"p\" hint-placeholder-count=\"1\"><div class=\"grid2\"><label class=\"fld\">Formato<input class=\"inp\" value=\"{{p.name}}\" onInput=\"{{p.setName}}\" placeholder=\"Ex.: 3 stories\"></label><label class=\"fld\">Valor<input class=\"inp\" value=\"{{p.price}}\" onInput=\"{{p.setPrice}}\" placeholder=\"R$ 800 ou 'sob consulta'\"></label></div></sc-for>\n      <button class=\"btn ghost full\" onClick=\"{{addPrice}}\">+ Formato</button>\n      <div class=\"sec-t\">Público, marcas e números <span class=\"lk\">Diamante</span><button class=\"hq\" data-help=\"midiakit\" aria-label=\"Ajuda\">?</button></div>\n      <div class=\"card\" style=\"padding: 16px\">\n        <sc-if value=\"{{dia}}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <label class=\"fld\">Mulheres no público (%)<input class=\"inp\" inputmode=\"numeric\" value=\"{{aud.women}}\" onInput=\"{{setWomen}}\" placeholder=\"Ex.: 78\"></label>\n            <label class=\"fld\">Idade principal<input class=\"inp\" value=\"{{aud.ages}}\" onInput=\"{{setAges}}\" placeholder=\"Ex.: 18 a 34 anos\"></label>\n            <label class=\"fld\">Principais cidades<input class=\"inp\" value=\"{{aud.cities}}\" onInput=\"{{setCities}}\" placeholder=\"Ex.: São Paulo, Rio, BH\"></label>\n            <label class=\"fld\">Marcas com quem já trabalhou<input class=\"inp\" value=\"{{brands}}\" onInput=\"{{setBrands}}\" placeholder=\"Separe por vírgula\"></label>\n            <div class=\"row\" style=\"padding: 6px 2px; border: none; cursor: default; min-height: 48px\"><span class=\"row-tx\"><b>Mostrar números da sua página</b><span>Visitas, cliques e origem do público, atualizados sozinhos</span></span><button class=\"sw\" onClick=\"{{toggleStats}}\" aria-pressed=\"{{showStats}}\" style=\"{{statsSw}}\"><span style=\"{{statsKnob}}\"></span></button></div>\n            <p class=\"note\" style=\"margin: 8px 0 0\">No mídia kit aparece o botão <b>Baixar em PDF</b>.</p>\n          </div>\n        </sc-if>\n        <sc-if value=\"{{notDia}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"note\" style=\"margin: 0\">No Diamante você mostra o público, as marcas atendidas e os números reais da sua página (que atualizam sozinhos), além de baixar o mídia kit em PDF.</p></sc-if>\n      </div>\n      <sc-if value=\"{{agency}}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div class=\"sec-t\">Relatório para marcas <span class=\"lk\" style=\"border-color: #D4FF3A; color: #D4FF3A\">Agência</span><button class=\"hq\" data-help=\"relatorio\" aria-label=\"Ajuda\">?</button></div>\n          <div class=\"card\" style=\"padding: 16px\">\n            <p class=\"note\" style=\"margin: 0 0 10px\">Um link com os números dos últimos 30 dias para enviar às marcas depois de uma campanha.</p>\n            <sc-if value=\"{{reportUrl}}\" hint-placeholder-val=\"{{ false }}\"><div><code style=\"display: block; word-break: break-all; background: #0E0E14; padding: 12px; border-radius: 12px; font-size: 13px\">{{reportUrl}}</code><button class=\"btn ghost full\" onClick=\"{{copyReport}}\" style=\"margin-top: 10px\">Copiar link</button></div></sc-if>\n            <button class=\"btn ghost full\" onClick=\"{{toggleReport}}\" style=\"margin-top: 10px\">{{reportBtn}}</button>\n          </div>\n        </div>\n      </sc-if>\n      <sc-if value=\"{{err}}\" hint-placeholder-val=\"{{ false }}\"><div role=\"alert\" style=\"margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: #3A1518; color: #FFB4B4; font-size: 14px\">{{err}}</div></sc-if>\n      <button class=\"btn full\" onClick=\"{{save}}\" style=\"margin-top: 16px\">{{saveLabel}}</button>\n    </div>\n    </sc-if>\n  </div>\n</div>\n", Component, {});
(async()=>{const d=await DC.api('me');if(d.status===401)location.href='/entrar?next='+encodeURIComponent(location.pathname+location.search);})();
</script>
