<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { d: null, k: null, saved: false, err: '' }; }
  componentDidMount() { this.load(); }
  async load() {
    const d = await DC.api('mediakit');
    if (d.status === 401) { location.href = '/entrar'; return; }
    const k = Object.assign({ headline: '', niche: '', about: '', photo: '', networks: [], prices: [], audience: {}, brands: [], showStats: true, showPrices: true, works: [], email: '', wa: true, theme: 'escuro', accent: '#d4ff3a' }, d.kit || {});
    const e = await DC.api('editor'); if (e.ok) this.setState({ pblocks: e.blocks || [], phandle: (e.page && e.page.handle) || d.handle });
    if (!k.networks.length) k.networks = [{ net: 'instagram', handle: '', followers: '', eng: '', views: '' }];
    if (!k.prices.length) k.prices = [{ name: '', price: '' }];
    this.setState({ d: d, k: k });
  }
  async showOnPage(quiet) { clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ toast: '' }), 2500); const r = await DC.api('editor', 'POST', { show: 'mediakit' }); if (!r.ok) return; const e = await DC.api('editor'); if (e.ok) this.setState({ pblocks: e.blocks || [] }); if (r.added || !quiet) this.setState({ toast: 'Já aparece na sua página ✓' }); }
  set(p) { this.setState({ k: Object.assign({}, this.state.k, p), saved: false }); }
  arr(key, i, p) { const a = this.state.k[key].slice(); a[i] = Object.assign({}, a[i], p); this.set({ [key]: a }); }
  renderVals() {
    const s = this.state, d = s.d, k = s.k;
    if (!d) return { loading: true };
    if (d.level < 1) return { loading: false, locked: true };
    const NETS = [['instagram', 'Instagram'], ['tiktok', 'TikTok'], ['youtube', 'YouTube'], ['twitch', 'Twitch'], ['kwai', 'Kwai'], ['facebook', 'Facebook'], ['x', 'X'], ['outro', 'Outra']];
    const aud = k.audience || {};
    const sw = (on) => 'background: ' + (on ? '#D4FF3A' : '#33333E') + '; justify-content: ' + (on ? 'flex-end' : 'flex-start');
    const kn = (on) => 'background: ' + (on ? '#0E0E14' : '#A7A7B8');
    const reportUrl = d.report ? 'https://whitelink.site/' + d.handle + '/relatorio?k=' + d.report : '';
    const v = {
      loading: false, ready: true, handle: d.handle, toast: s.toast || '', dia: d.level >= 2, notDia: d.level < 2, agency: d.agency, k: k, err: s.err,
      url: '/' + d.handle + '/midiakit',
      photo: k.photo ? "background-image: url('/m/" + k.photo + "'); border-style: solid" : '', photoLabel: k.photo ? '' : 'Sua foto',
      pick: async () => { const r = await DC.pickImage({ max: 600, square: true }); if (!r) return; if (!r.ok) { this.setState({ err: r.error }); return; } this.set({ photo: r.id }); },
      nets: k.networks.map((n, i) => ({ handle: n.handle, followers: n.followers || '', eng: n.eng || '', views: n.views || '',
        opts: NETS.map((o) => ({ v: o[0], n: o[1], sel: n.net === o[0] })), setNet: (e) => this.arr('networks', i, { net: e.target.value }),
        setHandle: (e) => this.arr('networks', i, { handle: e.target.value }), setFollowers: (e) => this.arr('networks', i, { followers: e.target.value }),
        setEng: (e) => this.arr('networks', i, { eng: e.target.value }), setViews: (e) => this.arr('networks', i, { views: e.target.value }),
        remove: () => this.set({ networks: k.networks.filter((_, x) => x !== i) }) })),
      addNet: () => this.set({ networks: k.networks.concat([{ net: 'tiktok', handle: '', followers: '', eng: '', views: '' }]) }),
      prices: k.prices.map((p, i) => ({ name: p.name, price: p.price, detail: p.detail || '', setName: (e) => this.arr('prices', i, { name: e.target.value }), setPrice: (e) => this.arr('prices', i, { price: e.target.value }), setDetail: (e) => this.arr('prices', i, { detail: e.target.value }), remove: () => this.set({ prices: k.prices.filter((_, x) => x !== i) }) })),
      addPrice: () => this.set({ prices: k.prices.concat([{ name: '', price: '', detail: '' }]) }),
      showPrices: k.showPrices !== false, pricesSw: sw(k.showPrices !== false), pricesKn: kn(k.showPrices !== false), togglePrices: () => this.set({ showPrices: k.showPrices === false }),
      worksLim: d.level >= 2 ? 'até 8' : 'até 3 no Ouro, 8 no Diamante',
      works: (k.works || []).map((w, i) => ({ brand: w.brand, result: w.result, url: w.url, img: w.img ? "background-image: url('/m/" + w.img + "'); border-style: solid" : '', imgLabel: w.img ? '' : '+ Foto',
        pick: async () => { const r = await DC.pickImage({ max: 900 }); if (!r) return; if (!r.ok) { this.setState({ err: r.error }); return; } this.arr('works', i, { img: r.id }); },
        setBrand: (e) => this.arr('works', i, { brand: e.target.value }), setResult: (e) => this.arr('works', i, { result: e.target.value }), setUrl: (e) => this.arr('works', i, { url: e.target.value }),
        remove: () => this.set({ works: k.works.filter((_, x) => x !== i) }) })),
      canWork: (k.works || []).length < (d.level >= 2 ? 8 : 3), addWork: () => this.set({ works: (k.works || []).concat([{ brand: '', result: '', url: '', img: '' }]) }),
      waOn: k.wa !== false, waSw: sw(k.wa !== false), waKn: kn(k.wa !== false), toggleWa: () => this.set({ wa: k.wa === false }),
      themes: [['escuro', 'Escuro'], ['claro', 'Claro (bom para PDF)']].map((t) => ({ name: t[1], sel: (k.theme || 'escuro') === t[0], pick: () => this.set({ theme: t[0] }) })),
      accents: [['#d4ff3a', 'Lima'], ['#8fe3ff', 'Azul'], ['#ff9ad5', 'Rosa'], ['#f2c14e', 'Dourado'], ['#7cf5d0', 'Menta'], ['#b9a6ff', 'Lilás']].map((a) => ({ name: a[1], sel: (k.accent || '#d4ff3a') === a[0], st: 'background: ' + a[0], pick: () => this.set({ accent: a[0] }) })),
      copyLabel: s.copied ? 'Copiado ✓' : 'Copiar link',
      copyLink: async () => { try { await navigator.clipboard.writeText('https://whitelink.site/' + d.handle + '/midiakit'); } catch (e) {} this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 1800); },
      waShare: 'https://wa.me/?text=' + encodeURIComponent('Olá! Segue meu mídia kit com números, formatos e valores: https://whitelink.site/' + d.handle + '/midiakit'),
      hasProps: (d.proposals || []).length > 0,
      props: (d.proposals || []).map((x) => { const parts = String(x.title || '').split(' · '); const dt = new Date(x.created_at); return { title: parts[0] + (x.name ? ' · ' + x.name : ''), sub: (parts.slice(1).join(' · ') || 'Sem mensagem') + ' · ' + dt.toLocaleDateString('pt-BR'), wa: x.phone ? 'https://wa.me/' + ((ph) => (ph.length <= 11 ? '55' + ph : ph))(String(x.phone).replace(/\D/g, '')) + '?text=' + encodeURIComponent('Olá' + (x.name ? ', ' + x.name.split(' ')[0] : '') + '! Recebi sua proposta pelo meu mídia kit. Vamos conversar?') : '/painel/clientes' }; }),
      op: (() => { const b = (s.pblocks || []).find((x) => x.kind === 'mediakit'); const on = !!(b && b.on !== false);
        return on ? { cls: 'card onpage', icon: '✅', title: 'Aparece na sua página', text: 'O botão "' + (b.title || 'Mídia kit') + '" está na sua página. Você também pode mandar o link direto para as marcas.', off: false }
          : { cls: 'card onpage off', icon: '👀', title: 'Ainda não aparece na sua página', text: 'Mande o link direto para as marcas ou coloque o botão na sua página. Ao salvar, já colocamos.', off: true, show: () => this.showOnPage(false) }; })(),
      aud: aud, brands: Array.isArray(k.brands) ? k.brands.join(', ') : k.brands,
      setWomen: (e) => this.set({ audience: Object.assign({}, aud, { women: e.target.value }) }), setAges: (e) => this.set({ audience: Object.assign({}, aud, { ages: e.target.value }) }),
      setCities: (e) => this.set({ audience: Object.assign({}, aud, { cities: e.target.value }) }), setBrands: (e) => this.set({ brands: e.target.value }),
      showStats: k.showStats !== false, statsSw: sw(k.showStats !== false), statsKnob: 'background: ' + (k.showStats !== false ? '#0E0E14' : '#A7A7B8'), toggleStats: () => this.set({ showStats: k.showStats === false }),
      reportUrl: reportUrl, reportBtn: reportUrl ? 'Desligar o link do relatório' : 'Criar link do relatório',
      copyReport: () => { try { navigator.clipboard.writeText(reportUrl); } catch (e) {} },
      toggleReport: async () => { const r = await DC.api('mediakit', 'PUT', { report: !reportUrl }); if (r.ok) this.load(); else this.setState({ err: r.error }); },
      saveLabel: s.saved ? 'Salvo ✓' : 'Salvar mídia kit',
      save: async () => { const r = await DC.api('mediakit', 'PUT', { kit: k }); this.setState({ saved: r.ok, err: r.ok ? '' : r.error }); if (r.ok) this.showOnPage(true); }
    };
    ['headline', 'niche', 'about', 'email'].forEach((f) => { v['set_' + f] = (e) => this.set({ [f]: e.target.value }); });
    return v;
  }
}

DC.mount(document.getElementById('root'), "\n<div>\n  <div class=\"appbar\"><a class=\"icon-btn\" href=\"/painel/mais\" aria-label=\"Voltar\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M15 5l-7 7 7 7\"/></svg></a><h1>Mídia kit</h1><span role=\"status\" style=\"font-size: 12.5px; color: #D4FF3A; margin-left: auto; padding-right: 8px\">{{toast}}</span><button class=\"hq\" data-help=\"midiakit\" aria-label=\"Ajuda\">?</button><sc-if value=\"{{url}}\" hint-placeholder-val=\"{{ false }}\"><a class=\"icon-btn\" href=\"{{url}}\" target=\"_blank\" rel=\"noopener\" aria-label=\"Ver mídia kit\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5\"/></svg></a></sc-if></div>\n  <div class=\"app-main\">\n    <sc-if value=\"{{loading}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color: #9C9CAD; padding-top: 30px\">Carregando…</div></sc-if>\n    <sc-if value=\"{{locked}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"card\" style=\"padding: 22px; display: flex; flex-direction: column; gap: 12px; text-align: center; align-items: center; margin-top: 10px\">\n        <b style=\"font-size: 19px\">Feche mais publis</b>\n        <span style=\"font-size: 14px; color: #C9C9D6; line-height: 1.55\">Uma página profissional com seus números, público e preços, com botão para a marca mandar a proposta. Ela chega organizada nos seus Clientes.</span>\n        <a class=\"btn full\" href=\"/painel/plano\" style=\"background: #F2C14E\">Liberar no plano Ouro</a>\n      </div>\n    </sc-if>\n    <sc-if value=\"{{ready}}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <div class=\"{{op.cls}}\" role=\"status\">\n        <span style=\"font-size: 22px; line-height: 1\">{{op.icon}}</span>\n        <div style=\"flex: 1; min-width: 0\"><b style=\"font-size: 15px\">{{op.title}}</b><p class=\"note\" style=\"margin: 4px 0 0\">{{op.text}}</p>\n          <sc-if value=\"{{op.off}}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn mini\" onClick=\"{{op.show}}\" style=\"height: 40px; padding: 0 16px; margin-top: 10px\">Mostrar na minha página</button></sc-if></div>\n      </div>\n      <div class=\"card\" style=\"padding: 16px\">\n        <div style=\"display: flex; gap: 14px; align-items: center\">\n          <button class=\"pf\" onClick=\"{{pick}}\" style=\"{{photo}}\" aria-label=\"Trocar foto do mídia kit\">{{photoLabel}}</button>\n          <div class=\"note\" style=\"flex: 1; min-width: 0\">Seu link para mandar às marcas:<br><b style=\"color: #F3F3F7; word-break: break-all\">whitelink.site/{{handle}}/midiakit</b></div>\n        </div>\n        <div style=\"display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap\">\n          <a class=\"btn ghost mini\" href=\"{{url}}\" target=\"_blank\" rel=\"noopener\" style=\"flex: 1; height: 42px\">Ver</a>\n          <button class=\"btn ghost mini\" onClick=\"{{copyLink}}\" style=\"flex: 1; height: 42px\">{{copyLabel}}</button>\n          <a class=\"btn ghost mini\" href=\"{{waShare}}\" target=\"_blank\" rel=\"noopener\" style=\"flex: 1; height: 42px\">Enviar no WhatsApp</a>\n        </div>\n      </div>\n      <sc-if value=\"{{hasProps}}\" hint-placeholder-val=\"{{ false }}\"><div id=\"propostas\">\n        <div class=\"sec-t\">Propostas recebidas</div>\n        <div class=\"card\" style=\"padding: 0 16px\"><sc-for list=\"{{props}}\" as=\"pp\" hint-placeholder-count=\"2\"><div class=\"row\" style=\"cursor: default\"><span class=\"row-tx\"><b>{{pp.title}}</b><span>{{pp.sub}}</span></span><a class=\"btn mini\" href=\"{{pp.wa}}\" target=\"_blank\" rel=\"noopener\" style=\"height: 38px; padding: 0 14px\">Responder</a></div></sc-for></div>\n      </div></sc-if>\n      <div class=\"sec-t\">Sobre você<button class=\"hq\" data-help=\"midiakit\" aria-label=\"Ajuda\">?</button></div>\n      <div class=\"card\" style=\"padding: 16px\">\n        <label class=\"fld\">Título<input class=\"inp\" value=\"{{k.headline}}\" onInput=\"{{set_headline}}\" placeholder=\"Ex.: Mari Souza · Moda e beleza\"></label>\n        <label class=\"fld\">Nicho<input class=\"inp\" value=\"{{k.niche}}\" onInput=\"{{set_niche}}\" placeholder=\"Ex.: Moda, beleza e lifestyle\"></label>\n        <label class=\"fld\" style=\"margin: 0\">Apresentação<textarea class=\"inp\" onInput=\"{{set_about}}\" placeholder=\"Conte quem você é e por que as marcas gostam de trabalhar com você\">{{k.about}}</textarea></label>\n      </div>\n      <div class=\"sec-t\">Redes sociais</div>\n      <sc-for list=\"{{nets}}\" as=\"n\" hint-placeholder-count=\"1\">\n        <div class=\"net\">\n          <div class=\"grid2\"><label class=\"fld\"><span>Rede</span><select class=\"inp\" onChange=\"{{n.setNet}}\"><sc-for list=\"{{n.opts}}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{o.v}}\" selected=\"{{o.sel}}\">{{o.n}}</option></sc-for></select></label><label class=\"fld\">@<input class=\"inp\" value=\"{{n.handle}}\" onInput=\"{{n.setHandle}}\"></label></div>\n          <div class=\"grid2\"><label class=\"fld\">Seguidores<input class=\"inp\" inputmode=\"numeric\" value=\"{{n.followers}}\" onInput=\"{{n.setFollowers}}\"></label><label class=\"fld\">Engajamento %<input class=\"inp\" inputmode=\"decimal\" value=\"{{n.eng}}\" onInput=\"{{n.setEng}}\"></label></div>\n          <label class=\"fld\">Views médias por post<input class=\"inp\" inputmode=\"numeric\" value=\"{{n.views}}\" onInput=\"{{n.setViews}}\"></label>\n          <button class=\"btn ghost\" onClick=\"{{n.remove}}\" style=\"height: 36px; font-size: 13px; color: #FF8A8E\">Remover</button>\n        </div>\n      </sc-for>\n      <button class=\"btn ghost full\" onClick=\"{{addNet}}\">+ Rede</button>\n      <div class=\"sec-t\">Formatos e valores</div>\n      <sc-for list=\"{{prices}}\" as=\"p\" hint-placeholder-count=\"1\"><div class=\"net\">\n        <div class=\"grid2\"><label class=\"fld\">Formato<input class=\"inp\" value=\"{{p.name}}\" onInput=\"{{p.setName}}\" placeholder=\"Ex.: 1 Reels + 3 stories\"></label><label class=\"fld\">Valor<input class=\"inp\" value=\"{{p.price}}\" onInput=\"{{p.setPrice}}\" placeholder=\"Ex.: R$ 800\"></label></div>\n        <label class=\"fld\">Detalhes (opcional)<input class=\"inp\" value=\"{{p.detail}}\" onInput=\"{{p.setDetail}}\" maxlength=\"140\" placeholder=\"Ex.: entrega em 7 dias, 1 ajuste incluso\"></label>\n        <button class=\"btn ghost\" onClick=\"{{p.remove}}\" style=\"height: 36px; font-size: 13px; color: #FF8A8E\">Remover</button>\n      </div></sc-for>\n      <button class=\"btn ghost full\" onClick=\"{{addPrice}}\">+ Formato</button>\n      <div class=\"row\" style=\"padding: 10px 2px; border: none; cursor: default; min-height: 48px\"><span class=\"row-tx\"><b>Mostrar os valores</b><span>Desligado, aparece \"Valores sob consulta\"</span></span><button class=\"sw\" onClick=\"{{togglePrices}}\" aria-pressed=\"{{showPrices}}\" aria-label=\"Mostrar os valores\" style=\"{{pricesSw}}\"><span style=\"{{pricesKn}}\"></span></button></div>\n\n      <div class=\"sec-t\">Trabalhos anteriores <span class=\"note\" style=\"text-transform: none; letter-spacing: 0\">({{worksLim}})</span><button class=\"hq\" data-help=\"mktrabalhos\" aria-label=\"Ajuda\">?</button></div>\n      <sc-for list=\"{{works}}\" as=\"w\" hint-placeholder-count=\"1\"><div class=\"net\" style=\"display: flex; gap: 12px\">\n        <button class=\"wimg\" onClick=\"{{w.pick}}\" style=\"{{w.img}}\" aria-label=\"Foto do trabalho\">{{w.imgLabel}}</button>\n        <div style=\"flex: 1; min-width: 0\">\n          <label class=\"fld\">Marca<input class=\"inp\" value=\"{{w.brand}}\" onInput=\"{{w.setBrand}}\" placeholder=\"Ex.: Natura\"></label>\n          <label class=\"fld\">Resultado<input class=\"inp\" value=\"{{w.result}}\" onInput=\"{{w.setResult}}\" placeholder=\"Ex.: 120 mil views e 3 mil cliques\"></label>\n          <label class=\"fld\">Link do post (opcional)<input class=\"inp\" value=\"{{w.url}}\" onInput=\"{{w.setUrl}}\" placeholder=\"https://instagram.com/p/…\" inputmode=\"url\"></label>\n          <button class=\"btn ghost\" onClick=\"{{w.remove}}\" style=\"height: 36px; font-size: 13px; color: #FF8A8E\">Remover</button>\n        </div>\n      </div></sc-for>\n      <sc-if value=\"{{canWork}}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn ghost full\" onClick=\"{{addWork}}\">+ Trabalho</button></sc-if>\n\n      <div class=\"sec-t\">Contato para as marcas</div>\n      <div class=\"card\" style=\"padding: 16px\">\n        <label class=\"fld\">E-mail comercial (opcional)<input class=\"inp\" type=\"email\" value=\"{{k.email}}\" onInput=\"{{set_email}}\" placeholder=\"contato@seuemail.com\" inputmode=\"email\"></label>\n        <div class=\"row\" style=\"padding: 4px 0; border: none; cursor: default; min-height: 0\"><span class=\"row-tx\"><b>Botão \"Chamar no WhatsApp\"</b><span>Usa o celular da sua conta</span></span><button class=\"sw\" onClick=\"{{toggleWa}}\" aria-pressed=\"{{waOn}}\" aria-label=\"Botão de WhatsApp\" style=\"{{waSw}}\"><span style=\"{{waKn}}\"></span></button></div>\n      </div>\n\n      <div class=\"sec-t\">Aparência do mídia kit</div>\n      <div class=\"card\" style=\"padding: 16px\">\n        <div class=\"note\" style=\"margin-bottom: 8px\">Fundo</div>\n        <div class=\"opt\"><sc-for list=\"{{themes}}\" as=\"o\" hint-placeholder-count=\"2\"><button onClick=\"{{o.pick}}\" aria-pressed=\"{{o.sel}}\">{{o.name}}</button></sc-for></div>\n        <div class=\"note\" style=\"margin: 14px 0 8px\">Cor de destaque</div>\n        <div style=\"display: flex; gap: 10px; flex-wrap: wrap\"><sc-for list=\"{{accents}}\" as=\"o\" hint-placeholder-count=\"6\"><button class=\"sw2\" onClick=\"{{o.pick}}\" aria-pressed=\"{{o.sel}}\" aria-label=\"{{o.name}}\" style=\"{{o.st}}\"></button></sc-for></div>\n      </div>\n      <div class=\"sec-t\">Público, marcas e números <span class=\"lk\">Diamante</span><button class=\"hq\" data-help=\"midiakit\" aria-label=\"Ajuda\">?</button></div>\n      <div class=\"card\" style=\"padding: 16px\">\n        <sc-if value=\"{{dia}}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <label class=\"fld\">Mulheres no público (%)<input class=\"inp\" inputmode=\"numeric\" value=\"{{aud.women}}\" onInput=\"{{setWomen}}\" placeholder=\"Ex.: 78\"></label>\n            <label class=\"fld\">Idade principal<input class=\"inp\" value=\"{{aud.ages}}\" onInput=\"{{setAges}}\" placeholder=\"Ex.: 18 a 34 anos\"></label>\n            <label class=\"fld\">Principais cidades<input class=\"inp\" value=\"{{aud.cities}}\" onInput=\"{{setCities}}\" placeholder=\"Ex.: São Paulo, Rio, BH\"></label>\n            <label class=\"fld\">Marcas com quem já trabalhou<input class=\"inp\" value=\"{{brands}}\" onInput=\"{{setBrands}}\" placeholder=\"Separe por vírgula\"></label>\n            <div class=\"row\" style=\"padding: 6px 2px; border: none; cursor: default; min-height: 48px\"><span class=\"row-tx\"><b>Mostrar números da sua página</b><span>Visitas, cliques e origem do público, atualizados sozinhos</span></span><button class=\"sw\" onClick=\"{{toggleStats}}\" aria-pressed=\"{{showStats}}\" style=\"{{statsSw}}\"><span style=\"{{statsKnob}}\"></span></button></div>\n            <p class=\"note\" style=\"margin: 8px 0 0\">No mídia kit aparece o botão <b>Baixar em PDF</b>.</p>\n          </div>\n        </sc-if>\n        <sc-if value=\"{{notDia}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"note\" style=\"margin: 0\">No Diamante você mostra o público, as marcas atendidas e os números reais da sua página (que atualizam sozinhos), além de baixar o mídia kit em PDF.</p></sc-if>\n      </div>\n      <sc-if value=\"{{agency}}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div class=\"sec-t\">Relatório para marcas <span class=\"lk\" style=\"border-color: #D4FF3A; color: #D4FF3A\">Agência</span><button class=\"hq\" data-help=\"relatorio\" aria-label=\"Ajuda\">?</button></div>\n          <div class=\"card\" style=\"padding: 16px\">\n            <p class=\"note\" style=\"margin: 0 0 10px\">Um link com os números dos últimos 30 dias para enviar às marcas depois de uma campanha.</p>\n            <sc-if value=\"{{reportUrl}}\" hint-placeholder-val=\"{{ false }}\"><div><code style=\"display: block; word-break: break-all; background: #0E0E14; padding: 12px; border-radius: 12px; font-size: 13px\">{{reportUrl}}</code><button class=\"btn ghost full\" onClick=\"{{copyReport}}\" style=\"margin-top: 10px\">Copiar link</button></div></sc-if>\n            <button class=\"btn ghost full\" onClick=\"{{toggleReport}}\" style=\"margin-top: 10px\">{{reportBtn}}</button>\n          </div>\n        </div>\n      </sc-if>\n      <sc-if value=\"{{err}}\" hint-placeholder-val=\"{{ false }}\"><div role=\"alert\" style=\"margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: #3A1518; color: #FFB4B4; font-size: 14px\">{{err}}</div></sc-if>\n      <button class=\"btn full\" onClick=\"{{save}}\" style=\"margin-top: 16px\">{{saveLabel}}</button>\n    </div>\n    </sc-if>\n  </div>\n</div>\n", Component, {});
(async()=>{const d=await DC.api('me');if(d.status===401)location.href='/entrar?next='+encodeURIComponent(location.pathname+location.search);})();
</script>
