.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}

<script>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    const h = (location.hash || '').slice(1);
    this.state = { d: null, tab: ['pedidos', 'loja', 'agenda', 'apoios', 'quiz'].includes(h) ? h : 'pedidos', kind: '', sales: [], sums: [], sheet: null, saved: '', err: '', toast: '' };
  }
  async componentDidMount() { await this.load(); this.loadSales(); }
  async load() {
    const d = await DC.api('biz');
    if (d.status === 401) { location.href = '/entrar'; return; }
    if (!d.ok) return;
    const ag = d.agenda;
    this.setState({ d: d, pay: Object.assign({ key: '', name: '', city: '', wa: '' }, d.pay), shop: { ship: d.shop.shipping ? (d.shop.shipping / 100).toFixed(2).replace('.', ',') : '', coupons: d.shop.coupons || [] },
      ag: Object.assign({}, ag, { services: ag.services.map((s) => Object.assign({}, s, { price: s.cents ? (s.cents / 100).toFixed(2).replace('.', ',') : '', deposit: s.deposit ? (s.deposit / 100).toFixed(2).replace('.', ',') : '' })) }),
      sup: { title: d.support.title, goal: (d.support.cents / 100).toFixed(2).replace('.', ','), raised: d.support.raised, cents: d.support.cents, count: d.support.count },
      quizzes: JSON.parse(JSON.stringify(d.quizzes || [])) });
  }
  async loadSales() { const r = await DC.api('sales' + (this.state.kind ? '?k=' + this.state.kind : '')); if (r.ok) this.setState({ sales: r.sales, sums: r.sums }); }
  flash(t) { this.setState({ toast: t }); clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ toast: '' }), 1800); }
  async put(body, msg) {
    const r = await DC.api('biz', 'PUT', body);
    this.setState({ err: r.ok ? '' : r.error });
    if (r.ok) { this.flash(msg || 'Salvo ✓'); await this.load(); }
  }
  ph(k, v) { this.setState({ pay: Object.assign({}, this.state.pay, { [k]: v }) }); }
  agSet(p) { this.setState({ ag: Object.assign({}, this.state.ag, p) }); }
  svcSet(i, p) { const s = this.state.ag.services.slice(); s[i] = Object.assign({}, s[i], p); this.agSet({ services: s }); }
  qz(fn) { const q = JSON.parse(JSON.stringify(this.state.quizzes)); fn(q); this.setState({ quizzes: q }); }
  renderVals() {
    const s = this.state, d = s.d;
    if (!d) return { loading: true };
    if (d.level < 1) return { loading: false, locked: true };
    const brl = (c) => 'R$ ' + (c / 100).toFixed(2).replace('.', ',');
    const dia = d.level >= 2;
    const fmtD = (t) => new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    const tab = s.tab;
    const ST = { aguardando: ['Aguardando', 'rgba(242,193,78,.16)', '#F2C14E'], confirmado: ['Confirmado', 'rgba(143,227,255,.14)', '#8FE3FF'], pago: ['Pago', 'rgba(74,222,128,.14)', '#4ADE80'], concluido: ['Concluído', '#1B1B24', '#C9C9D6'], cancelado: ['Cancelado', '#1B1B24', '#6F6F80'] };
    const sumOf = (k, st) => s.sums.filter((x) => x.kind === k && (!st || st.includes(x.status))).reduce((a, x) => a + x.c, 0);
    const v = {
      loading: false, ready: true, saved: s.saved, err: s.err, toast: s.toast, dia: dia, notDia: !dia,
      tabs: [['pedidos', 'Pedidos'], ['loja', 'Loja'], ['agenda', 'Agenda'], ['apoios', 'Apoios'], ['quiz', 'Quiz']].map((t) => ({ name: t[1], sel: tab === t[0], go: () => { history.replaceState(null, '', '#' + t[0]); this.setState({ tab: t[0], err: '' }); } })),
      tPed: tab === 'pedidos', tLoja: tab === 'loja', tAg: tab === 'agenda', tAp: tab === 'apoios', tQz: tab === 'quiz',
      close: () => this.setState({ sheet: null }), stop: (e) => e.stopPropagation()
    };
    if (tab === 'pedidos') {
      v.kpis = [{ v: brl(sumOf('pedido', ['pago', 'concluido'])), l: 'vendas pagas (30 dias)' }, { v: String(s.sums.filter((x) => x.kind === 'agendamento' && x.status !== 'cancelado').reduce((a, x) => a + x.n, 0)), l: 'agendamentos (30 dias)' }, { v: brl(sumOf('apoio', ['pago'])), l: 'apoios (30 dias)' }];
      v.noPix = !s.pay.key; v.goPay = () => setTimeout(() => { const e = document.getElementById('recebimentos'); if (e) e.scrollIntoView({ behavior: 'smooth' }); }, 0);
      v.kinds = [['', 'Todos'], ['pedido', 'Pedidos'], ['agendamento', 'Agenda'], ['apoio', 'Apoios']].map((k) => ({ name: k[1], sel: s.kind === k[0], go: () => { this.setState({ kind: k[0] }); setTimeout(() => this.loadSales(), 0); } }));
      v.sales = s.sales.map((x) => {
        const st = ST[x.status] || ST.aguardando;
        const title = x.kind === 'pedido' ? x.name + ' · ' + brl(x.cents) : x.kind === 'apoio' ? '💛 ' + x.name + ' · ' + brl(x.cents) : '📅 ' + x.name + ' · ' + fmtD(x.start_ts);
        const sub = x.kind === 'pedido' ? (x.items.items || []).map((i) => i.qty + 'x ' + i.name).join(', ') : x.kind === 'apoio' ? (x.message || 'Apoio') : ((d.agenda.services.find((q) => q.id === x.service) || {}).name || 'Agendamento');
        return { title, sub: sub + ' · ' + x.code, st: st[0], chip: 'background: ' + st[1] + '; color: ' + st[2], open: () => this.setState({ sheet: { kind: 'sale', x: x } }) };
      });
      v.noSales = !v.sales.length;
      v.pay = s.pay; v.phoneHint = 'Seu celular: (' + String(d.phone).slice(0, 2) + ') ' + String(d.phone).slice(2);
      v.setPayKey = (e) => this.ph('key', e.target.value); v.setPayName = (e) => this.ph('name', e.target.value); v.setPayCity = (e) => this.ph('city', e.target.value); v.setPayWa = (e) => this.ph('wa', e.target.value);
      v.savePay = async () => { const r = await DC.api('settings', 'PUT', { pay: s.pay }); this.setState({ err: r.ok ? (r.warnings || []).join(' ') : r.error }); if (r.ok) { this.flash('Recebimentos salvos ✓'); this.load(); } };
    }
    if (tab === 'loja') {
      const lim = dia ? 500 : 10;
      v.prodCount = dia ? d.products.length + (d.products.length === 1 ? ' produto' : ' produtos') + ' · sem limite no seu plano' : d.products.length + ' de ' + lim + ' produtos · No Diamante é ilimitado';
      v.products = d.products.map((p) => ({ name: p.name, sub: brl(p.cents) + (p.stock >= 0 ? ' · estoque ' + p.stock : '') + (p.active ? '' : ' · escondido'), img: p.image ? "background-image: url('/m/" + p.image + "')" : '', open: () => this.setState({ sheet: { kind: 'prod', p: { id: p.id, name: p.name, price: (p.cents / 100).toFixed(2).replace('.', ','), stock: p.stock >= 0 ? String(p.stock) : '', descr: p.descr || '', image: p.image || '' } } }) }));
      v.newProduct = () => this.setState({ sheet: { kind: 'prod', p: { name: '', price: '', stock: '', descr: '', image: '' } } });
      v.shop = s.shop;
      v.setShip = (e) => this.setState({ shop: Object.assign({}, s.shop, { ship: e.target.value }) });
      v.coupons = s.shop.coupons.map((c, i) => ({ code: c.code, pct: c.pct, setCode: (e) => { const cs = s.shop.coupons.slice(); cs[i] = Object.assign({}, cs[i], { code: e.target.value.toUpperCase() }); this.setState({ shop: Object.assign({}, s.shop, { coupons: cs }) }); }, setPct: (e) => { const cs = s.shop.coupons.slice(); cs[i] = Object.assign({}, cs[i], { pct: e.target.value }); this.setState({ shop: Object.assign({}, s.shop, { coupons: cs }) }); } }));
      v.addCoupon = () => this.setState({ shop: Object.assign({}, s.shop, { coupons: s.shop.coupons.concat([{ code: '', pct: 10 }]) }) });
      v.saveShop = () => this.put({ shop: { shipping: s.shop.ship || '0', coupons: s.shop.coupons } }, 'Loja salva ✓');
    }
    if (tab === 'agenda') {
      const ag = s.ag;
      v.ag = ag;
      v.services = ag.services.map((x, i) => ({ name: x.name, minutes: x.minutes, price: x.price, deposit: x.deposit,
        setName: (e) => this.svcSet(i, { name: e.target.value }), setMin: (e) => this.svcSet(i, { minutes: e.target.value }), setPrice: (e) => this.svcSet(i, { price: e.target.value }), setDep: (e) => this.svcSet(i, { deposit: e.target.value }),
        remove: () => this.agSet({ services: ag.services.filter((_, k) => k !== i) }) }));
      v.svcFull = ag.services.length >= (dia ? 30 : 1);
      v.addSvcLabel = v.svcFull && !dia ? 'Mais serviços só no Diamante' : '+ Serviço';
      v.addService = () => this.agSet({ services: ag.services.concat([{ name: '', minutes: 60, price: '', deposit: '' }]) });
      v.weekdays = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map((n, i) => ({ n, on: !!ag.days[i], toggle: () => { const dd = ag.days.slice(); dd[i] = !dd[i]; this.agSet({ days: dd }); } }));
      v.setFrom = (e) => this.agSet({ from: e.target.value }); v.setTo = (e) => this.agSet({ to: e.target.value });
      v.steps = [15, 20, 30, 45, 60, 90, 120].map((m) => ({ v: m, n: 'A cada ' + m + ' min', sel: ag.step === m }));
      v.setStep = (e) => this.agSet({ step: +e.target.value });
      v.blockedText = ag.blockedText !== undefined ? ag.blockedText : ag.blocked.map((x) => x.slice(8, 10) + '/' + x.slice(5, 7)).join(', ');
      v.setBlocked = (e) => this.agSet({ blockedText: e.target.value });
      v.saveAgenda = () => {
        const yr = new Date().getFullYear();
        const blocked = String(v.blockedText || '').split(/[,\s]+/).filter(Boolean).map((x) => { const m = x.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?$/); if (!m) return ''; let y = +(m[3] || yr); const iso = y + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0'); if (!m[3] && iso < new Date().toISOString().slice(0, 10)) y++; return y + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0'); }).filter(Boolean);
        this.put({ agenda: { services: ag.services, days: ag.days, from: ag.from, to: ag.to, step: ag.step, blocked } }, 'Agenda salva ✓');
      };
    }
    if (tab === 'apoios') {
      v.sup = s.sup; v.supGoal = s.sup.goal;
      v.supBar = 'width: ' + Math.min(100, Math.round(s.sup.raised / Math.max(1, s.sup.cents) * 100)) + '%';
      v.supText = brl(s.sup.raised) + ' de ' + brl(s.sup.cents) + ' · ' + s.sup.count + (s.sup.count === 1 ? ' apoio confirmado' : ' apoios confirmados');
      v.setSupTitle = (e) => this.setState({ sup: Object.assign({}, s.sup, { title: e.target.value }) });
      v.setSupGoal = (e) => this.setState({ sup: Object.assign({}, s.sup, { goal: e.target.value }) });
      v.saveSupport = () => this.put({ support: { title: s.sup.title, goal: s.sup.goal } }, 'Meta salva ✓');
      v.resetSupport = () => { if (confirm('Começar uma meta nova? O valor arrecadado volta para zero (os apoios continuam no histórico).')) this.put({ support: { title: s.sup.title, goal: s.sup.goal, reset: true } }, 'Meta nova começou ✓'); };
    }
    if (tab === 'quiz') {
      const Q = s.quizzes;
      v.quizzes = Q.map((q, qi) => ({
        title: q.title, intro: q.intro,
        setTitle: (e) => this.qz((a) => { a[qi].title = e.target.value; }), setIntro: (e) => this.qz((a) => { a[qi].intro = e.target.value; }),
        results: q.results.map((r, ri) => ({ n: ri + 1, title: r.title, text: r.text, btn: r.btn, url: r.url,
          setTitle: (e) => this.qz((a) => { a[qi].results[ri].title = e.target.value; }), setText: (e) => this.qz((a) => { a[qi].results[ri].text = e.target.value; }),
          setBtn: (e) => this.qz((a) => { a[qi].results[ri].btn = e.target.value; }), setUrl: (e) => this.qz((a) => { a[qi].results[ri].url = e.target.value; }) })),
        addResult: () => this.qz((a) => { a[qi].results.push({ title: '', text: '', btn: '', url: '' }); }),
        questions: q.questions.map((x, xi) => ({ n: xi + 1, q: x.q, setQ: (e) => this.qz((a) => { a[qi].questions[xi].q = e.target.value; }),
          options: x.options.map((o, oi) => ({ t: o.t, setT: (e) => this.qz((a) => { a[qi].questions[xi].options[oi].t = e.target.value; }),
            choices: q.results.map((r, ri) => ({ v: ri, n: r.title || 'Resultado ' + (ri + 1), sel: o.r === ri })), setR: (e) => this.qz((a) => { a[qi].questions[xi].options[oi].r = +e.target.value; }) })),
          addOpt: () => this.qz((a) => { a[qi].questions[xi].options.push({ t: '', r: 0 }); }) })),
        addQ: () => this.qz((a) => { a[qi].questions.push({ q: '', options: [{ t: '', r: 0 }, { t: '', r: 1 % Math.max(1, a[qi].results.length) }] }); }),
        remove: () => { if (confirm('Apagar este quiz?')) this.qz((a) => { a.splice(qi, 1); }); }
      }));
      v.quizFull = Q.length >= (dia ? 30 : 1);
      v.addQuizLabel = v.quizFull && !dia ? 'Mais quizzes só no Diamante' : '+ Novo quiz';
      v.addQuiz = () => this.qz((a) => { a.push({ title: '', intro: '', askContact: true, results: [{ title: '', text: '', btn: '', url: '' }, { title: '', text: '', btn: '', url: '' }], questions: [{ q: '', options: [{ t: '', r: 0 }, { t: '', r: 1 }] }] }); });
      v.saveQuiz = () => this.put({ quizzes: Q }, 'Quiz salvo ✓');
    }
    const sh = s.sheet;
    v.ps = !!(sh && sh.kind === 'prod'); v.ss = !!(sh && sh.kind === 'sale');
    if (v.ps) {
      const p = sh.p, up = (patch) => this.setState({ sheet: { kind: 'prod', p: Object.assign({}, p, patch) } });
      v.pe = { head: p.id ? 'Editar produto' : 'Novo produto', id: p.id || '', name: p.name, price: p.price, stock: p.stock, descr: p.descr, err: p.err || '',
        img: p.image ? "background-image: url('/m/" + p.image + "'); background-size: cover; background-position: center; border-style: solid" : '', imgLabel: p.image ? '' : '+ Foto do produto',
        pick: async () => { const r = await DC.pickImage({ max: 900, square: true }); if (!r) return; if (!r.ok) { up({ err: r.error }); return; } up({ image: r.id, err: '' }); },
        aiLabel: p.aiBusy ? 'Pensando…' : 'Escrever descrição com IA', aiItems: (p.aiItems || []).map((t) => ({ t, use: () => up({ descr: t.slice(0, 300), aiItems: null }) })),
        ai: async () => { if (!p.name) { up({ err: 'Escreva o nome do produto primeiro.' }); return; } up({ aiBusy: true, err: '' }); const r = await DC.ai('product', p.name + (p.price ? ' — R$ ' + p.price : '')); const cur = this.state.sheet.p; this.setState({ sheet: { kind: 'prod', p: Object.assign({}, cur, { aiBusy: false, aiItems: r.ok ? r.items : null, err: r.ok ? '' : r.error }) } }); },
        setName: (e) => up({ name: e.target.value }), setPrice: (e) => up({ price: e.target.value }), setStock: (e) => up({ stock: e.target.value }), setDescr: (e) => up({ descr: e.target.value }),
        save: async () => { const r = await DC.api('products', 'POST', p); if (!r.ok) { up({ err: r.error }); return; } this.setState({ sheet: null }); this.flash('Produto salvo ✓'); this.load(); },
        del: async () => { if (!confirm('Apagar este produto?')) return; await DC.api('products?id=' + p.id, 'DELETE'); this.setState({ sheet: null }); this.load(); } };
    }
    if (v.ss) {
      const x = sh.x;
      const svc = d.agenda.services.find((q) => q.id === x.service);
      const kv = [['Código', x.code], ['Cliente', x.name], ['WhatsApp', x.phone ? '(' + x.phone.slice(0, 2) + ') ' + x.phone.slice(2) : '—']];
      if (x.kind === 'pedido') { (x.items.items || []).forEach((i) => kv.push([i.qty + 'x ' + i.name, brl(i.cents * i.qty)])); if (x.items.coupon) kv.push(['Cupom', x.items.coupon]); if (x.items.ship) kv.push(['Frete', brl(x.items.ship)]); kv.push(['Total', brl(x.cents)]); }
      if (x.kind === 'agendamento') { kv.push(['Serviço', svc ? svc.name : '—'], ['Quando', fmtD(x.start_ts)]); if (x.cents) kv.push(['Valor', brl(x.cents)]); }
      if (x.kind === 'apoio') kv.push(['Valor', brl(x.cents)]);
      if (x.message) kv.push(['Mensagem', x.message]);
      if (x.aff) kv.push(['Veio pelo parceiro', x.aff]);
      kv.push(['Feito em', fmtD(x.created_at)], ['Situação', (ST[x.status] || ST.aguardando)[0]]);
      const act = (st, t, cls) => ({ t, cls: cls || 'ghost', go: async () => { const r = await DC.api('sales', 'POST', { id: x.id, status: st }); if (r.ok) { this.setState({ sheet: null }); this.flash('Atualizado ✓'); this.loadSales(); this.load(); } } });
      const acts = [];
      if (x.status === 'aguardando' || x.status === 'confirmado') acts.push(act('pago', x.kind === 'apoio' ? 'Confirmar Pix recebido' : 'Marcar como pago', ''));
      if (x.status !== 'concluido' && x.status !== 'cancelado' && x.kind !== 'apoio') acts.push(act('concluido', x.kind === 'pedido' ? 'Marcar como entregue' : 'Marcar como atendido'));
      if (x.status !== 'cancelado') acts.push(act('cancelado', 'Cancelar'));
      v.se = { head: { pedido: 'Pedido', agendamento: 'Agendamento', apoio: 'Apoio' }[x.kind], kv: kv.map((k) => ({ k: k[0], v: k[1] })), wa: 'https://wa.me/55' + x.phone + '?text=' + encodeURIComponent('Olá, ' + String(x.name).split(' ')[0] + '! Aqui é sobre o seu ' + { pedido: 'pedido', agendamento: 'agendamento', apoio: 'apoio' }[x.kind] + ' ' + x.code + '.'), actions: acts };
    }
    return v;
  }
}

  <div class=\"scrim\" onClick=\"{{close}}\"><div class=\"sheet\" onClick=\"{{stop}}\">\n      <div class=\"grab\"></div>\n      <h2>{{se.head}}</h2>\n      <sc-for list=\"{{se.kv}}\" as=\"k\" hint-placeholder-count=\"4\"><div style=\"display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1C1C24; font-size: 14px\"><span style=\"color: #9C9CAD\">{{k.k}}</span><b style=\"text-align: right\">{{k.v}}</b></div></sc-for>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: 16px\">\n        <a class=\"btn full\" href=\"{{se.wa}}\" target=\"_blank\" rel=\"noopener\" style=\"background: #25D366\">Chamar no WhatsApp</a>\n        <sc-for list=\"{{se.actions}}\" as=\"a\" hint-placeholder-count=\"2\"><button class=\"btn full {{a.cls}}\" onClick=\"{{a.go}}\">{{a.t}}</button></sc-for>\n      </div>\n    </div></div>\n  </sc-if>\n  <sc-if value=\"{{toast}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"toast\" role=\"status\">{{toast}}</div></sc-if>\n</div>\n", Component, {});
