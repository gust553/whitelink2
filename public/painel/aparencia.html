.th .mini{width:100%;height:12px;border-radius:7px}

.mini-ap{width:88px;height:150px;border-radius:16px;overflow:hidden;flex:none;pointer-events:none}.mini-ap .ph{transform:scale(.26);transform-origin:top left;border-width:0}
.opt{display:flex;gap:8px;flex-wrap:wrap}
.opt button{height:46px;padding:0 18px;border-radius:14px;cursor:pointer;font-size:14px;font-family:inherit}

<script>window.DC_LINKS={"Main.dc.html":"/","Entrar.dc.html":"/entrar","Teste.dc.html":"/entrar#cadastro","Editor.dc.html":"/painel","Aparencia.dc.html":"/painel/aparencia","Temas.dc.html":"/painel/temas","CriadorTema.dc.html":"/painel/criador-tema","Agenda.dc.html":"/painel/agendamentos","Stats.dc.html":"/painel/estatisticas","Contatos.dc.html":"/painel/clientes","Configuracoes.dc.html":"/painel/configuracoes","Indique.dc.html":"/painel/indique","MeuPlano.dc.html":"/painel/plano","Conta.dc.html":"/painel/conta","EditarLink.dc.html":"/painel","Pagamento.dc.html":"/pagamento","ConfirmarPagamento.dc.html":"/pagamento/confirmar","CentralAjuda.dc.html":"/ajuda","SuporteCliente.dc.html":"/painel/suporte","Recibo.dc.html":"/painel/recibo","Termos.dc.html":"/termos","Privacidade.dc.html":"/privacidade","Planos.dc.html":"/#precos","PaginaPublica.dc.html":"/","PaginaFechada.dc.html":"/"};</script>
<script src="/assets/dc.js"></script>
<script src="/assets/temas-list.js"></script>
<script src="/assets/planos.js"></script>
<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { loading: true, plan: 0, theme: 0, tk: '', font: 0, shape: 1, acc: '', saved: 'idle' }; }
  async componentDidMount() {
    const d = await DC.api('editor');
    if (d.status === 401) { location.href = '/entrar'; return; }
    const a = d.appearance || {};
    this.setState({ loading: false, plan: { prata: 0, ouro: 1, diamante: 2 }[d.user && d.user.plan] || 0,
      theme: a.theme || 0, tk: a.tk || '', font: a.font || 0, shape: a.shape == null ? 1 : a.shape, acc: a.acc || '', useCustom: !!a.useCustom });
  }
  set(patch) {
    this.setState(Object.assign({ saved: 'saving', useCustom: false }, patch));
    clearTimeout(this.t);
    this.t = setTimeout(async () => {
      const s = this.state;
      const d = await DC.api('appearance', 'PUT', { appearance: { theme: s.theme, tk: s.tk, font: s.font, shape: s.shape, acc: s.acc } });
      this.setState({ saved: d.ok ? 'saved' : 'error' });
    }, 500);
  }
  renderVals() {
    const s = this.state;
    const T = [
      { name: 'Noite', bg: '#0E0E14', fg: '#F3F3F7', card: '#1A1A22', acc: '#D4FF3A' },
      { name: 'Papel', bg: '#F4F2EC', fg: '#16161A', card: '#FFFFFF', acc: '#1F5BFF' },
      { name: 'Oceano', bg: '#06222B', fg: '#EAF7F7', card: '#0D3340', acc: '#7CF5D0' },
      { name: 'Brasa', bg: '#1A0F0B', fg: '#FBEFE7', card: '#2A1912', acc: '#FF8A3D' }
    ];
    const cur = s.plan === 0 && s.theme >= 2 ? 0 : s.theme;
    const pill = (sel) => sel ? 'border: 1px solid #D4FF3A; background: rgba(212,255,58,.12); color: #F3F3F7; font-weight: 600' : 'border: 1px solid #2A2A34; background: #14141B; color: #C9C9D6';
    const SM = { idle: ['', '#6F6F80'], saving: ['Salvando…', '#9C9CAD'], saved: ['Salvo ✓', '#D4FF3A'], error: ['Não salvou', '#FF8A6B'] };
    const TT = window.WL_TEMAS || [];
    const tk = s.tk || ['noite', 'papel', 'oceano', 'brasa'][s.theme] || 'noite';
    const row = TT.find((t) => t[1] === tk) || ['Noite', 'noite', 0];
    const eff = row[2] <= s.plan ? row : TT[0] || row;
    const basic = ['noite', 'papel', 'oceano', 'brasa'].indexOf(eff[1]) >= 0;
    return {
      tcls: 't-' + eff[1], themeName: s.useCustom && s.plan === 2 ? 'Tema criado por você' : eff[0], basic: basic,
      creatorText: s.useCustom && s.plan === 2 ? 'Em uso na sua página' : 'Monte um tema com suas cores e fonte',
      loading: s.loading, ready: !s.loading,
      saveText: SM[s.saved][0], saveColor: SM[s.saved][1],
      themes: T.map((t, i) => {
        const locked = s.plan === 0 && i >= 2;
        const acc = s.plan >= 1 && s.acc ? s.acc : t.acc;
        return {
          name: t.name, fg: t.fg, sel: cur === i, locked: locked,
          style: 'background: ' + t.bg + '; border-color: ' + (cur === i ? '#D4FF3A' : '#24242E') + (locked ? '; opacity: .45; cursor: not-allowed' : ''),
          avStyle: 'background: ' + t.card + '; border: 2px solid ' + acc,
          b1: 'background: ' + acc, b2: 'background: ' + t.card,
          pick: () => { if (!locked) this.set({ theme: i }); }
        };
      }),
      moreThemes: s.plan === 2 ? '77 temas liberados' : (s.plan === 1 ? '13 temas liberados' : '2 temas liberados'),
      locked: s.plan === 0, canStyle: s.plan >= 1,
      acc: s.acc || '#D4FF3A',
      setAcc: (e) => this.set({ acc: e.target.value }),
      resetAcc: () => this.set({ acc: '' }),
      fonts: ['Grotesk', 'Inter', 'Serifada'].map((n, i) => ({ name: n, sel: s.font === i, style: pill(s.font === i) + '; font-family: ' + ["'Space Grotesk'", 'Inter', 'Georgia, serif'][i], pick: () => this.set({ font: i }) })),
      shapes: [['Reto', '6px'], ['Suave', '14px'], ['Pílula', '999px']].map((x, i) => ({ name: x[0], sel: s.shape === i, style: pill(s.shape === i) + '; border-radius: ' + x[1], pick: () => this.set({ shape: i }) }))
    };
  }
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
DC.mount(document.getElementById('root'), "\n<div>\n  <div class=\"appbar\"><h1>Aparência</h1><span role=\"status\" style=\"font-size: 12.5px; color: {{saveColor}}; padding-right: 10px\">{{saveText}}</span></div>\n  <sc-if value=\"{{loading}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"app-main\" style=\"color: #9C9CAD; padding-top: 40px\">Carregando…</div></sc-if>\n  <sc-if value=\"{{ready}}\" hint-placeholder-val=\"{{ true }}\">\n  <div class=\"app-main\">\n    <div class=\"sec-t\" style=\"margin-top: 8px\">Tema</div>\n    <a class=\"card\" href=\"/painel/temas\" style=\"display: flex; align-items: center; gap: 16px; padding: 14px; text-decoration: none; color: inherit\">\n      <div class=\"mini-ap\"><div class=\"ph {{tcls}}\"><div class=\"ph-bg\"></div><div class=\"ph-tag\">NOVO!</div><div class=\"ph-in\"><div class=\"ph-head\"><div class=\"ph-av\"></div><div class=\"ph-name\">Aa</div><div class=\"ph-orn\"></div></div><div class=\"ph-btn main\">Link</div><div class=\"ph-btn\">Link</div></div></div></div>\n      <div style=\"flex: 1; display: flex; flex-direction: column; gap: 4px\"><b style=\"font-size: 17px\">{{themeName}}</b><span style=\"font-size: 14px; color: #9C9CAD\">{{moreThemes}}</span></div>\n      <span class=\"btn ghost\" style=\"height: 42px; padding: 0 16px; font-size: 14px\">Trocar</span>\n    </a>\n    <a class=\"row card\" href=\"/painel/criador-tema\" style=\"margin-top: 10px; text-decoration: none; color: inherit; padding: 14px 16px\">\n      <span class=\"row-tx\"><b>Criador de tema</b><span>{{creatorText}}</span></span>\n      <span class=\"chip\" style=\"background: rgba(143,227,255,.14); color: #8FE3FF\">Diamante</span>\n    </a>\n\n    <sc-if value=\"{{locked}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"card\" style=\"margin-top: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px; border-color: #4A3A14\">\n        <b style=\"font-size: 16px\">Mudar cor, fonte e botões</b>\n        <a class=\"btn\" href=\"MeuPlano.dc.html\" style=\"background: #F2C14E\">Conhecer o Ouro</a>\n      </div>\n    </sc-if>\n    <sc-if value=\"{{canStyle}}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"sec-t\">Cor</div>\n      <div class=\"card\" style=\"padding: 14px 16px; display: flex; align-items: center; gap: 14px\">\n        <input type=\"color\" value=\"{{acc}}\" onChange=\"{{setAcc}}\" aria-label=\"Cor de destaque\" style=\"width: 52px; height: 52px; border: none; border-radius: 14px; background: transparent; padding: 0; cursor: pointer\">\n        <span style=\"flex: 1\"></span>\n        <button class=\"chip\" onClick=\"{{resetAcc}}\" style=\"border: none; background: #1B1B24; color: #C9C9D6; cursor: pointer\">Padrão</button>\n      </div>\n      <sc-if value=\"{{basic}}\" hint-placeholder-val=\"{{ true }}\"><div>\n      <div class=\"sec-t\">Fonte</div>\n      <div class=\"opt\"><sc-for list=\"{{fonts}}\" as=\"f\" hint-placeholder-count=\"3\"><button onClick=\"{{f.pick}}\" aria-pressed=\"{{f.sel}}\" style=\"{{f.style}}\">{{f.name}}</button></sc-for></div>\n      <div class=\"sec-t\">Botões</div>\n      <div class=\"opt\"><sc-for list=\"{{shapes}}\" as=\"x\" hint-placeholder-count=\"3\"><button onClick=\"{{x.pick}}\" aria-pressed=\"{{x.sel}}\" style=\"{{x.style}}\">{{x.name}}</button></sc-for></div>\n      </div></sc-if>\n    </sc-if>\n  </div>\n  </sc-if>\n</div>\n", Component, {});
(async()=>{const d=await DC.api('me');if(d.status===401)location.href='/entrar?next='+encodeURIComponent(location.pathname+location.search);})();
</script>
</body>
