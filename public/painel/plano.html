<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { plan: 2, yearly: false, confirming: false, canceled: false }; }
  renderVals() {
    const s = this.state;
    const P = [
      { name: 'Teste Diamante', color: '#8FE3FF', m: 0, y: 0, links: 0, themes: 77, pages: 3, stats: '90 dias' },
      { name: 'Prata', color: '#C9CDD6', m: 0, y: 0, links: 3, themes: 2, pages: 1, stats: '7 dias' },
      { name: 'Ouro', color: '#F2C14E', m: 19.9, y: 199.9, links: 10, themes: 13, pages: 1, stats: '30 dias' },
      { name: 'Diamante', color: '#8FE3FF', m: 39.9, y: 399.9, links: 0, themes: 77, pages: 3, stats: '90 dias' }
    ];
    const brl = (n) => 'R$ ' + n.toFixed(2).replace('.', ',');
    const c = P[s.plan];
    const trial = s.plan === 0, free = s.plan === 1, paid = s.plan > 1;
    const pill = (sel, col) => 'height: 36px; padding: 0 12px; border-radius: 8px; cursor: pointer; font-size: 13px; ' + (sel ? 'border: 1px solid ' + col + '; background: #22222B; color: ' + col + '; font-weight: 600' : 'border: 1px solid #2A2A34; background: transparent; color: #C9C9D6');
    const used = free ? 3 : 6;
    const bar = (frac, col) => 'height: 100%; border-radius: 999px; background: ' + col + '; width: ' + Math.round(Math.min(1, frac) * 100) + '%';
    const linkFull = c.links && used >= c.links;
    const streak = 2;
    return {
      asPlan: P.map((p, i) => ({ name: p.name, sel: s.plan === i, style: pill(s.plan === i, p.color), pick: () => this.setState({ plan: i, canceled: false, confirming: false }) })),
      cur: {
        color: c.color,
        title: trial ? 'Teste Diamante' : (free ? 'Prata grátis' : c.name + ' mensal'),
        status: trial ? 'Com tudo do Diamante · termina em [DATA DE FIM DO TESTE]. Depois você continua no Prata grátis.' : (free ? 'Grátis para sempre. O que passa do limite do Prata está guardado e volta quando você assinar.' : (s.canceled ? 'Renovação cancelada · fica ativo até [DATA] e depois vai para o Prata grátis' : 'Ativo · próximo Pix de ' + brl(c.m) + ' em [DATA]')),
        payLabel: trial ? 'Assinar agora e manter o Diamante' : (free ? 'Assinar o Ouro ou o Diamante com Pix' : 'Pagar a renovação agora com Pix'),
        payHint: trial ? 'Assinando antes do fim do teste, você continua com tudo do Diamante sem passar pelo Prata.' : (free ? 'Oferta de volta: 20% de desconto no primeiro Pix se assinar nos próximos 7 dias.' : '3 dias antes de vencer mandamos um lembrete por e-mail e SMS. É só gerar o Pix e pagar. No Pix automático renova na hora; no Pix direto, envie o comprovante. Se vencer sem pagamento, sua conta volta para o Prata grátis e tudo volta quando o pagamento for confirmado.'),
        until: '[DATA]'
      },
      hasRefDays: paid,
      isPaid: paid,
      streakText: streak + ' de 3 renovações seguidas',
      streakBar: bar(streak / 3, '#D4FF3A'),
      streakNote: 'Na próxima renovação você ganha 7 dias grátis.',
      hiddenNote: free,
      usage: [
        { label: 'Links', value: c.links ? used + ' de ' + c.links : used + ' · ilimitados', bar: bar(c.links ? used / c.links : 0.1, linkFull ? '#F2C14E' : '#D4FF3A'), note: free ? '3 links a mais estão guardados e escondidos' : (linkFull ? 'Limite atingido. Suba de plano para mais links.' : 'Tudo certo'), noteColor: (free || linkFull) ? '#F2C14E' : '#A7A7B8' },
        { label: 'Páginas', value: '1 de ' + c.pages, bar: bar(1 / c.pages, '#D4FF3A'), note: c.pages > 1 ? 'Crie outras em Configurações' : 'Até 3 páginas no Diamante', noteColor: '#A7A7B8' },
        { label: 'Temas liberados', value: String(c.themes) + (c.themes === 77 ? ' + tema próprio' : ''), bar: bar(c.themes / 77, '#D4FF3A'), note: c.themes === 77 ? 'Todos os temas, inclusive os novos' : 'Mais temas nos planos acima', noteColor: '#A7A7B8' },
        { label: 'Estatísticas', value: c.stats, bar: bar(c.themes === 77 ? 1 : s.plan === 2 ? 0.5 : 0.15, '#D4FF3A'), note: c.themes === 77 ? 'Com exportação em planilha' : (free ? 'Só o total de visitas' : 'Por link, origem, aparelho e cidade'), noteColor: '#A7A7B8' }
      ],
      others: P.slice(1).map((p, j) => {
        const i = j + 1;
        const isFreeCard = i === 1;
        return { name: p.name, color: p.color, price: isFreeCard ? 'Grátis para sempre' : brl(p.m) + '/mês ou ' + brl(p.y) + '/ano', isCurrent: i === s.plan, notCurrent: i !== s.plan,
          cta: isFreeCard ? 'Voltar para o Prata grátis' : ((trial || free) ? 'Assinar ' + p.name : (i > s.plan ? 'Subir para ' + p.name : 'Mudar para ' + p.name)),
          hint: i === 1 ? 'Até 3 links, 2 temas e total de visitas da semana.' : i === 2 ? 'Até 10 links, todos os blocos, 13 temas, vídeos e estatísticas de 30 dias.' : 'Tudo liberado: links ilimitados, 77 temas, tema próprio, 3 páginas e domínio próprio.' };
      }),
      history: paid ? [
        { d: '[DATA]', t: 'Plano ' + c.name + ' mensal', v: brl(c.m) },
        { d: '[DATA]', t: 'Plano ' + c.name + ' mensal', v: brl(c.m) },
        { d: '[DATA]', t: 'Plano ' + c.name + ' mensal', v: brl(c.m) }
      ] : [],
      noHistory: !paid,
      noHistoryText: trial ? 'Nenhum pagamento ainda. Você está no teste do Diamante.' : 'Nenhum pagamento ainda. Você está no Prata grátis.',
      notCanceled: !s.canceled && paid, canceled: s.canceled && paid,
      confirming: s.confirming, notConfirming: !s.confirming,
      askCancel: () => this.setState({ confirming: true }),
      keep: () => this.setState({ confirming: false }),
      doCancel: () => this.setState({ canceled: true, confirming: false }),
      undo: () => this.setState({ canceled: false })
    };
  }
}

r.color}}\">{{cur.title}}</span>\n        <span style=\"font-size: 15px; color: #C9C9D6\">{{cur.status}}</span>\n        <sc-if value=\"{{hasRefDays}}\" hint-placeholder-val=\"{{ true }}\">\n          <span style=\"font-size: 14px; color: #D4FF3A\">+15 dias de indicação já somados ao vencimento</span>\n        </sc-if>\n      </div>\n      <div style=\"flex: 1 1 280px; display: flex; flex-direction: column; gap: 10px\">\n        <a href=\"Pagamento.dc.html\" style=\"height: 52px; border-radius: 14px; background: #D4FF3A; color: #0E0E14; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; text-decoration: none\">{{cur.payLabel}}</a>\n        <span style=\"font-size: 13px; color: #A7A7B8; line-height: 1.5\">{{cur.payHint}}</span>\n      </div>\n    </section>\n\n    <section aria-label=\"Uso do plano\" style=\"padding: 22px; border-radius: 20px; background: #14141B; border: 1px solid #22222B; display: flex; flex-direction: column; gap: 14px\">\n      <h2 style=\"margin: 0; font-size: 18px; font-weight: 600\">O que você está usando</h2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px\">\n        <sc-for list=\"{{usage}}\" as=\"u\" hint-placeholder-count=\"4\">\n          <div style=\"padding: 16px; border-radius: 14px; background: #0E0E14; display: flex; flex-direction: column; gap: 8px\">\n            <div style=\"display: flex; justify-content: space-between; font-size: 14px\"><span style=\"color: #C9C9D6\">{{u.label}}</span><span style=\"font-weight: 600\">{{u.value}}</span></div>\n            <div style=\"height: 8px; border-radius: 999px; background: #26262F\"><div style=\"{{u.bar}}\"></div></div>\n            <span style=\"font-size: 12px; color: {{u.noteColor}}\">{{u.note}}</span>\n          </div>\n        </sc-for>\n      </div>\n    </section>\n\n    <sc-if value=\"{{isPaid}}\" hint-placeholder-val=\"{{ true }}\">\n    <section aria-label=\"Fidelidade\" style=\"padding: 22px; border-radius: 20px; background: #14141B; border: 1px solid #3A4714; display: flex; flex-direction: column; gap: 10px\">\n      <div style=\"display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; align-items: baseline\">\n        <h2 style=\"margin: 0; font-size: 18px; font-weight: 600\">Prêmio de fidelidade</h2>\n        <span style=\"font-size: 14px; color: #D4FF3A\">{{streakText}}</span>\n      </div>\n      <div style=\"height: 10px; border-radius: 999px; background: #26262F\"><div style=\"{{streakBar}}\"></div></div>\n      <span style=\"font-size: 13px; color: #C9C9D6\">{{streakNote}} Continue renovando sem atrasar para ganhar de novo a cada 3 renovações.</span>\n    </section>\n    </sc-if>\n\n    <section aria-label=\"Trocar de plano\" style=\"padding: 22px; border-radius: 20px; background: #14141B; border: 1px solid #22222B; display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; align-items: baseline\">\n        <h2 style=\"margin: 0; font-size: 18px; font-weight: 600\">Trocar de plano</h2>\n        <a href=\"Planos.dc.html\" style=\"font-size: 13px\">Comparar planos</a>\n      </div>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px\">\n        <sc-for list=\"{{others}}\" as=\"o\" hint-placeholder-count=\"3\">\n          <div style=\"padding: 18px; border-radius: 16px; background: #0E0E14; border: 1px solid #22222B; display: flex; flex-direction: column; gap: 8px\">\n            <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: {{o.color}}\">{{o.name}}</span>\n            <span style=\"font-size: 14px; color: #C9C9D6\">{{o.price}}</span>\n            <span style=\"font-size: 13px; color: #A7A7B8; line-height: 1.5; min-height: 38px\">{{o.hint}}</span>\n            <sc-if value=\"{{o.isCurrent}}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"height: 44px; border-radius: 12px; background: #1A1A22; color: #A7A7B8; font-size: 14px; display: flex; align-items: center; justify-content: center\">Seu plano atual</span>\n            </sc-if>\n            <sc-if value=\"{{o.notCurrent}}\" hint-placeholder-val=\"{{ true }}\">\n              <a href=\"Pagamento.dc.html\" style=\"height: 44px; border-radius: 12px; border: 1px solid {{o.color}}; color: #F3F3F7; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none\">{{o.cta}}</a>\n            </sc-if>\n          </div>\n        </sc-for>\n      </div>\n      <span style=\"font-size: 12px; color: #A7A7B8; line-height: 1.5\">Subir de plano: você paga só a diferença dos dias que faltam e o plano novo libera assim que conferirmos o Pix. Descer de plano: vale a partir do próximo vencimento.</span>\n    </section>\n\n    <section aria-label=\"Pagamentos\" style=\"padding: 22px; border-radius: 20px; background: #14141B; border: 1px solid #22222B; display: flex; flex-direction: column; gap: 12px\">\n      <h2 style=\"margin: 0; font-size: 18px; font-weight: 600\">Histórico de pagamentos</h2>\n      <div style=\"overflow-x: auto\">\n        <table style=\"width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14px\">\n          <thead>\n            <tr style=\"text-align: left; color: #A7A7B8; font-size: 12px; text-transform: uppercase; letter-spacing: .05em\">\n              <th style=\"padding: 10px 8px; font-weight: 600\">Data</th>\n              <th style=\"padding: 10px 8px; font-weight: 600\">Descrição</th>\n              <th style=\"padding: 10px 8px; font-weight: 600\">Valor</th>\n              <th style=\"padding: 10px 8px; font-weight: 600\">Forma</th>\n              <th style=\"padding: 10px 8px; font-weight: 600\"><span style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Recibo</span></th>\n            </tr>\n          </thead>\n          <tbody>\n            <sc-for list=\"{{history}}\" as=\"h\" hint-placeholder-count=\"3\">\n              <tr style=\"border-top: 1px solid #22222B\">\n                <td style=\"padding: 12px 8px; color: #C9C9D6\">{{h.d}}</td>\n                <td style=\"padding: 12px 8px\">{{h.t}}</td>\n                <td style=\"padding: 12px 8px; font-weight: 600\">{{h.v}}</td>\n                <td style=\"padding: 12px 8px; color: #C9C9D6\">Pix</td>\n                <td style=\"padding: 12px 8px; text-align: right\"><a href=\"Recibo.dc.html\" style=\"font-size: 13px\">Recibo</a></td>\n              </tr>\n            </sc-for>\n          </tbody>\n        </table>\n      </div>\n      <sc-if value=\"{{noHistory}}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"font-size: 14px; color: #A7A7B8\">{{noHistoryText}}</span>\n      </sc-if>\n    </section>\n\n    <section aria-label=\"Cancelar\" style=\"padding: 22px; border-radius: 20px; background: #14141B; border: 1px solid #22222B; display: flex; flex-direction: column; gap: 12px\">\n      <h2 style=\"margin: 0; font-size: 18px; font-weight: 600\">Cancelar</h2>\n      <sc-if value=\"{{notCanceled}}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 12px\">\n          <span style=\"font-size: 14px; color: #C9C9D6; line-height: 1.5\">Se cancelar, paramos de mandar o lembrete de renovação. Você usa o plano até {{cur.until}} e depois continua no Prata grátis. O que passar do limite do Prata fica guardado caso volte.</span>\n          <sc-if value=\"{{confirming}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding: 14px; border-radius: 12px; background: #2B1610; display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n              <span style=\"flex: 1 1 260px; font-size: 14px; color: #FFB49E\">Tem certeza? Você pode voltar quando quiser.</span>\n              <button onClick=\"{{doCancel}}\" style=\"height: 44px; padding: 0 16px; border-radius: 12px; border: none; background: #FF8A6B; color: #0E0E14; font-weight: 600; font-size: 14px; cursor: pointer\">Sim, cancelar</button>\n              <button onClick=\"{{keep}}\" style=\"height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #33333E; background: transparent; color: #F3F3F7; font-size: 14px; cursor: pointer\">Manter meu plano</button>\n            </div>\n          </sc-if>\n          <sc-if value=\"{{notConfirming}}\" hint-placeholder-val=\"{{ true }}\">\n            <button onClick=\"{{askCancel}}\" style=\"align-self: flex-start; height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #33333E; background: transparent; color: #FF8A6B; font-size: 14px; cursor: pointer\">Cancelar renovação</button>\n          </sc-if>\n        </div>\n      </sc-if>\n      <sc-if value=\"{{canceled}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center\">\n          <span style=\"flex: 1 1 280px; font-size: 14px; color: #C9C9D6\">Renovação cancelada. Você usa o plano até {{cur.until}} e depois vai para o Prata grátis.</span>\n          <button onClick=\"{{undo}}\" style=\"height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #D4FF3A; background: transparent; color: #D4FF3A; font-size: 14px; cursor: pointer\">Voltar a renovar</button>\n        </div>\n      </sc-if>\n    </section>\n  </div>\n</div>\n", Component, {});
(async()=>{const d=await DC.api('me');if(d.status===401)location.href='/entrar';})();
</script>
