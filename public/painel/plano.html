<script>window.DC_LINKS={"Main.dc.html":"/","Entrar.dc.html":"/entrar","Teste.dc.html":"/entrar#cadastro","Editor.dc.html":"/painel","Aparencia.dc.html":"/painel/aparencia","Temas.dc.html":"/painel/temas","CriadorTema.dc.html":"/painel/criador-tema","Agenda.dc.html":"/painel/agendamentos","Stats.dc.html":"/painel/estatisticas","Contatos.dc.html":"/painel/contatos","Configuracoes.dc.html":"/painel/configuracoes","Indique.dc.html":"/painel/indique","MeuPlano.dc.html":"/painel/plano","Conta.dc.html":"/painel/conta","EditarLink.dc.html":"/painel","Pagamento.dc.html":"/pagamento","ConfirmarPagamento.dc.html":"/pagamento/confirmar","CentralAjuda.dc.html":"/ajuda","SuporteCliente.dc.html":"/painel/suporte","Recibo.dc.html":"/painel/recibo","Termos.dc.html":"/termos","Privacidade.dc.html":"/privacidade","Planos.dc.html":"/#precos","PaginaPublica.dc.html":"/","PaginaFechada.dc.html":"/"};</script>
<script src="/assets/dc.js"></script>
<script src="/assets/temas-list.js"></script>
<script src="/assets/planos.js"></script>
<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { d: null }; }
  async componentDidMount() {
    const d = await DC.api('billing');
    if (d.status === 401) { location.href = '/entrar'; return; }
    this.setState({ d: d.ok ? d : null });
  }
  renderVals() {
    const d = this.state.d;
    if (!d) return { loading: true, ready: false };
    const u = d.user;
    const lv = { prata: 0, ouro: 1, diamante: 2 }[u.plan] || 0;
    const C = ['#C9CDD6', '#F2C14E', '#8FE3FF'];
    const date = (t) => new Date(t).toLocaleDateString('pt-BR');
    const days = u.until ? Math.max(0, Math.ceil((u.until - Date.now()) / 86400000)) : 0;
    const o = d.open;
    let openTitle = '', openText = '', openBtn = '', openHref = '', openColor = '#24242E';
    if (o && o.status === 'aguardando') { openTitle = 'Pix aguardando pagamento'; openText = 'Pedido ' + o.code + ' · ' + o.value + ' · plano ' + o.planName + ' ' + o.periodName + '.'; openBtn = 'Pagar ou enviar comprovante'; openHref = '/pagamento?c=' + o.code; openColor = '#F2C14E'; }
    if (o && o.status === 'conferir') { openTitle = 'Comprovante em conferência'; openText = 'Recebemos o comprovante do pedido ' + o.code + '. Assim que conferirmos, seu plano é liberado.'; openBtn = 'Falar no WhatsApp'; openHref = 'https://wa.me/' + d.whatsapp + '?text=' + encodeURIComponent('Olá! Enviei o comprovante do pedido ' + o.code); openColor = '#8FE3FF'; }
    if (o && o.status === 'recusado') { openTitle = 'Comprovante recusado'; openText = (o.note || 'Não encontramos o Pix desse comprovante.') + ' Envie outro comprovante ou fale com a gente.'; openBtn = 'Enviar outro comprovante'; openHref = '/pagamento/confirmar?c=' + o.code; openColor = '#FF8A6B'; }
    const isPaid = lv > 0 && !u.trial;
    const every = d.loyalty.every || 3;
    return {
      loading: false, ready: true,
      planName: u.trial ? 'Teste Diamante' : ['Prata', 'Ouro', 'Diamante'][lv],
      planColor: C[lv],
      planSub: u.trial ? 'Faltam ' + days + (days === 1 ? ' dia' : ' dias') + '. Depois sua conta continua no Prata grátis.' : (lv === 0 ? 'Grátis para sempre' : 'Válido até ' + date(u.until)),
      hasOpen: !!o, openTitle, openText, openBtn, openHref, openColor,
      choiceTitle: isPaid ? 'Renovar ou mudar de plano' : 'Assinar',
      plans: [['ouro', 'Ouro', 1], ['diamante', 'Diamante', 2]].map((p) => ({
        name: p[1], color: C[p[2]], bg: p[2] === 1 ? 'rgba(242,193,78,.14)' : 'rgba(143,227,255,.14)',
        price: d.prices[p[0] + '_m'].label + '/mês ou ' + d.prices[p[0] + '_y'].label + '/ano',
        cta: lv === p[2] && !u.trial ? 'Renovar' : 'Assinar',
        href: '/pagamento?p=' + p[0],
        style: lv === p[2] && !u.trial ? 'border-color: ' + C[p[2]] : '',
        items: (window.WL_PLANOS || {})[p[0]] || []
      })),
      myItems: (window.WL_PLANOS || {})[u.trial ? 'diamante' : ['prata', 'ouro', 'diamante'][lv]] || [],
      showPrata: u.trial || lv > 0, prataItems: (window.WL_PLANOS || {}).prata || [],
      isPaid: isPaid,
      loyaltyText: 'A cada ' + every + ' renovações seguidas, você ganha ' + d.loyalty.days + ' dias grátis. ' + d.loyalty.count + ' de ' + every + '.',
      dots: Array.from({ length: every }, (_, i) => i < d.loyalty.count ? 'background: #D4FF3A' : ''),
      hasHist: d.history.length > 0,
      hist: d.history.map((h) => ({ title: 'Plano ' + h.planName + ' ' + h.periodName + ' · ' + h.value, sub: 'Pago em ' + date(h.paidAt) + ' · pedido ' + h.code, href: '/painel/recibo?c=' + h.code }))
    };
  }
}

DC.mount(document.getElementById('root'), "\n<div>\n  <div class=\"appbar\"><a class=\"icon-btn\" href=\"/painel/mais\" aria-label=\"Voltar\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M15 5l-7 7 7 7\"/></svg></a><h1>Meu plano</h1></div>\n  <sc-if value=\"{{loading}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"app-main\" style=\"color: #9C9CAD; padding-top: 40px\">Carregando…</div></sc-if>\n  <sc-if value=\"{{ready}}\" hint-placeholder-val=\"{{ true }}\">\n  <div class=\"app-main\">\n    <div class=\"card pc\" style=\"border-color: {{planColor}}\">\n      <span style=\"font-size: 13px; color: #9C9CAD\">Seu plano</span>\n      <span class=\"big\" style=\"color: {{planColor}}\">{{planName}}</span>\n      <span style=\"font-size: 15px; color: #C9C9D6\">{{planSub}}</span>\n      <ul class=\"bf\" aria-label=\"O que seu plano tem\"><sc-for list=\"{{myItems}}\" as=\"it\" hint-placeholder-count=\"4\"><li>{{it}}</li></sc-for></ul>\n    </div>\n\n    <sc-if value=\"{{hasOpen}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"card\" style=\"margin-top: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; border-color: {{openColor}}\">\n        <b style=\"font-size: 16px\">{{openTitle}}</b>\n        <span style=\"font-size: 14px; color: #C9C9D6; line-height: 1.5\">{{openText}}</span>\n        <a class=\"btn\" href=\"{{openHref}}\">{{openBtn}}</a>\n      </div>\n    </sc-if>\n\n    <div class=\"sec-t\">{{choiceTitle}}</div>\n    <div style=\"display: flex; flex-direction: column; gap: 10px\">\n      <sc-for list=\"{{plans}}\" as=\"p\" hint-placeholder-count=\"2\">\n        <a class=\"plan-opt\" href=\"{{p.href}}\" style=\"{{p.style}}\">\n          <span style=\"width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: {{p.bg}}; color: {{p.color}}; flex: none\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linejoin=\"round\"><path d=\"M3 8l4 4 5-7 5 7 4-4-2 11H5z\"/></svg></span>\n          <span style=\"flex: 1; display: flex; flex-direction: column; gap: 3px\"><b style=\"font-size: 17px; color: {{p.color}}\">{{p.name}}</b><span style=\"font-size: 14px; color: #9C9CAD\">{{p.price}}</span></span>\n          <span class=\"btn\" style=\"height: 40px; padding: 0 16px; font-size: 14px; background: {{p.color}}\">{{p.cta}}</span>\n        </a>\n        <ul class=\"bf card\" style=\"padding: 14px 16px 14px 16px; margin: -4px 0 6px\" aria-label=\"Benefícios do {{p.name}}\"><sc-for list=\"{{p.items}}\" as=\"it\" hint-placeholder-count=\"5\"><li>{{it}}</li></sc-for></ul>\n      </sc-for>\n    </div>\n    <sc-if value=\"{{showPrata}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"sec-t\">Prata (grátis)</div>\n      <ul class=\"bf card\" style=\"padding: 14px 16px\" aria-label=\"Benefícios do Prata\"><sc-for list=\"{{prataItems}}\" as=\"it\" hint-placeholder-count=\"5\"><li>{{it}}</li></sc-for></ul>\n    </sc-if>\n\n    <sc-if value=\"{{isPaid}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"sec-t\">Prêmio de fidelidade</div>\n      <div class=\"card\" style=\"padding: 16px\">\n        <span style=\"font-size: 15px; color: #C9C9D6\">{{loyaltyText}}</span>\n        <div class=\"dots\"><sc-for list=\"{{dots}}\" as=\"d\" hint-placeholder-count=\"3\"><span style=\"{{d}}\"></span></sc-for></div>\n      </div>\n    </sc-if>\n\n    <sc-if value=\"{{hasHist}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"sec-t\">Pagamentos</div>\n      <div class=\"list\">\n        <sc-for list=\"{{hist}}\" as=\"h\" hint-placeholder-count=\"2\">\n          <a class=\"row\" href=\"{{h.href}}\"><span class=\"row-tx\"><b>{{h.title}}</b><span>{{h.sub}}</span></span><span style=\"font-size: 13px; color: #D4FF3A\">Recibo</span></a>\n        </sc-for>\n      </div>\n    </sc-if>\n  </div>\n  </sc-if>\n</div>\n", Component, {});
(async()=>{const d=await DC.api('me');if(d.status===401)location.href='/entrar?next='+encodeURIComponent(location.pathname+location.search);})();
</script>
</body>
</html>
