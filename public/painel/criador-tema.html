.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

.opt button[aria-pressed="true"]{border-color:#D4FF3A;background:rgba(212,255,58,.12);color:#F3F3F7;font-weight:600}
.presets{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.presets button{flex:none;width:58px;height:58px;border-radius:18px;border:2px solid #24242E;cursor:pointer}
@media (min-width:900px){.cr{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start}.stage{position:sticky;top:80px}}
</style>

<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { d: null, c: null, saved: '', tab: 'fundo', newName: '', bgErr: '' }; }
  async componentDidMount() {
    const d = await DC.api('editor');
    if (d.status === 401) { location.href = '/entrar'; return; }
    const a = d.appearance || {};
    this.setState({ d: d, c: window.WL_cleanCustom(a.custom || {}) });
  }
  set(p) {
    this.setState({ c: Object.assign({}, this.state.c, p), saved: '' });
    if (this.state.d.appearance.useCustom) { clearTimeout(this.t); this.t = setTimeout(() => this.save(true), 600); }
  }
  async put(patch) {
    const d = this.state.d;
    d.appearance = Object.assign({}, d.appearance, patch);
    const r = await DC.api('appearance', 'PUT', { appearance: patch });
    this.setState({ d: d, saved: r.ok ? 'Salvo ✓' : (r.error || 'Não salvou') });
    return r;
  }
  save(on) { return this.put({ custom: this.state.c, useCustom: on }); }
  renderVals() {
    const s = this.state, d = s.d, c = s.c;
    if (!d) return { loading: true };
    const lvl = { prata: 0, ouro: 1, diamante: 2 }[d.user.plan] || 0;
    if (lvl < 2) return { loading: false, locked: true };
    const F = window.WL_CUSTOM_FONTS;
    const P = [
      ['Uva', { bg1: '#3b1a6e', bg2: '#0b0b10', grad: 1, text: '#f3f3f7', btn: '#d4ff3a', btnText: '#0e0e14', style: 0, card: '#ffffff', cardOp: 10 }],
      ['Pêssego', { bg1: '#ffd6c2', bg2: '#ff9a8b', grad: 2, text: '#3a1a14', btn: '#3a1a14', btnText: '#ffe9df', style: 0, card: '#ffffff', cardOp: 45 }],
      ['Menta', { bg1: '#e6fff5', bg2: '#b5f2dc', grad: 1, text: '#0c3a2c', btn: '#0c3a2c', btnText: '#e6fff5', style: 1, card: '#ffffff', cardOp: 55 }],
      ['Oceano', { bg1: '#1d6fa3', bg2: '#06222b', grad: 3, text: '#eaf7ff', btn: '#ffffff', btnText: '#06222b', style: 2, card: '#ffffff', cardOp: 12 }],
      ['Ouro', { bg1: '#1a1408', bg2: '#000000', grad: 1, text: '#f6e7c1', btn: '#d9b45a', btnText: '#1a1408', style: 1, card: '#d9b45a', cardOp: 10 }],
      ['Chiclete', { bg1: '#ff5fa2', bg2: '#7a3cff', grad: 2, text: '#ffffff', btn: '#ffffff', btnText: '#7a3cff', style: 0, card: '#ffffff', cardOp: 16 }]
    ];
    const setter = (k, num) => (e) => this.set({ [k]: num ? parseInt(e.target.value, 10) : e.target.value });
    const ch = (k, names) => names.map((n, i) => ({ name: n, sel: c[k] === i, pick: () => this.set({ [k]: i }) }));
    const a = d.appearance || {}, active = !!a.useCustom, saved = a.saved || [];
    const title = d.profile.title || 'W';
    const ini = title.split(/\s+/).map((w) => w[0] || '').join('').slice(0, 2).toUpperCase();
    return {
      loading: false, ok: true, saved: s.saved, css: DC.html(window.WL_customCss(c)), c: c, active: active,
      name: title, handle: (d.page && d.page.handle) || d.user.handle,
      avHtml: DC.html(a.avatar ? '<div class="ph-av has-img"><img src="/m/' + a.avatar + '" alt=""></div>' : '<div class="ph-av">' + ini.replace(/[<>&]/g, '') + '</div>'),
      presets: P.map((p) => ({ name: p[0], st: 'background: linear-gradient(135deg,' + p[1].bg1 + ',' + p[1].bg2 + '); border-color: ' + p[1].btn, pick: () => this.set(Object.assign({ bgImg: '', pattern: 0 }, p[1])) })),
      hasMine: saved.length > 0,
      mine: saved.map((m, i) => ({ name: m.name, st: 'background: linear-gradient(135deg,' + m.c.bg1 + ',' + m.c.bg2 + ')', load: () => this.set(window.WL_cleanCustom(m.c)),
        del: () => { if (confirm('Apagar o tema "' + m.name + '"?')) this.put({ saved: saved.filter((x, j) => j !== i) }); } })),
      tabs: [['fundo', 'Fundo'], ['cores', 'Cores'], ['pos', 'Posição'], ['bot', 'Botões'], ['fonte', 'Fonte']].map((t) => ({ name: t[1], sel: s.tab === t[0], pick: () => this.setState({ tab: t[0] }) })),
      tFundo: s.tab === 'fundo', tCores: s.tab === 'cores', tPos: s.tab === 'pos', tBot: s.tab === 'bot', tFonte: s.tab === 'fonte',
      hasBg: !!c.bgImg, bgLabel: c.bgImg ? 'Trocar foto' : 'Usar foto do celular', bgErr: s.bgErr,
      pickBg: async () => { const r = await DC.pickImage({ max: 1600 }); if (!r) return; if (!r.ok) { this.setState({ bgErr: r.error || 'Não foi possível enviar a foto.' }); return; } this.setState({ bgErr: '' }); this.set({ bgImg: r.id }); },
      rmBg: () => this.set({ bgImg: '' }),
      set_bgDim: setter('bgDim', 1), set_cardOp: setter('cardOp', 1),
      blurs: ch('bgBlur', ['Não', 'Sim']), patterns: ch('pattern', ['Nenhuma', 'Pontos', 'Grade', 'Listras']),
      set_bg1: setter('bg1'), set_bg2: setter('bg2'), set_text: setter('text'), set_btn: setter('btn'), set_btnText: setter('btnText'), set_card: setter('card'),
      grads: ch('grad', ['Liso', 'Vertical', 'Diagonal', 'Brilho']),
      posGroups: [['Perfil (foto, nome e descrição)', 'head', ['No centro', 'À esquerda', 'Foto ao lado do nome']], ['Onde fica o perfil', 'infoPos', ['Em cima dos links', 'Embaixo dos links']],
        ['Foto de perfil', 'avShape', ['Redonda', 'Quadrada', 'Sem foto']], ['Links', 'layout', ['Um embaixo do outro', 'Duas colunas']],
        ['Texto dos botões', 'align', ['No centro', 'À esquerda']], ['Espaço entre os itens', 'gap', ['Junto', 'Normal', 'Solto']], ['Mostrar o @', 'handle', ['Não', 'Sim']]]
        .map((g) => ({ title: g[0], opts: ch(g[1], g[2]) })),
      styles: ch('style', ['Cheio', 'Contorno', 'Vidro']),
      radii: [['Reto', '6px'], ['Suave', '16px'], ['Pílula', '999px']].map((x, i) => ({ name: x[0], sel: c.radius === i, st: 'border-radius: ' + x[1], pick: () => this.set({ radius: i }) })),
      shadows: ch('shadow', ['Sem sombra', 'Com sombra']), iconsO: ch('icons', ['Não', 'Sim']),
      fonts: F.map((f, i) => ({ name: f, sel: c.font === i, st: "font-family: '" + f + "'", pick: () => this.set({ font: i }) })),
      newName: s.newName, setNewName: (e) => this.setState({ newName: e.target.value }),
      saveNew: async () => {
        if (saved.length >= 8) { this.setState({ saved: 'Máximo de 8 temas. Apague um.' }); return; }
        const nm = (s.newName || '').trim() || 'Meu tema ' + (saved.length + 1);
        await this.put({ saved: saved.concat([{ name: nm, c: c }]) }); this.setState({ newName: '' });
      },
      useLabel: active ? 'Salvar alterações' : 'Usar este tema na minha página',
      use: () => this.save(true)
    };
  }
}

DC.mount(document.getElementById('root'), "\n<div>\n  <div class=\"appbar\"><a class=\"icon-btn\" href=\"/painel/aparencia\" aria-label=\"Voltar\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M15 5l-7 7 7 7\"/></svg></a><h1>Criador de tema</h1><button class=\"hq\" data-help=\"criador\" aria-label=\"Ajuda\">?</button><span role=\"status\" style=\"font-size: 12.5px; color: #D4FF3A; padding-right: 10px\">{{saved}}</span></div>\n  <div class=\"app-main\">\n    <sc-if value=\"{{loading}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color: #9C9CAD; padding-top: 30px\">Carregando…</div></sc-if>\n    <sc-if value=\"{{locked}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"card\" style=\"padding: 22px; display: flex; flex-direction: column; gap: 12px; text-align: center; align-items: center; margin-top: 10px\">\n        <b style=\"font-size: 18px\">Crie um tema só seu</b>\n        <span style=\"font-size: 14px; color: #C9C9D6; line-height: 1.5\">Escolha cores, fundo, fonte e botões do jeito que quiser. O Criador de tema é do Diamante.</span>\n        <a class=\"btn full\" href=\"/painel/plano\" style=\"background: #8FE3FF\">Conhecer o Diamante</a>\n      </div>\n    </sc-if>\n    <sc-if value=\"{{ok}}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"cr\">\n      <div>\n        <style>{{css}}</style>\n        <div class=\"stage\"><div class=\"ph t-custom\"><div class=\"ph-bg\"></div><div class=\"ph-in\"><div class=\"ph-head\">{{avHtml}}<div class=\"ph-name\">{{name}}</div><div class=\"ph-handle\">@{{handle}}</div><div class=\"ph-bio\">Sua página, do seu jeito</div></div><div class=\"ph-btn main\">Meu link principal</div><div class=\"ph-btn\">Instagram</div><div class=\"ph-btn\">WhatsApp</div><div class=\"ph-btn\">Loja</div><div class=\"ph-card\" style=\"padding: 12px; font-size: 13px\">Bloco de texto</div><div class=\"ph-foot\"></div></div></div></div>\n        <a href=\"/painel/computador\" style=\"display: block; text-align: center; font-size: 13.5px; color: #8FE3FF; margin-top: 8px\">🖥️ Ver como fica no computador</a>\n      </div>\n      <div>\n        <div class=\"sec-t\" style=\"margin-top: 8px\">Começar de um modelo<button class=\"hq\" data-help=\"criador\" aria-label=\"Ajuda\">?</button></div>\n        <div class=\"presets\"><sc-for list=\"{{presets}}\" as=\"p\" hint-placeholder-count=\"6\"><button onClick=\"{{p.pick}}\" style=\"{{p.st}}\" aria-label=\"{{p.name}}\"></button></sc-for></div>\n        <sc-if value=\"{{hasMine}}\" hint-placeholder-val=\"{{ false }}\"><div><div class=\"sub\">Meus temas salvos</div><div class=\"mine\"><sc-for list=\"{{mine}}\" as=\"m\" hint-placeholder-count=\"2\"><span><button onClick=\"{{m.load}}\"><i style=\"{{m.st}}\"></i>{{m.name}}</button><button class=\"x\" onClick=\"{{m.del}}\" aria-label=\"Apagar {{m.name}}\">×</button></span></sc-for></div></div></sc-if>\n        <div class=\"tabs\" role=\"tablist\"><sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"5\"><button onClick=\"{{t.pick}}\" aria-pressed=\"{{t.sel}}\">{{t.name}}</button></sc-for></div>\n\n        <sc-if value=\"{{tFundo}}\" hint-placeholder-val=\"{{ true }}\"><div>\n          <div class=\"sec-t\">Foto de fundo<button class=\"hq\" data-help=\"criadorfundo\" aria-label=\"Ajuda\">?</button></div>\n          <div style=\"display: flex; gap: 10px\"><button class=\"btn ghost\" onClick=\"{{pickBg}}\" style=\"flex: 1\">📷 {{bgLabel}}</button><sc-if value=\"{{hasBg}}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn ghost\" onClick=\"{{rmBg}}\">Remover</button></sc-if></div>\n          <sc-if value=\"{{bgErr}}\" hint-placeholder-val=\"{{ false }}\"><p style=\"color: #FF8A6B; font-size: 13px\">{{bgErr}}</p></sc-if>\n          <sc-if value=\"{{hasBg}}\" hint-placeholder-val=\"{{ false }}\"><div>\n            <label class=\"rng\">Escurecer<input type=\"range\" min=\"0\" max=\"85\" value=\"{{c.bgDim}}\" onInput=\"{{set_bgDim}}\" aria-label=\"Escurecer a foto\"><b style=\"width: 38px\">{{c.bgDim}}%</b></label>\n            <div class=\"sub\">Desfocar a foto</div><div class=\"opt\"><sc-for list=\"{{blurs}}\" as=\"o\" hint-placeholder-count=\"2\"><button onClick=\"{{o.pick}}\" aria-pressed=\"{{o.sel}}\">{{o.name}}</button></sc-for></div>\n          </div></sc-if>\n          <div class=\"sec-t\">Cores do fundo</div>\n          <div class=\"cols\" style=\"grid-template-columns: repeat(2, minmax(0, 1fr))\"><label class=\"cbox\">Cor 1<input type=\"color\" value=\"{{c.bg1}}\" onInput=\"{{set_bg1}}\"></label><label class=\"cbox\">Cor 2<input type=\"color\" value=\"{{c.bg2}}\" onInput=\"{{set_bg2}}\"></label></div>\n          <div class=\"opt\" style=\"margin-top: 10px\"><sc-for list=\"{{grads}}\" as=\"o\" hint-placeholder-count=\"4\"><button onClick=\"{{o.pick}}\" aria-pressed=\"{{o.sel}}\">{{o.name}}</button></sc-for></div>\n          <div class=\"sub\">Textura</div><div class=\"opt\"><sc-for list=\"{{patterns}}\" as=\"o\" hint-placeholder-count=\"4\"><button onClick=\"{{o.pick}}\" aria-pressed=\"{{o.sel}}\">{{o.name}}</button></sc-for></div>\n        </div></sc-if>\n\n        <sc-if value=\"{{tCores}}\" hint-placeholder-val=\"{{ false }}\"><div>\n          <div class=\"sec-t\">Cores</div>\n          <div class=\"cols\"><label class=\"cbox\">Texto<input type=\"color\" value=\"{{c.text}}\" onInput=\"{{set_text}}\"></label><label class=\"cbox\">Botão<input type=\"color\" value=\"{{c.btn}}\" onInput=\"{{set_btn}}\"></label><label class=\"cbox\">Texto do botão<input type=\"color\" value=\"{{c.btnText}}\" onInput=\"{{set_btnText}}\"></label></div>\n          <div class=\"sec-t\">Blocos (texto, produtos, formulários)</div>\n          <div class=\"cols\" style=\"grid-template-columns: 90px 1fr; align-items: center\"><label class=\"cbox\">Cor<input type=\"color\" value=\"{{c.card}}\" onInput=\"{{set_card}}\"></label><label class=\"rng\" style=\"margin: 0\">Força<input type=\"range\" min=\"0\" max=\"100\" value=\"{{c.cardOp}}\" onInput=\"{{set_cardOp}}\" aria-label=\"Força da cor dos blocos\"><b style=\"width: 38px\">{{c.cardOp}}%</b></label></div>\n        </div></sc-if>\n\n        <sc-if value=\"{{tPos}}\" hint-placeholder-val=\"{{ false }}\"><div>\n          <div class=\"sec-t\">Posição das informações<button class=\"hq\" data-help=\"criadorlayout\" aria-label=\"Ajuda\">?</button></div>\n          <sc-for list=\"{{posGroups}}\" as=\"g\" hint-placeholder-count=\"7\"><div><div class=\"sub\">{{g.title}}</div><div class=\"opt\"><sc-for list=\"{{g.opts}}\" as=\"o\" hint-placeholder-count=\"3\"><button onClick=\"{{o.pick}}\" aria-pressed=\"{{o.sel}}\">{{o.name}}</button></sc-for></div></div></sc-for>\n        </div></sc-if>\n\n        <sc-if value=\"{{tBot}}\" hint-placeholder-val=\"{{ false }}\"><div>\n          <div class=\"sec-t\">Botões</div>\n          <div class=\"opt\"><sc-for list=\"{{styles}}\" as=\"o\" hint-placeholder-count=\"3\"><button onClick=\"{{o.pick}}\" aria-pressed=\"{{o.sel}}\">{{o.name}}</button></sc-for></div>\n          <div class=\"sub\">Cantos</div><div class=\"opt\"><sc-for list=\"{{radii}}\" as=\"o\" hint-placeholder-count=\"3\"><button onClick=\"{{o.pick}}\" aria-pressed=\"{{o.sel}}\" style=\"{{o.st}}\">{{o.name}}</button></sc-for></div>\n          <div class=\"sub\">Sombra</div><div class=\"opt\"><sc-for list=\"{{shadows}}\" as=\"o\" hint-placeholder-count=\"2\"><button onClick=\"{{o.pick}}\" aria-pressed=\"{{o.sel}}\">{{o.name}}</button></sc-for></div>\n          <div class=\"sub\">Setinha › nos botões</div><div class=\"opt\"><sc-for list=\"{{iconsO}}\" as=\"o\" hint-placeholder-count=\"2\"><button onClick=\"{{o.pick}}\" aria-pressed=\"{{o.sel}}\">{{o.name}}</button></sc-for></div>\n        </div></sc-if>\n\n        <sc-if value=\"{{tFonte}}\" hint-placeholder-val=\"{{ false }}\"><div>\n          <div class=\"sec-t\">Fonte</div>\n          <div class=\"opt\"><sc-for list=\"{{fonts}}\" as=\"o\" hint-placeholder-count=\"12\"><button onClick=\"{{o.pick}}\" aria-pressed=\"{{o.sel}}\" style=\"{{o.st}}\">{{o.name}}</button></sc-for></div>\n        </div></sc-if>\n\n        <div class=\"sec-t\">Guardar este tema</div>\n        <div style=\"display: flex; gap: 8px\"><input class=\"inp\" value=\"{{newName}}\" onInput=\"{{setNewName}}\" maxlength=\"30\" placeholder=\"Nome do tema\" aria-label=\"Nome do tema\" style=\"flex: 1\"><button class=\"btn ghost\" onClick=\"{{saveNew}}\">Salvar</button></div>\n        <button class=\"btn full\" onClick=\"{{use}}\" style=\"margin-top: 22px\">{{useLabel}}</button>\n        <sc-if value=\"{{active}}\" hint-placeholder-val=\"{{ false }}\"><p style=\"text-align: center; font-size: 13px; color: #9C9CAD; margin-top: 10px\">Para voltar a um tema pronto, escolha um em <a href=\"/painel/temas\">Temas</a>.</p></sc-if>\n      </div>\n    </div>\n    </sc-if>\n  </div>\n</div>\n", Component, {});
