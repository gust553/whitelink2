.tg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.tc{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px 12px;border-radius:20px;background:#14141B;border:2px solid #24242E;cursor:pointer;font-family:inherit;color:#F3F3F7}

.mini{width:146px;height:300px;overflow:hidden;border-radius:22px;position:relative;pointer-events:none}
.mini .ph{transform:scale(.43);transform-origin:top left}
.big{width:272px;height:560px;overflow:hidden;border-radius:38px;margin:0 auto;pointer-events:none}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}

.chips button{flex:none;height:38px;padding:0 16px;border-radius:999px;border:1px solid #2A2A34;background:#14141B;color:#C9C9D6;font-size:14px;cursor:pointer;font-family:inherit}
.chips button[aria-pressed="true"]{background:#F3F3F7;color:#0E0E14;border-color:#F3F3F7;font-weight:600}
.tier{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.lockb{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(14,14,20,.85);display:flex;align-items:center;justify-content:center}

<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: 0, sel: null, ap: {}, user: null, toast: '' }; }
  async componentDidMount() {
    const d = await DC.api('editor');
    if (d.status === 401) { location.href = '/entrar'; return; }
    if (d.ok) this.setState({ user: d.user, ap: d.appearance || {}, title: d.profile.title });
  }
  async use(key) {
    const ap = Object.assign({}, this.state.ap, { tk: key });
    this.setState({ ap: ap, sel: null, toast: 'Tema aplicado na sua página!' });
    await DC.api('appearance', 'PUT', { appearance: ap });
    clearTimeout(this.t); this.t = setTimeout(() => this.setState({ toast: '' }), 2000);
  }
  renderVals() {
    const s = this.state;
    const T = window.WL_TEMAS || [];
    const u = s.user || { plan: 'prata', instagram: 'seuperfil', name: 'Seu Nome' };
    const lvl = { prata: 0, ouro: 1, diamante: 2 }[u.plan] || 0;
    const tierN = ['Prata', 'Ouro', 'Diamante'], tierC = ['#C9CDD6', '#F2C14E', '#8FE3FF'];
    const curKey = s.ap.tk || ['noite', 'papel', 'oceano', 'brasa'][s.ap.theme || 0] || 'noite';
    const F = ['Todos', 'Liberados para mim', 'Ouro', 'Diamante'];
    const list = T.filter((t) => s.f === 0 || (s.f === 1 ? t[2] <= lvl : t[2] === s.f - 1));
    const c = T.find((t) => t[1] === s.sel);
    const title = s.title || u.name || 'Seu Nome';
    return {
      name: title, ig: u.instagram, ini: title.split(/\s+/).map((w) => w[0] || '').join('').slice(0, 2).toUpperCase(),
      filters: F.map((n, i) => ({ name: n, sel: s.f === i, pick: () => this.setState({ f: i }) })),
      themes: list.map((t) => ({
        name: t[0], tcls: 't-' + t[1], locked: t[2] > lvl, inUse: t[1] === curKey,
        cls: 'tc' + (t[1] === curKey ? ' on' : ''),
        open: () => this.setState({ sel: t[1] })
      })),
      sheet: !!c,
      cur: c ? {
        name: c[0], desc: c[3], tcls: 't-' + c[1], tier: tierN[c[2]],
        tierStyle: 'border: 1px solid ' + tierC[c[2]] + '; color: ' + tierC[c[2]],
        canUse: c[2] <= lvl, locked: c[2] > lvl,
        useLabel: c[1] === curKey ? 'Tema em uso ✓' : 'Usar este tema',
        lockStyle: 'background: ' + tierC[c[2]] + '; color: #0E0E14'
      } : {},
      use: () => { if (c && c[2] <= lvl) this.use(c[1]); },
      close: () => this.setState({ sel: null }),
      stop: (e) => e.stopPropagation(),
      toast: s.toast
    };
  }
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
DC.mount(document.getElementById('root'), "\n<div>\n  <div class=\"appbar\">\n    <a class=\"icon-btn\" href=\"/painel/aparencia\" aria-label=\"Voltar\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M15 5l-7 7 7 7\"/></svg></a>\n    <h1>Temas</h1><button class=\"hq\" data-help=\"temas\" aria-label=\"Ajuda\">?</button>\n  </div>\n  <div class=\"app-main\" style=\"max-width: 1100px\">\n    <div class=\"chips\" role=\"group\" aria-label=\"Filtrar\">\n      <sc-for list=\"{{filters}}\" as=\"f\" hint-placeholder-count=\"4\"><button onClick=\"{{f.pick}}\" aria-pressed=\"{{f.sel}}\">{{f.name}}</button></sc-for>\n    </div>\n    <div class=\"tg\">\n      <sc-for list=\"{{themes}}\" as=\"t\" hint-placeholder-count=\"12\">\n        <button class=\"{{t.cls}}\" onClick=\"{{t.open}}\" aria-label=\"Tema {{t.name}}\">\n          <div class=\"mini\">\n            <div class=\"ph {{t.tcls}}\"><div class=\"ph-bg\"></div><div class=\"ph-tag\">NOVO!</div><div class=\"ph-in\"><div class=\"ph-head\"><div class=\"ph-av\">{{ini}}</div><div class=\"ph-name\">{{name}}</div><div class=\"ph-handle\">@{{ig}}</div><div class=\"ph-orn\"></div></div><div class=\"ph-btn main\">Meu link principal</div><div class=\"ph-btn\">Minha loja</div><div class=\"ph-btn\">Fale comigo</div><div class=\"ph-card\"><div class=\"ph-thumb\"></div><div class=\"ph-ct\"><b>Produto</b><span>R$ 99</span></div></div></div></div>\n          </div>\n          <span style=\"display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600\">{{t.name}}</span>\n          <sc-if value=\"{{t.locked}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"lockb\"><svg viewBox=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"#F3F3F7\" stroke-width=\"2\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"/><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"/></svg></span></sc-if>\n          <sc-if value=\"{{t.inUse}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"chip\" style=\"position: absolute; top: 10px; left: 10px; height: 24px; font-size: 11px; background: #D4FF3A; color: #0E0E14\">Em uso</span></sc-if>\n        </button>\n      </sc-for>\n    </div>\n  </div>\n\n  <sc-if value=\"{{sheet}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"scrim\" onClick=\"{{close}}\">\n      <div class=\"sheet\" onClick=\"{{stop}}\">\n        <div class=\"grab\"></div>\n        <div class=\"big\">\n          <div class=\"ph {{cur.tcls}}\"><div class=\"ph-bg\"></div><div class=\"ph-tag\">NOVO!</div><div class=\"ph-in\"><div class=\"ph-head\"><div class=\"ph-av\">{{ini}}</div><div class=\"ph-name\">{{name}}</div><div class=\"ph-handle\">@{{ig}}</div><div class=\"ph-bio\">Sua descrição aparece aqui</div><div class=\"ph-orn\"></div></div><div class=\"ph-btn main\">Meu link principal</div><div class=\"ph-btn\">Minha loja</div><div class=\"ph-btn\">Fale comigo</div><div class=\"ph-card\"><div class=\"ph-thumb\"></div><div class=\"ph-ct\"><b>Produto</b><span>R$ 99</span></div></div><div class=\"ph-foot\">WhiteLink</div></div></div>\n        </div>\n        <div style=\"display: flex; align-items: center; gap: 8px; margin-top: 16px\">\n          <h2 style=\"margin: 0; flex: 1\">{{cur.name}}</h2>\n          <span class=\"tier\" style=\"{{cur.tierStyle}}\">{{cur.tier}}</span>\n        </div>\n        <p style=\"margin: 6px 0 16px; color: #9C9CAD; font-size: 15px\">{{cur.desc}}</p>\n        <sc-if value=\"{{cur.canUse}}\" hint-placeholder-val=\"{{ true }}\">\n          <button class=\"btn full\" onClick=\"{{use}}\">{{cur.useLabel}}</button>\n        </sc-if>\n        <sc-if value=\"{{cur.locked}}\" hint-placeholder-val=\"{{ false }}\">\n          <a class=\"btn full\" href=\"MeuPlano.dc.html\" style=\"{{cur.lockStyle}}\">Liberar no {{cur.tier}}</a>\n        </sc-if>\n      </div>\n    </div>\n  </sc-if>\n  <sc-if value=\"{{toast}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"toast\" role=\"status\">{{toast}}</div></sc-if>\n</div>\n", Component, {});
(async()=>{const d=await DC.api('me');if(d.status===401)location.href='/entrar?next='+encodeURIComponent(location.pathname+location.search);})();
</script>
