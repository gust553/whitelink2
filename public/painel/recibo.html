<script>window.DC_LINKS={"Main.dc.html":"/","Entrar.dc.html":"/entrar","Teste.dc.html":"/entrar#cadastro","Editor.dc.html":"/painel","Aparencia.dc.html":"/painel/aparencia","Temas.dc.html":"/painel/temas","CriadorTema.dc.html":"/painel/criador-tema","Agenda.dc.html":"/painel/agendamentos","Stats.dc.html":"/painel/estatisticas","Contatos.dc.html":"/painel/clientes","Configuracoes.dc.html":"/painel/configuracoes","Indique.dc.html":"/painel/indique","MeuPlano.dc.html":"/painel/plano","Conta.dc.html":"/painel/conta","EditarLink.dc.html":"/painel","Pagamento.dc.html":"/pagamento","ConfirmarPagamento.dc.html":"/pagamento/confirmar","CentralAjuda.dc.html":"/ajuda","SuporteCliente.dc.html":"/painel/suporte","Recibo.dc.html":"/painel/recibo","Termos.dc.html":"/termos","Privacidade.dc.html":"/privacidade","Planos.dc.html":"/#precos","PaginaPublica.dc.html":"/","PaginaFechada.dc.html":"/"};</script>

<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { loading: true, o: null, u: null }; }
  async componentDidMount() {
    const code = new URLSearchParams(location.search).get('c') || '';
    const [r, m] = await Promise.all([DC.api('orders/' + encodeURIComponent(code)), DC.api('me')]);
    if (r.status === 401) { location.href = '/entrar'; return; }
    this.setState({ loading: false, o: r.ok && r.order.status === 'liberado' ? r.order : null, u: m.ok ? m.user : null });
  }
  renderVals() {
    const s = this.state, o = s.o, u = s.u || {};
    const d = (t) => (t ? new Date(t).toLocaleDateString('pt-BR') : '—');
    return {
      loading: s.loading, missing: !s.loading && !o, ok: !!o, o: o || {},
      rows: o ? [
        { k: 'Cliente', v: u.name || '—' }, { k: 'E-mail', v: u.email || '—' },
        { k: 'Plano', v: o.planName + ' ' + o.periodName }, { k: 'Período', v: d(o.periodStart) + ' a ' + d(o.periodEnd) },
        { k: 'Forma de pagamento', v: 'Pix' }, { k: 'Pago em', v: d(o.paidAt) }
      ] : [],
      print: () => window.print()
    };
  }
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
DC.mount(document.getElementById('root'), "\n<div>\n  <div class=\"appbar\"><a class=\"icon-btn\" href=\"/painel/plano\" aria-label=\"Voltar\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M15 5l-7 7 7 7\"/></svg></a><h1>Recibo</h1></div>\n  <div class=\"app-main\">\n    <sc-if value=\"{{loading}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color: #9C9CAD; padding-top: 30px\">Carregando…</div></sc-if>\n    <sc-if value=\"{{missing}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"card\" style=\"padding: 20px; color: #C9C9D6\">Recibo não encontrado.</div></sc-if>\n    <sc-if value=\"{{ok}}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"rc\">\n        <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 10px\">\n          <div><b style=\"font: 700 22px 'Space Grotesk'\">WhiteLink</b><div class=\"k\">GM DIGITAL · WhatsApp (11) 99393-1841</div></div>\n          <div style=\"text-align: right\"><div class=\"k\">RECIBO</div><b style=\"font: 700 17px 'Space Mono'\">{{o.code}}</b></div>\n        </div>\n        <div style=\"height: 1px; background: #DDDAD0\"></div>\n        <div class=\"g\">\n          <sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"6\"><div><div class=\"k\">{{r.k}}</div><div class=\"v\">{{r.v}}</div></div></sc-for>\n        </div>\n        <div style=\"height: 1px; background: #DDDAD0\"></div>\n        <div style=\"display: flex; justify-content: space-between; align-items: baseline\"><b>Total pago</b><b style=\"font: 700 28px 'Space Grotesk'\">{{o.value}}</b></div>\n        <span class=\"k\">Este recibo comprova o pagamento do plano. Não substitui nota fiscal.</span>\n      </div>\n      <button class=\"btn full no-print\" onClick=\"{{print}}\" style=\"margin-top: 14px\">Salvar em PDF ou imprimir</button>\n    </sc-if>\n  </div>\n</div>\n", Component, {});
(async()=>{const d=await DC.api('me');if(d.status===401)location.href='/entrar?next='+encodeURIComponent(location.pathname+location.search);})();
</script>
