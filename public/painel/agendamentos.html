@keyframes fxGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
.fx-pulse{animation:fxPulse 1.8s ease-out infinite}.fx-shake{animation:fxShake 2.4s ease-in-out infinite}.fx-glow{animation:fxGlow 1.6s ease-in-out infinite}
.prev{padding:16px;border-radius:16px;background:#D4FF3A;color:#0E0E14;font-weight:700;text-align:center;margin:6px 0 16px}

<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { d: null, sel: null, saved: '' }; }
  async componentDidMount() {
    const d = await DC.api('editor');
    if (d.status === 401) { location.href = '/entrar'; return; }
    this.setState({ d: d.ok ? d : null });
  }
  upd(id, patch) {
    const d = this.state.d;
    d.blocks = d.blocks.map((b) => (b.id === id ? Object.assign({}, b, patch) : b));
    this.setState({ d: d, saved: '' });
  }
  async save() {
    const d = this.state.d;
    const r = await DC.api('editor', 'PUT', { blocks: d.blocks, title: d.profile.title, bio: d.profile.bio, appearance: d.appearance });
    this.setState({ saved: r.ok ? 'Salvo ✓' : 'Não salvou' });
  }
  renderVals() {
    const d = this.state.d;
    if (!d) return { loading: true };
    const lvl = { prata: 0, ouro: 1, diamante: 2 }[d.user.plan] || 0;
    const fmt = (v) => (v ? new Date(v + ':00').toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '');
    const now = Date.now();
    const links = d.blocks.filter((b) => b.kind === 'link');
    const st = (b) => {
      const s = b.start ? Date.parse(b.start + ':00') : 0, e = b.end ? Date.parse(b.end + ':00') : 0;
      if (e && now > e) return ['Expirado', '#26262F', '#9C9CAD'];
      if (s && now < s) return ['Agendado', 'rgba(185,166,255,.16)', '#C8BCFF'];
      if (s || e || b.pin || b.effect || b.titleB) return ['Ativo', 'rgba(212,255,58,.14)', '#D4FF3A'];
      return ['Sempre', '#1B1B24', '#9C9CAD'];
    };
    const b = links.find((x) => x.id === this.state.sel);
    const sw = (on) => 'background: ' + (on ? '#D4FF3A' : '#33333E') + '; justify-content: ' + (on ? 'flex-end' : 'flex-start');
    const kn = (on) => 'background: ' + (on ? '#0E0E14' : '#A7A7B8');
    return {
      loading: false, locked: lvl === 0, ok: lvl >= 1, saved: this.state.saved, none: links.length === 0,
      links: links.map((x) => {
        const s = st(x);
        const parts = [];
        if (x.start) parts.push('de ' + fmt(x.start));
        if (x.end) parts.push('até ' + fmt(x.end));
        if (x.pin) parts.push('fixado');
        if (x.effect) parts.push({ pulse: 'pulsando', shake: 'tremendo', glow: 'brilhando' }[x.effect]);
        if (x.titleB) parts.push('teste A/B');
        return { title: x.title, sub: parts.join(' · ') || 'Aparece sempre', status: s[0], chipStyle: 'background: ' + s[1] + '; color: ' + s[2], open: () => this.setState({ sel: x.id }) };
      }),
      sheet: !!b,
      e: b ? {
        title: b.title, start: b.start || '', end: b.end || '', pin: !!b.pin, pinSw: sw(!!b.pin), pinKnob: kn(!!b.pin),
        setStart: (ev) => this.upd(b.id, { start: ev.target.value }),
        setEnd: (ev) => this.upd(b.id, { end: ev.target.value }),
        togglePin: () => this.upd(b.id, { pin: !b.pin }),
        fx: [['', 'Nenhum'], ['pulse', 'Pulsar'], ['shake', 'Tremer'], ['glow', 'Brilhar']].map((f) => ({ name: f[1], sel: (b.effect || '') === f[0], pick: () => this.upd(b.id, { effect: f[0] }) })),
        fxClass: b.effect ? 'fx-' + b.effect : '',
        ab: lvl === 2, abLocked: lvl === 1, titleB: b.titleB || '', split: b.split || 50,
        splitText: (b.split || 50) + '% das visitas veem o título A · ' + (100 - (b.split || 50)) + '% veem o B',
        setB: (ev) => this.upd(b.id, { titleB: ev.target.value }),
        setSplit: (ev) => this.upd(b.id, { split: Number(ev.target.value) }),
        clear: () => { this.upd(b.id, { start: '', end: '', pin: false, effect: '', titleB: '' }); this.setState({ sel: null }); this.save(); }
      } : {},
      close: () => { this.setState({ sel: null }); this.save(); },
      stop: (ev) => ev.stopPropagation()
    };
  }
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
DC.mount(document.getElementById('root'), "\n<div>\n  <div class=\"appbar\"><a class=\"icon-btn\" href=\"/painel/mais\" aria-label=\"Voltar\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M15 5l-7 7 7 7\"/></svg></a><h1>Agendamentos</h1><button class=\"hq\" data-help=\"agendamentos\" aria-label=\"Ajuda\">?</button><span role=\"status\" style=\"font-size: 12.5px; color: #D4FF3A; padding-right: 10px\">{{saved}}</span></div>\n  <div class=\"app-main\">\n    <sc-if value=\"{{loading}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color: #9C9CAD; padding-top: 30px\">Carregando…</div></sc-if>\n    <sc-if value=\"{{locked}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"card\" style=\"padding: 22px; display: flex; flex-direction: column; gap: 12px; text-align: center; align-items: center; margin-top: 10px\">\n        <b style=\"font-size: 18px\">Links que aparecem e somem sozinhos</b>\n        <span style=\"font-size: 14px; color: #C9C9D6; line-height: 1.5\">No Ouro você escolhe quando cada link aparece, fixa no topo e coloca efeitos de destaque. No Diamante ainda tem o teste A/B de títulos.</span>\n        <a class=\"btn full\" href=\"/painel/plano\" style=\"background: #F2C14E\">Conhecer o Ouro</a>\n      </div>\n    </sc-if>\n    <sc-if value=\"{{ok}}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"font-size: 14px; color: #9C9CAD; margin: 4px 4px 12px\">Toque num link para agendar, fixar ou dar destaque.</div>\n        <div class=\"list\">\n          <sc-for list=\"{{links}}\" as=\"l\" hint-placeholder-count=\"4\">\n            <button class=\"row\" onClick=\"{{l.open}}\"><span class=\"row-tx\"><b>{{l.title}}</b><span>{{l.sub}}</span></span><span class=\"chip\" style=\"{{l.chipStyle}}\">{{l.status}}</span></button>\n          </sc-for>\n          <sc-if value=\"{{none}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"row\" style=\"color: #9C9CAD; cursor: default\">Crie links na aba Página primeiro.</div></sc-if>\n        </div>\n      </div>\n    </sc-if>\n  </div>\n\n  <sc-if value=\"{{sheet}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"scrim\" onClick=\"{{close}}\">\n      <div class=\"sheet\" onClick=\"{{stop}}\">\n        <div class=\"grab\"></div>\n        <h2>{{e.title}}</h2>\n        <label class=\"fld\">Começa a aparecer<input class=\"inp\" type=\"datetime-local\" value=\"{{e.start}}\" onChange=\"{{e.setStart}}\"></label>\n        <label class=\"fld\">Some da página<input class=\"inp\" type=\"datetime-local\" value=\"{{e.end}}\" onChange=\"{{e.setEnd}}\"></label>\n        <div class=\"row\" style=\"padding: 6px 2px; border: none; cursor: default; min-height: 52px\"><span class=\"row-tx\"><b>Fixar no topo</b></span><button class=\"sw\" onClick=\"{{e.togglePin}}\" aria-pressed=\"{{e.pin}}\" style=\"{{e.pinSw}}\"><span style=\"{{e.pinKnob}}\"></span></button></div>\n        <div class=\"sec-t\" style=\"margin-top: 8px\">Efeito<button class=\"hq\" data-help=\"agendamentos\" aria-label=\"Ajuda\">?</button></div>\n        <div class=\"fxs\"><sc-for list=\"{{e.fx}}\" as=\"f\" hint-placeholder-count=\"4\"><button onClick=\"{{f.pick}}\" aria-pressed=\"{{f.sel}}\">{{f.name}}</button></sc-for></div>\n        <div class=\"prev {{e.fxClass}}\" style=\"margin-top: 14px\">{{e.title}}</div>\n        <sc-if value=\"{{e.ab}}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <div class=\"sec-t\">Teste A/B do título<button class=\"hq\" data-help=\"autoab\" aria-label=\"Ajuda\">?</button></div>\n            <label class=\"fld\">Título B<input class=\"inp\" value=\"{{e.titleB}}\" onInput=\"{{e.setB}}\" maxlength=\"80\" placeholder=\"Outro jeito de escrever o mesmo link\"></label>\n            <label class=\"fld\">{{e.splitText}}<input type=\"range\" min=\"10\" max=\"90\" step=\"10\" value=\"{{e.split}}\" onInput=\"{{e.setSplit}}\"></label>\n          </div>\n        </sc-if>\n        <sc-if value=\"{{e.abLocked}}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size: 13px; color: #9C9CAD; margin: 0 0 14px\">Teste A/B de títulos: só no <a href=\"/painel/plano\">Diamante</a>.</p></sc-if>\n        <button class=\"btn full\" onClick=\"{{close}}\">Salvar</button>\n        <button class=\"btn ghost full\" onClick=\"{{e.clear}}\" style=\"margin-top: 10px\">Limpar agendamento</button>\n      </div>\n    </div>\n  </sc-if>\n</div>\n", Component, {});
(async()=>{const d=await DC.api('me');if(d.status===401)location.href='/entrar?next='+encodeURIComponent(location.pathname+location.search);})();
</script>
